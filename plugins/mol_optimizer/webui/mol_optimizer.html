<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("molOptimizer", {
      smiles: "", strategy: "bioisostere_carboxyl_tetrazole",
      strategies: [], mutants: [], loading: false, error: "",

      async onOpen() {
        try {
          const r = await callJsonApi("plugins/mol_optimizer/mol_optimizer", { action: "strategies" });
          this.strategies = r.strategies || [];
        } catch (e) {}
      },

      async mutate() {
        if (!this.smiles) { this.error = "Enter a SMILES string"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("plugins/mol_optimizer/mol_optimizer", { action: "mutate", smiles: this.smiles, strategy: this.strategy });
          if (!r.success) { this.error = r.error; } else { this.mutants = r.mutants; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      sendToDocking(smiles) {
        const t = document.querySelector("#chat-input");
        if (t) { t.focus(); t.value = "Dock this molecule: " + smiles; t.dispatchEvent(new Event("input", { bubbles: true })); }
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel">
    <div class="panel-header"><div class="header-left"><span class="material-symbols-outlined header-icon">auto_fix_high</span><div><h2>Molecular Optimizer</h2><p class="header-subtitle">AI-driven lead optimization</p></div></div></div>
    <div class="panel-body">
      <div x-show="$store.molOptimizer.error" class="dock-error" x-text="$store.molOptimizer.error"></div>

      <input type="text" x-model="$store.molOptimizer.smiles" placeholder="Source SMILES" class="mt-input" style="margin-bottom:8px" />
      <select x-model="$store.molOptimizer.strategy" class="mt-input" style="margin-bottom:8px">
        <template x-for="s in $store.molOptimizer.strategies" :key="s.id">
          <option :value="s.id" x-text="s.desc"></option>
        </template>
      </select>

      <button class="btn-run" @click="$store.molOptimizer.mutate()" :disabled="$store.molOptimizer.loading || !$store.molOptimizer.smiles">Generate Mutants</button>

      <div x-show="$store.molOptimizer.loading" class="dock-loading"><div class="loading-spinner"></div><span>Optimizing...</span></div>

      <template x-if="$store.molOptimizer.mutants.length">
        <div style="margin-top:10px">
          <p style="font-size:0.68rem;color:var(--color-text-muted)" x-text="$store.molOptimizer.mutants.length + ' mutant(s) generated'"></p>
          <template x-for="m in $store.molOptimizer.mutants" :key="m.smiles">
            <div style="padding:10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:6px">
              <p style="font-size:0.65rem;font-family:monospace;color:var(--color-text);word-break:break-all;margin:0" x-text="m.smiles"></p>
              <div style="display:flex;gap:8px;margin-top:4px;font-size:0.6rem;color:var(--color-text-muted)">
                <span x-text="'MW: ' + m.mw"></span>
                <span x-text="'LogP: ' + m.logp"></span>
                <span x-text="'HBD: ' + m.hbd"></span>
                <span x-text="'HBA: ' + m.hba"></span>
              </div>
              <button @click="$store.molOptimizer.sendToDocking(m.smiles)" style="margin-top:6px;padding:4px 10px;background:var(--color-primary);border:none;border-radius:4px;color:white;cursor:pointer;font-size:0.6rem">Dock This</button>
            </div>
          </template>
        </div>
      </template>
    </div>

    <style>
      .dock-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .panel-header { padding:14px 20px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0 }
      .header-left { display:flex;align-items:center;gap:12px }
      .header-icon { font-size:28px;color:var(--color-primary) }
      .panel-header h2 { color:var(--color-text);font-size:1.05rem;margin:0;font-weight:700 }
      .header-subtitle { color:var(--color-text-muted);font-size:0.7rem;margin:0 }
      .panel-body { flex:1;overflow-y:auto;padding:16px 20px }
      .dock-error { padding:8px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.68rem;margin-bottom:10px }
      .dock-loading { display:flex;align-items:center;gap:6px;padding:8px 0;font-size:0.7rem;color:var(--color-text-muted) }
      .loading-spinner { width:15px;height:15px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .mt-input { width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-panel);color:var(--color-text);font-size:0.7rem;font-family:monospace;box-sizing:border-box }
      .mt-input:focus { outline:none;border-color:var(--color-primary) }
      .btn-run { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:10px;background:var(--color-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-size:0.8rem;font-weight:600 }
      .btn-run:hover:not(:disabled) { opacity:0.9 }
      .btn-run:disabled { opacity:0.5;cursor:not-allowed }
    </style>
  </div>
</body>
</html>
