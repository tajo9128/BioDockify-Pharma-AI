<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("bioactivity", {
      activeTab: "predict",
      loading: false,
      error: "",
      message: "",

      // Predict tab
      predictSmiles: "",
      targetClass: "general",
      prediction: null,

      // Batch tab
      batchSmiles: "",
      batchTarget: "general",
      batchResults: null,

      // Similar tab
      similarSmiles: "",
      similarTarget: "general",
      similarResults: null,

      // Target classes
      targetClasses: {},

      async init() {
        try {
          const r = await callJsonApi("bioactivity_predictor", { action: "target_classes" });
          this.targetClasses = r.target_classes || {};
        } catch (e) {}
      },

      async predict() {
        if (!this.predictSmiles.trim()) return;
        this.loading = true; this.error = ""; this.prediction = null;
        try {
          const r = await callJsonApi("bioactivity_predictor", {
            action: "predict",
            smiles: this.predictSmiles.trim(),
            target_class: this.targetClass,
          });
          if (r.error) { this.error = r.error; }
          else { this.prediction = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async batchPredict() {
        const list = this.batchSmiles.split("\n").map(s => s.trim()).filter(s => s);
        if (!list.length) return;
        this.loading = true; this.error = ""; this.batchResults = null;
        try {
          const r = await callJsonApi("bioactivity_predictor", {
            action: "batch_predict",
            smiles_list: list,
            target_class: this.batchTarget,
          });
          if (r.error) { this.error = r.error; }
          else { this.batchResults = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async findSimilar() {
        if (!this.similarSmiles.trim()) return;
        this.loading = true; this.error = ""; this.similarResults = null;
        try {
          const r = await callJsonApi("bioactivity_predictor", {
            action: "similar",
            smiles: this.similarSmiles.trim(),
            target_class: this.similarTarget,
          });
          if (r.error) { this.error = r.error; }
          else { this.similarResults = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      activityColor(cls) {
        if (cls?.includes("highly")) return "#22c55e";
        if (cls?.includes("active (")) return "#4ade80";
        if (cls?.includes("moderate")) return "#f59e0b";
        if (cls?.includes("weak")) return "#f97316";
        return "#ef4444";
      },

      confidenceWidth(val) {
        return Math.round(val * 100) + "%";
      },
    });
  </script>
</head>
<body>
  <div x-data x-init="$store.bioactivity.init()" class="ba-panel">

    <div class="ba-header">
      <span class="material-symbols-outlined ba-icon">biotech</span>
      <div><h2>Bioactivity Predictor</h2>
      <p class="ba-sub">IC50/pIC50 prediction · SAR analysis · Similarity search</p></div>
    </div>

    <div class="ba-tabs">
      <button class="ba-tab" :class="{active:$store.bioactivity.activeTab==='predict'}" @click="$store.bioactivity.activeTab='predict'">
        <span class="material-symbols-outlined">target</span> Predict</button>
      <button class="ba-tab" :class="{active:$store.bioactivity.activeTab==='batch'}" @click="$store.bioactivity.activeTab='batch'">
        <span class="material-symbols-outlined">playlist_add_check</span> Batch</button>
      <button class="ba-tab" :class="{active:$store.bioactivity.activeTab==='similar'}" @click="$store.bioactivity.activeTab='similar'">
        <span class="material-symbols-outlined">search</span> Similar Actives</button>
    </div>

    <div x-show="$store.bioactivity.error" class="ba-error" x-text="$store.bioactivity.error"></div>
    <div x-show="$store.bioactivity.message" class="ba-msg" x-text="$store.bioactivity.message"></div>
    <div x-show="$store.bioactivity.loading" class="ba-loading"><div class="loading-spinner"></div> Predicting bioactivity...</div>

    <!-- PREDICT TAB -->
    <div x-show="$store.bioactivity.activeTab==='predict'" class="ba-body">
      <h3>Predict IC50 / Bioactivity</h3>
      <div class="ba-section">
        <label class="ba-label">Molecule (SMILES)</label>
        <input type="text" x-model="$store.bioactivity.predictSmiles" class="ba-input"
          placeholder="e.g. c1ccc(Nc2nccc(-c3cn[nH]c3)n2)cc1" />
      </div>
      <div class="ba-section">
        <label class="ba-label">Target Class</label>
        <select x-model="$store.bioactivity.targetClass" class="ba-select">
          <template x-for="(info, key) in $store.bioactivity.targetClasses" :key="key">
            <option :value="key" x-text="info.name || key"></option>
          </template>
        </select>
      </div>
      <button class="ba-btn" @click="$store.bioactivity.predict()" :disabled="$store.bioactivity.loading">
        <span class="material-symbols-outlined">play_arrow</span> Predict
      </button>

      <template x-if="$store.bioactivity.prediction">
        <div class="ba-result-card">
          <div class="ba-result-header">
            <div class="ba-pic50-box">
              <span class="ba-pic50-value" x-text="$store.bioactivity.prediction.predicted_pic50"></span>
              <span class="ba-pic50-label">pIC50</span>
            </div>
            <div class="ba-ic50-box">
              <span x-text="$store.bioactivity.prediction.predicted_ic50_nM + ' nM'"></span>
              <span class="ba-pic50-label">IC50</span>
            </div>
            <div class="ba-activity-badge" :style="'background:' + $store.bioactivity.activityColor($store.bioactivity.prediction.activity_class) + '22; color:' + $store.bioactivity.activityColor($store.bioactivity.prediction.activity_class)">
              <span x-text="$store.bioactivity.prediction.activity_class"></span>
            </div>
          </div>

          <div class="ba-confidence">
            <span class="ba-label">Confidence</span>
            <div class="ba-conf-bar">
              <div class="ba-conf-fill" :style="'width:' + $store.bioactivity.confidenceWidth($store.bioactivity.prediction.confidence)"></div>
            </div>
            <span x-text="$store.bioactivity.confidenceWidth($store.bioactivity.prediction.confidence)"></span>
          </div>

          <div class="ba-details">
            <div class="ba-detail-row">
              <span>Target:</span> <strong x-text="$store.bioactivity.prediction.target_name"></strong>
            </div>
            <div class="ba-detail-row">
              <span>Method:</span> <span x-text="$store.bioactivity.prediction.method"></span>
            </div>
            <div class="ba-detail-row" x-show="$store.bioactivity.prediction.sar_features?.length">
              <span>SAR Features:</span>
              <div class="ba-sar-tags">
                <template x-for="f in ($store.bioactivity.prediction.sar_features || [])" :key="f">
                  <span class="ba-sar-tag" x-text="f"></span>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- BATCH TAB -->
    <div x-show="$store.bioactivity.activeTab==='batch'" class="ba-body">
      <h3>Batch Prediction</h3>
      <div class="ba-section">
        <label class="ba-label">Molecules (one SMILES per line, max 50)</label>
        <textarea x-model="$store.bioactivity.batchSmiles" class="ba-textarea" rows="5"
          placeholder="CC(=O)OC1=CC=CC=C1C(=O)O&#10;CC(C)Cc1ccc(cc1)C(C)C(=O)O&#10;c1ccc(Nc2nccc(n2)-c2cn[nH]c2)cc1"></textarea>
      </div>
      <div class="ba-section">
        <label class="ba-label">Target Class</label>
        <select x-model="$store.bioactivity.batchTarget" class="ba-select">
          <template x-for="(info, key) in $store.bioactivity.targetClasses" :key="key">
            <option :value="key" x-text="info.name || key"></option>
          </template>
        </select>
      </div>
      <button class="ba-btn" @click="$store.bioactivity.batchPredict()" :disabled="$store.bioactivity.loading">
        <span class="material-symbols-outlined">play_arrow</span> Predict All
      </button>

      <template x-if="$store.bioactivity.batchResults">
        <div class="ba-batch-results">
          <div class="ba-batch-summary">
            <span>Predicted: <strong x-text="$store.bioactivity.batchResults.summary?.predicted || 0"></strong></span>
            <span>Active: <strong x-text="$store.bioactivity.batchResults.summary?.num_active || 0"></strong></span>
            <span>Highly Active: <strong x-text="$store.bioactivity.batchResults.summary?.num_highly_active || 0"></strong></span>
            <span>Mean pIC50: <strong x-text="$store.bioactivity.batchResults.summary?.mean_pic50 || '-'"></strong></span>
          </div>
          <div class="ba-batch-table">
            <div class="ba-table-head">
              <span>SMILES</span><span>pIC50</span><span>IC50 (nM)</span><span>Activity</span>
            </div>
            <template x-for="(p, i) in ($store.bioactivity.batchResults.predictions || [])" :key="i">
              <div class="ba-table-row" x-show="!p.error">
                <code x-text="(p.smiles || '').substring(0, 30) + (p.smiles?.length > 30 ? '...' : '')"></code>
                <span x-text="p.predicted_pic50"></span>
                <span x-text="p.predicted_ic50_nM"></span>
                <span class="ba-act-cell" :style="'color:' + $store.bioactivity.activityColor(p.activity_class)" x-text="p.activity_class"></span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- SIMILAR TAB -->
    <div x-show="$store.bioactivity.activeTab==='similar'" class="ba-body">
      <h3>Find Similar Active Compounds</h3>
      <div class="ba-section">
        <label class="ba-label">Query Molecule (SMILES)</label>
        <input type="text" x-model="$store.bioactivity.similarSmiles" class="ba-input"
          placeholder="Enter SMILES to find similar known actives" />
      </div>
      <div class="ba-section">
        <label class="ba-label">Target Class</label>
        <select x-model="$store.bioactivity.similarTarget" class="ba-select">
          <option value="general">All Classes</option>
          <template x-for="(info, key) in $store.bioactivity.targetClasses" :key="key">
            <option :value="key" x-text="info.name || key"></option>
          </template>
        </select>
      </div>
      <button class="ba-btn" @click="$store.bioactivity.findSimilar()" :disabled="$store.bioactivity.loading">
        <span class="material-symbols-outlined">search</span> Find Similar
      </button>

      <template x-if="$store.bioactivity.similarResults">
        <div class="ba-similar-results">
          <p x-text="'Found ' + ($store.bioactivity.similarResults.num_similar || 0) + ' similar active compounds'"></p>
          <template x-for="(hit, i) in ($store.bioactivity.similarResults.similar_actives || [])" :key="i">
            <div class="ba-hit-card">
              <strong x-text="hit.name"></strong>
              <code class="ba-smi" x-text="hit.smiles"></code>
              <div class="ba-hit-meta">
                <span>Similarity: <strong x-text="hit.similarity"></strong></span>
                <span>pIC50: <strong x-text="hit.pic50"></strong></span>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

  </div>

  <style>
    .ba-panel { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
    .ba-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .ba-icon { font-size: 2rem; color: var(--color-primary, #6366f1); }
    .ba-header h2 { margin: 0; font-size: 1.4rem; }
    .ba-sub { margin: 0; opacity: 0.6; font-size: 0.85rem; }
    .ba-tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--color-border, #333); margin-bottom: 1.5rem; }
    .ba-tab { background: none; border: none; padding: 0.6rem 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; color: var(--color-text, #ccc); font-size: 0.85rem; border-bottom: 2px solid transparent; }
    .ba-tab.active { color: var(--color-primary, #6366f1); border-bottom-color: var(--color-primary, #6366f1); }
    .ba-tab .material-symbols-outlined { font-size: 1.1rem; }
    .ba-error { background: #1c0a0a; border: 1px solid #ef4444; color: #f87171; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .ba-msg { background: #0a1c1a; border: 1px solid #22c55e; color: #4ade80; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .ba-loading { text-align: center; padding: 2rem; color: var(--color-primary, #6366f1); }
    .ba-body { animation: fadeIn 0.2s; }
    .ba-body h3 { font-size: 1.1rem; margin: 0 0 1rem 0; }
    .ba-section { margin-bottom: 1rem; }
    .ba-label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.4rem; }
    .ba-input { width: 100%; padding: 0.65rem 0.8rem; background: var(--color-panel, #1a1a2e); border: 1px solid var(--color-border, #333); border-radius: 6px; color: inherit; font-family: monospace; font-size: 0.9rem; }
    .ba-textarea { width: 100%; padding: 0.65rem 0.8rem; background: var(--color-panel, #1a1a2e); border: 1px solid var(--color-border, #333); border-radius: 6px; color: inherit; font-family: monospace; font-size: 0.85rem; resize: vertical; }
    .ba-select { padding: 0.5rem 0.8rem; background: var(--color-panel, #1a1a2e); border: 1px solid var(--color-border, #333); border-radius: 6px; color: inherit; font-size: 0.85rem; }
    .ba-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--color-primary, #6366f1); color: #fff; border: none; padding: 0.65rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-top: 0.5rem; }
    .ba-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ba-result-card { background: var(--color-panel, #1a1a2e); border: 1px solid var(--color-border, #333); border-radius: 10px; padding: 1.25rem; margin-top: 1.5rem; }
    .ba-result-header { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .ba-pic50-box, .ba-ic50-box { text-align: center; }
    .ba-pic50-value { font-size: 2rem; font-weight: 700; display: block; }
    .ba-pic50-label { font-size: 0.75rem; opacity: 0.5; }
    .ba-activity-badge { padding: 0.4rem 0.8rem; border-radius: 99px; font-size: 0.8rem; font-weight: 500; }
    .ba-confidence { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .ba-conf-bar { flex: 1; height: 8px; background: #ffffff10; border-radius: 4px; overflow: hidden; }
    .ba-conf-fill { height: 100%; background: var(--color-primary, #6366f1); border-radius: 4px; transition: width 0.3s; }
    .ba-details { border-top: 1px solid var(--color-border, #222); padding-top: 0.75rem; }
    .ba-detail-row { display: flex; gap: 0.5rem; font-size: 0.85rem; margin-bottom: 0.4rem; align-items: flex-start; }
    .ba-sar-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .ba-sar-tag { background: #6366f122; color: #a5b4fc; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
    .ba-batch-results { margin-top: 1.5rem; }
    .ba-batch-summary { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; font-size: 0.85rem; }
    .ba-batch-table { font-size: 0.8rem; }
    .ba-table-head { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr; gap: 0.5rem; padding: 0.5rem; font-weight: 600; opacity: 0.7; border-bottom: 1px solid var(--color-border, #333); }
    .ba-table-row { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr; gap: 0.5rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--color-border, #1a1a2e); }
    .ba-act-cell { font-size: 0.75rem; }
    .ba-similar-results { margin-top: 1rem; }
    .ba-hit-card { background: var(--color-panel, #1a1a2e); border: 1px solid var(--color-border, #333); border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .ba-smi { display: block; font-size: 0.8rem; margin: 0.3rem 0; word-break: break-all; opacity: 0.7; }
    .ba-hit-meta { display: flex; gap: 1.5rem; font-size: 0.8rem; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</body>
</html>
