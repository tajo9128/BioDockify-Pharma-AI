<html>
<head>
  <script type="module">
    import { store } from "/components/knowledge/knowledge-store.js";
  </script>
</head>
<body>
  <div x-data class="kb-panel" x-init="$store.knowledgeModal.restore()">

    <!-- Full Screen Reader (when reading a file) -->
    <template x-if="$store.knowledgeModal.readingPaper">
      <div class="kb-reader">
        <div class="kb-reader-header">
          <button class="kb-btn-back" @click="$store.knowledgeModal.readingPaper = null">
            <span class="material-symbols-outlined">arrow_back</span> Back to list
          </button>
          <span class="kb-reader-title" x-text="$store.knowledgeModal.readingPaper.question || $store.knowledgeModal.readingPaper.title || 'Untitled'"></span>
        </div>
        <div class="kb-reader-content" x-html="($store.knowledgeModal.readingPaper.full_text || $store.knowledgeModal.readingPaper.answer || '').replace(/\n/g, '<br>')"></div>
      </div>
    </template>

    <!-- Main List View (when not reading) -->
    <template x-if="!$store.knowledgeModal.readingPaper">
      <div class="kb-main-view">
        <!-- Header -->
        <div class="kb-header">
          <span class="material-symbols-outlined kb-icon">folder_open</span>
          <div>
            <h2>Knowledge Base</h2>
            <p class="kb-sub" x-text="$store.knowledgeModal.entryCount + ' files · ' + ($store.knowledgeModal.selectedIds.length) + ' selected'"></p>
          </div>
          <div class="kb-header-actions">
            <button class="kb-btn-sm" @click="$store.knowledgeModal.loadAllEntries()" :disabled="$store.knowledgeModal.loading" title="Refresh">
              <span class="material-symbols-outlined">refresh</span>
            </button>
            <button class="kb-btn-sm" @click="$store.knowledgeModal.triggerUploadRestore()" :disabled="$store.knowledgeModal.uploading" title="Upload files">
              <span class="material-symbols-outlined">upload_file</span>
            </button>
          </div>
        </div>

        <!-- Selection Action Bar (appears when files are selected) -->
        <div class="kb-action-bar" x-show="$store.knowledgeModal.selectedIds.length > 0">
          <span class="kb-selected-count" x-text="$store.knowledgeModal.selectedIds.length + ' selected'"></span>
          <div class="kb-action-buttons">
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('thesis')" title="Send to Thesis Writer">
              <span class="material-symbols-outlined" style="font-size:15px">school</span> Thesis
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('review')" title="Send to Literature Review">
              <span class="material-symbols-outlined" style="font-size:15px">rate_review</span> Review
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('podcast')" title="Send to Podcast">
              <span class="material-symbols-outlined" style="font-size:15px">podcasts</span> Podcast
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('ppt')" title="Send to PPT Generator">
              <span class="material-symbols-outlined" style="font-size:15px">slideshow</span> Slides
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('export')" title="Export Selected">
              <span class="material-symbols-outlined" style="font-size:15px">download</span> Export
            </button>
          </div>
          <button class="kb-btn-clear" @click="$store.knowledgeModal.clearSelection()" title="Clear selection">
            <span class="material-symbols-outlined" style="font-size:15px">close</span>
          </button>
        </div>

        <!-- Error / Message -->
        <div x-show="$store.knowledgeModal.error" class="kb-error" x-text="$store.knowledgeModal.error"></div>
        <div x-show="$store.knowledgeModal.message" class="kb-msg" x-text="$store.knowledgeModal.message"></div>
        <div x-show="$store.knowledgeModal.loading" class="kb-loading"><div class="kb-spinner"></div> <span>Loading files...</span></div>

        <!-- Body: Category Sidebar + File Grid -->
        <div class="kb-body">
          <!-- Category Sidebar -->
          <div class="kb-sidebar">
            <div class="kb-sidebar-section">
              <div class="kb-sidebar-header">
                <span class="kb-sidebar-title">Categories</span>
                <button class="kb-add-cat-btn" @click="$store.knowledgeModal.showAddCategory = !$store.knowledgeModal.showAddCategory" title="Add category">
                  <span class="material-symbols-outlined" style="font-size:14px">add</span>
                </button>
              </div>
              <!-- Add new category form -->
              <div x-show="$store.knowledgeModal.showAddCategory" class="kb-new-cat-form">
                <input type="text" x-model="$store.knowledgeModal.newCategoryName" placeholder="Category name..."
                  class="kb-cat-input" @keyup.enter="$store.knowledgeModal.createCategory()" />
                <button class="kb-cat-add" @click="$store.knowledgeModal.createCategory()">Add</button>
              </div>
              <!-- Category list -->
              <button class="kb-cat-item" :class="{active: $store.knowledgeModal.activeCategory==='all'}" @click="$store.knowledgeModal.activeCategory='all'">
                <span class="material-symbols-outlined" style="font-size:15px">folder</span> All Files
                <span class="kb-cat-count" x-text="$store.knowledgeModal.entryCount"></span>
              </button>
              <template x-for="cat in $store.knowledgeModal.allCategories" :key="cat.key">
                <button class="kb-cat-item" :class="{active: $store.knowledgeModal.activeCategory===cat.key}" @click="$store.knowledgeModal.activeCategory=cat.key">
                  <span class="material-symbols-outlined" style="font-size:15px" x-text="cat.key==='literature'||cat.key==='deep_research'?'article':cat.key==='docking'||cat.key==='drug_analysis'?'science':cat.key==='notes'?'note':cat.key==='faculty'?'school':cat.key==='books'?'menu_book':'folder'"></span>
                  <span x-text="cat.label"></span>
                </button>
              </template>
            </div>
            <!-- Select All checkbox -->
            <div class="kb-select-all">
              <label class="kb-checkbox-label">
                <input type="checkbox" :checked="$store.knowledgeModal.selectedIds.length === $store.knowledgeModal.recentEntries.length && $store.knowledgeModal.recentEntries.length > 0"
                  @change="$store.knowledgeModal.selectAll()">
                <span>Select All</span>
              </label>
            </div>
          </div>

          <!-- File Grid -->
          <div class="kb-file-area">
            <!-- Empty state -->
            <div x-show="!$store.knowledgeModal.loading && $store.knowledgeModal.entryCount === 0" class="kb-empty">
              <span class="material-symbols-outlined" style="font-size:40px;opacity:0.2">folder_open</span>
              <p>No files saved yet.</p>
              <button class="kb-btn-upload-big" @click="$store.knowledgeModal.triggerUploadRestore()">
                <span class="material-symbols-outlined">upload_file</span> Upload Files
              </button>
              <p style="font-size:0.55rem;margin-top:8px;color:var(--color-text-muted)">Supports: PDF, DOCX, XLSX, CSV, PPT, SDF, PDB, TXT, MD, JSON, images, audio</p>
            </div>

            <!-- File Grid -->
            <div class="kb-file-grid" x-show="!$store.knowledgeModal.loading && $store.knowledgeModal.entryCount > 0">
              <template x-for="(entry, idx) in $store.knowledgeModal.categoryFilteredEntries" :key="entry.id || idx">
                <div class="kb-file-card" :class="{selected: $store.knowledgeModal.isSelected(entry.id)}">
                  <!-- Checkbox -->
                  <label class="kb-checkbox" @click.stop="$store.knowledgeModal.toggleSelection(entry.id)">
                    <input type="checkbox" :checked="$store.knowledgeModal.isSelected(entry.id)">
                  </label>
                  <!-- File icon -->
                  <span class="kb-file-card-icon" @click="$store.knowledgeModal.readEntry(entry)">
                    <span class="material-symbols-outlined" style="font-size:28px" x-text="entry.source && entry.source.includes('Literature') || (entry.tags||[]).includes('literature') ? 'article' : (entry.tags||[]).includes('notes') ? 'note' : (entry.tags||[]).includes('docking') ? 'science' : 'description'"></span>
                  </span>
                  <!-- File info -->
                  <div class="kb-file-card-info" @click="$store.knowledgeModal.readEntry(entry)">
                    <div class="kb-file-card-name" x-text="entry.question || entry.title || 'Untitled'"></div>
                    <div class="kb-file-card-meta">
                      <span x-text="entry.source || 'Knowledge Base'"></span>
                      <span x-show="entry.contentLength" x-text="entry.contentLength > 1000 ? Math.round(entry.contentLength/1000)+'KB' : (entry.contentLength||0)+'B'"></span>
                      <span x-text="(entry.createdAt||'').substring(0,10)"></span>
                    </div>
                    <div class="kb-file-card-tags">
                      <template x-for="tag in (entry.tags||[]).slice(0,3)" :key="tag">
                        <span class="kb-tag" x-text="tag"></span>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- Upload zone -->
            <div class="kb-upload-zone" x-show="$store.knowledgeModal.entryCount > 0">
              <button class="kb-btn-upload" @click="$store.knowledgeModal.triggerUploadRestore()" :disabled="$store.knowledgeModal.uploading">
                <span class="material-symbols-outlined">add</span> Add Files
              </button>
            </div>
          </div>
        </div>

        <div x-show="$store.knowledgeModal.uploading" class="kb-loading"><div class="kb-spinner"></div> <span>Uploading...</span></div>
      </div>
    </template>

    <style>
      .kb-panel{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background);font-family:inherit}
      .kb-reader{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background)}
      .kb-reader-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--color-border);background:var(--color-panel)}
      .kb-btn-back{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--color-primary);border:none;border-radius:6px;color:white;font-size:0.7rem;cursor:pointer}
      .kb-reader-title{flex:1;font-size:0.8rem;font-weight:600;color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .kb-reader-content{flex:1;overflow-y:auto;padding:20px;font-size:0.75rem;color:var(--color-text);line-height:1.8}
      .kb-main-view{display:flex;flex-direction:column;height:100%;overflow:hidden}
      .kb-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0}
      .kb-icon{font-size:24px;color:var(--color-primary)}
      .kb-header h2{font-size:0.95rem;margin:0;font-weight:700;color:var(--color-text)}
      .kb-sub{font-size:0.62rem;color:var(--color-text-muted);margin:0}
      .kb-header-actions{margin-left:auto;display:flex;gap:4px}
      .kb-btn-sm{padding:6px 8px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:6px;color:var(--color-text-muted);cursor:pointer;display:flex;align-items:center}
      .kb-btn-sm:hover{border-color:var(--color-primary)}
      .kb-action-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:color-mix(in srgb,var(--color-primary)8%,var(--color-panel));border-bottom:1px solid var(--color-border);flex-shrink:0;flex-wrap:wrap}
      .kb-selected-count{font-size:0.65rem;font-weight:600;color:var(--color-primary);flex-shrink:0}
      .kb-action-buttons{display:flex;gap:4px;flex-wrap:wrap}
      .kb-action-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--color-primary);border:none;border-radius:5px;color:white;font-size:0.6rem;cursor:pointer;font-weight:600}
      .kb-action-btn:hover{background:color-mix(in srgb,var(--color-primary)85%,black)}
      .kb-btn-clear{padding:5px;background:transparent;border:1px solid var(--color-border);border-radius:5px;color:var(--color-text-muted);cursor:pointer;display:flex;align-items:center}
      .kb-error{padding:8px 12px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.65rem;margin:8px 16px}
      .kb-msg{padding:8px 12px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:6px;color:#22c55e;font-size:0.65rem;margin:8px 16px}
      .kb-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:0.7rem;color:var(--color-text-muted)}
      .kb-spinner{width:16px;height:16px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:kb-spin 0.8s linear infinite}
      @keyframes kb-spin{to{transform:rotate(360deg)}}
      .kb-body{display:flex;flex:1;overflow:hidden}
      .kb-sidebar{width:180px;flex-shrink:0;border-right:1px solid var(--color-border);background:var(--color-panel);overflow-y:auto;display:flex;flex-direction:column}
      .kb-sidebar-section{flex:1;padding:8px 0}
      .kb-sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px}
      .kb-sidebar-title{font-size:0.65rem;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.5px}
      .kb-add-cat-btn{background:none;border:none;color:var(--color-primary);cursor:pointer;padding:2px;display:flex;align-items:center}
      .kb-new-cat-form{display:flex;gap:4px;padding:4px 8px 8px}
      .kb-cat-input{flex:1;padding:4px 6px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-background);color:var(--color-text);font-size:0.58rem}
      .kb-cat-add{padding:4px 8px;background:var(--color-primary);border:none;border-radius:4px;color:white;font-size:0.58rem;cursor:pointer}
      .kb-cat-item{display:flex;align-items:center;gap:6px;width:100%;padding:6px 12px;border:none;background:transparent;color:var(--color-text);font-size:0.62rem;cursor:pointer;text-align:left;transition:background 0.15s}
      .kb-cat-item:hover{background:color-mix(in srgb,var(--color-primary)5%,transparent)}
      .kb-cat-item.active{background:color-mix(in srgb,var(--color-primary)12%,transparent);color:var(--color-primary);font-weight:600}
      .kb-cat-count{margin-left:auto;font-size:0.55rem;color:var(--color-text-muted);background:var(--color-background);padding:1px 5px;border-radius:3px}
      .kb-select-all{padding:8px 12px;border-top:1px solid var(--color-border)}
      .kb-checkbox-label{display:flex;align-items:center;gap:6px;font-size:0.6rem;color:var(--color-text);cursor:pointer}
      .kb-checkbox-label input{width:14px;height:14px;cursor:pointer}
      .kb-file-area{flex:1;overflow-y:auto;padding:8px 12px}
      .kb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--color-text-muted);text-align:center;height:100%}
      .kb-empty p{font-size:0.7rem;margin:4px 0}
      .kb-btn-upload-big{display:flex;align-items:center;gap:6px;margin-top:12px;padding:10px 20px;background:var(--color-primary);border:none;border-radius:8px;color:white;font-size:0.7rem;cursor:pointer}
      .kb-file-grid{display:flex;flex-direction:column;gap:4px}
      .kb-file-card{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;transition:all 0.15s;position:relative}
      .kb-file-card:hover{border-color:var(--color-primary)}
      .kb-file-card.selected{border-color:var(--color-primary);background:color-mix(in srgb,var(--color-primary)5%,var(--color-panel))}
      .kb-checkbox{flex-shrink:0;cursor:pointer;display:flex;align-items:center;padding-top:4px}
      .kb-checkbox input{width:16px;height:16px;cursor:pointer}
      .kb-file-card-icon{flex-shrink:0;color:var(--color-primary);cursor:pointer;padding-top:2px}
      .kb-file-card-info{flex:1;min-width:0;cursor:pointer}
      .kb-file-card-name{font-size:0.68rem;font-weight:600;color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .kb-file-card-meta{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
      .kb-file-card-meta span{font-size:0.52rem;color:var(--color-text-muted)}
      .kb-file-card-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
      .kb-tag{font-size:0.5rem;padding:1px 5px;background:color-mix(in srgb,var(--color-primary)8%,transparent);border-radius:3px;color:var(--color-primary)}
      .kb-upload-zone{padding:10px 0}
      .kb-btn-upload{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;background:transparent;border:1px dashed var(--color-border);border-radius:6px;color:var(--color-text-muted);font-size:0.62rem;cursor:pointer}
      .kb-btn-upload:hover{border-color:var(--color-primary);color:var(--color-primary)}
    </style>
  </div>
</body>
</html>
