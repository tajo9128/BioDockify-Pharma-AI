<html>
<head>
  <script type="module">
    import { store } from "/components/knowledge/knowledge-store.js";
  </script>
</head>
<body>
  <div x-data class="kb-panel" x-init="$store.knowledgeModal.restore()">

    <!-- Full Screen Reader (when reading a file) -->
    <template x-if="$store.knowledgeModal.readingPaper">
      <div class="kb-reader">
        <div class="kb-reader-header">
          <button class="kb-btn-back" @click="$store.knowledgeModal.readingPaper = null">
            <span class="material-symbols-outlined">arrow_back</span> Back to list
          </button>
          <span class="kb-reader-title" x-text="$store.knowledgeModal.readingPaper.question || $store.knowledgeModal.readingPaper.title || 'Untitled'"></span>
          <div class="kb-reader-actions">
            <!-- View Original (PDF/DOCX) — opens in new tab -->
            <button class="kb-btn-sm" x-show="$store.knowledgeModal.readingPaper.has_original" @click="$store.knowledgeModal.viewOriginal()" :title="'View original ' + ($store.knowledgeModal.readingPaper.file_type || '').toUpperCase()">
              <span class="material-symbols-outlined" style="font-size:16px">visibility</span>
              <span x-text="'View ' + ($store.knowledgeModal.readingPaper.file_type || 'original').toUpperCase()"></span>
            </button>
            <!-- Download Original -->
            <button class="kb-btn-sm" x-show="$store.knowledgeModal.readingPaper.has_original" @click="$store.knowledgeModal.downloadOriginal()" title="Download original file">
              <span class="material-symbols-outlined" style="font-size:16px">download</span> Original
            </button>
            <button class="kb-btn-sm" @click="$store.knowledgeModal.downloadDocx()" title="Download DOCX">
              <span class="material-symbols-outlined" style="font-size:16px">article</span> DOCX
            </button>
          </div>
        </div>
        <!-- File type badge -->
        <div x-show="$store.knowledgeModal.readingPaper.has_original" style="padding:4px 16px;background:rgba(var(--color-primary-rgb,59,130,246),0.08);font-size:0.6rem;color:var(--color-primary);display:flex;align-items:center;gap:4px">
          <span class="material-symbols-outlined" style="font-size:14px">picture_as_pdf</span>
          <span x-text="'Original ' + ($store.knowledgeModal.readingPaper.file_type || 'file').toUpperCase() + ' available — click View above to open in new tab, or showing extracted text below.'"></span>
        </div>
        <!-- Markdown-rendered content with proper formatting -->
        <div class="kb-reader-content" x-html="$store.knowledgeModal.renderMarkdown($store.knowledgeModal.readingPaper.full_text || $store.knowledgeModal.readingPaper.answer || '')"></div>
      </div>
    </template>

    <!-- Notebook LM 3-Column View -->
    <template x-if="$store.knowledgeModal.showNotebooks && !$store.knowledgeModal.readingPaper">
      <div class="nb-container">
        <!-- Notebook header bar -->
        <div class="nb-topbar">
          <button class="nb-btn-back" @click="$store.knowledgeModal.showNotebooks = false">
            <span class="material-symbols-outlined" style="font-size:16px">arrow_back</span> Files
          </button>
          <div class="nb-topbar-title">
            <template x-if="!$store.knowledgeModal.activeNotebook">
              <span>Notebooks</span>
            </template>
            <template x-if="$store.knowledgeModal.activeNotebook">
              <span x-text="$store.knowledgeModal.activeNotebook.name"></span>
            </template>
          </div>
          <div class="nb-topbar-actions">
            <button class="kb-btn-sm" @click="$store.knowledgeModal.loadNotebooks()" title="Refresh">
              <span class="material-symbols-outlined" style="font-size:16px">refresh</span>
            </button>
          </div>
        </div>

        <!-- No notebook selected — show notebook list -->
        <template x-if="!$store.knowledgeModal.activeNotebookId">
          <div class="nb-notebook-list">
            <div class="nb-create-form">
              <input type="text" placeholder="New notebook name..." class="nb-create-input"
                x-ref="nbCreateName" @keyup.enter="$store.knowledgeModal.createNotebook($refs.nbCreateName.value, $refs.nbCreateDesc.value); $refs.nbCreateName.value=''; $refs.nbCreateDesc.value='';" />
              <input type="text" placeholder="Description (optional)" class="nb-create-input"
                x-ref="nbCreateDesc" style="margin-top:4px" />
              <button class="nb-create-btn" @click="$store.knowledgeModal.createNotebook($refs.nbCreateName.value, $refs.nbCreateDesc.value); $refs.nbCreateName.value=''; $refs.nbCreateDesc.value='';">
                <span class="material-symbols-outlined" style="font-size:14px">add</span> Create Notebook
              </button>
            </div>
            <template x-for="nb in $store.knowledgeModal.notebooks" :key="nb.id">
              <div class="nb-notebook-card" @click="$store.knowledgeModal.openNotebook(nb.id)">
                <div class="nb-card-icon"><span class="material-symbols-outlined">auto_stories</span></div>
                <div class="nb-card-info">
                  <div class="nb-card-name" x-text="nb.name"></div>
                  <div class="nb-card-desc" x-text="nb.description || 'No description'"></div>
                  <div class="nb-card-meta">
                    <span x-text="(nb.sources||[]).length + ' sources'"></span>
                    <span x-text="(nb.notes||[]).length + ' notes'"></span>
                    <span x-text="$store.knowledgeModal.relativeTime(nb.created_at)"></span>
                  </div>
                </div>
                <button class="nb-btn-delete" @click.stop="$store.knowledgeModal.deleteNotebook(nb.id)" title="Delete">
                  <span class="material-symbols-outlined" style="font-size:14px">delete</span>
                </button>
              </div>
            </template>
            <div x-show="$store.knowledgeModal.notebooks.length === 0" class="kb-empty" style="padding:40px">
              <span class="material-symbols-outlined" style="font-size:36px;opacity:0.2">auto_stories</span>
              <p>No notebooks yet. Create one to get started.</p>
            </div>
          </div>
        </template>

        <!-- Notebook open — 3-column layout -->
        <template x-if="$store.knowledgeModal.activeNotebookId">
          <div class="nb-3col">
            <!-- Column 1: Sources -->
            <div class="nb-col nb-col-sources">
              <div class="nb-col-header">
                <span class="material-symbols-outlined" style="font-size:16px">description</span>
                <span>Sources</span>
                <span class="nb-col-count" x-text="$store.knowledgeModal.notebookSources.length"></span>
              </div>
              <!-- Add source from KB -->
              <div class="nb-add-source">
                <select class="nb-source-dropdown" x-ref="nbSourceSelect">
                  <option value="">+ Add from Knowledge Base...</option>
                  <template x-for="entry in $store.knowledgeModal.entries.filter(e => e.saved)" :key="entry.id">
                    <option :value="entry.id" x-text="entry.question || entry.title || 'Untitled'"></option>
                  </template>
                </select>
                <button class="nb-btn-add" @click="const v=$refs.nbSourceSelect.value; if(v) $store.knowledgeModal.addSourceToNotebook(v); $refs.nbSourceSelect.value='';">
                  <span class="material-symbols-outlined" style="font-size:14px">add</span>
                </button>
              </div>
              <div class="nb-source-list">
                <template x-for="src in $store.knowledgeModal.notebookSources" :key="src.entry_id">
                  <div class="nb-source-item">
                    <span class="material-symbols-outlined" style="font-size:14px;color:var(--color-primary)">description</span>
                    <div class="nb-source-info">
                      <div class="nb-source-title" x-text="src.title" @click="$store.knowledgeModal.readEntry({id: src.entry_id, file: src.file, question: src.title})"></div>
                      <div class="nb-source-meta" x-text="src.source || src.category || ''"></div>
                    </div>
                    <button class="nb-btn-remove" @click="$store.knowledgeModal.removeSourceFromNotebook(src.entry_id)" title="Remove">
                      <span class="material-symbols-outlined" style="font-size:12px">close</span>
                    </button>
                  </div>
                </template>
                <div x-show="$store.knowledgeModal.notebookSources.length === 0" class="nb-empty-col">
                  Add sources from your Knowledge Base
                </div>
              </div>
            </div>

            <!-- Column 2: Notes + AI Transformations -->
            <div class="nb-col nb-col-notes">
              <div class="nb-col-header">
                <span class="material-symbols-outlined" style="font-size:16px">edit_note</span>
                <span>Notes</span>
                <span class="nb-col-count" x-text="$store.knowledgeModal.notebookNotes.length"></span>
              </div>
              <!-- Add note -->
              <div class="nb-note-input-area">
                <textarea class="nb-note-textarea" x-ref="nbNoteContent" placeholder="Write a note..." rows="3"></textarea>
                <button class="nb-btn-add-note" @click="const c=$refs.nbNoteContent.value; if(c.trim()) { $store.knowledgeModal.addNotebookNote(c, 'manual'); $refs.nbNoteContent.value=''; }">
                  <span class="material-symbols-outlined" style="font-size:14px">add</span> Add Note
                </button>
              </div>
              <!-- AI Transformations -->
              <div class="nb-transform-section">
                <div class="nb-transform-header" @click="$store.knowledgeModal.showTransformations = !$store.knowledgeModal.showTransformations">
                  <span class="material-symbols-outlined" style="font-size:14px">auto_awesome</span>
                  <span>AI Transformations</span>
                  <span class="material-symbols-outlined" style="font-size:12px" x-text="$store.knowledgeModal.showTransformations ? 'expand_less' : 'expand_more'"></span>
                </div>
                <div x-show="$store.knowledgeModal.showTransformations" class="nb-transform-list">
                  <div class="nb-transform-item" @click="$store.knowledgeModal.runTransformation('tf_summary', $store.knowledgeModal.notebookSources[0]?.entry_id)">
                    <span class="material-symbols-outlined" style="font-size:13px">summarize</span> Summarize Sources
                  </div>
                  <div class="nb-transform-item" @click="$store.knowledgeModal.runTransformation('tf_key_findings', $store.knowledgeModal.notebookSources[0]?.entry_id)">
                    <span class="material-symbols-outlined" style="font-size:13px">key</span> Key Findings
                  </div>
                  <div class="nb-transform-item" @click="$store.knowledgeModal.runTransformation('tf_critique', $store.knowledgeModal.notebookSources[0]?.entry_id)">
                    <span class="material-symbols-outlined" style="font-size:13px">rate_review</span> Critical Analysis
                  </div>
                  <div class="nb-transform-item" @click="$store.knowledgeModal.runTransformation('tf_timeline', $store.knowledgeModal.notebookSources[0]?.entry_id)">
                    <span class="material-symbols-outlined" style="font-size:13px">timeline</span> Timeline
                  </div>
                </div>
              </div>
              <!-- Notes list -->
              <div class="nb-notes-list">
                <template x-for="note in $store.knowledgeModal.notebookNotes" :key="note.id">
                  <div class="nb-note-card" :class="{'nb-note-ai': note.author === 'ai'}">
                    <div class="nb-note-header">
                      <span class="nb-note-author" x-text="note.author === 'ai' ? '🤖 AI' : '✏️ You'"></span>
                      <span class="nb-note-time" x-text="$store.knowledgeModal.relativeTime(note.created_at)"></span>
                      <button class="nb-btn-remove" @click="$store.knowledgeModal.deleteNotebookNote(note.id)" title="Delete note">
                        <span class="material-symbols-outlined" style="font-size:12px">delete</span>
                      </button>
                    </div>
                    <div class="nb-note-body" style="white-space:pre-wrap" x-text="note.content"></div>
                  </div>
                </template>
                <div x-show="$store.knowledgeModal.notebookNotes.length === 0" class="nb-empty-col">
                  Write notes or use AI Transformations
                </div>
              </div>
            </div>

            <!-- Column 3: Chat + Podcast -->
            <div class="nb-col nb-col-chat">
              <div class="nb-col-header">
                <span class="material-symbols-outlined" style="font-size:16px">chat</span>
                <span>Chat</span>
              </div>
              <!-- Podcast controls -->
              <div class="nb-podcast-section">
                <div class="nb-podcast-header" @click="$store.knowledgeModal._showPodcast = !$store.knowledgeModal._showPodcast">
                  <span class="material-symbols-outlined" style="font-size:14px">podcasts</span>
                  <span>Generate Podcast</span>
                  <span class="material-symbols-outlined" style="font-size:12px" x-text="$store.knowledgeModal._showPodcast ? 'expand_less' : 'expand_more'"></span>
                </div>
                <div x-show="$store.knowledgeModal._showPodcast" class="nb-podcast-controls">
                  <input type="text" class="nb-podcast-input" placeholder="Topic (optional)" x-model="$store.knowledgeModal.podcastTopic" />
                  <div class="nb-podcast-row">
                    <select class="nb-podcast-select" x-model="$store.knowledgeModal.podcastFormat">
                      <option value="interview">Interview</option>
                      <option value="discussion">Discussion</option>
                      <option value="lecture">Lecture</option>
                    </select>
                    <select class="nb-podcast-select" x-model="$store.knowledgeModal.podcastLength">
                      <option value="short">Short (5-10m)</option>
                      <option value="medium">Medium (15-20m)</option>
                      <option value="long">Long (25-35m)</option>
                    </select>
                  </div>
                  <button class="nb-btn-podcast" @click="$store.knowledgeModal.generateNotebookPodcast()">
                    <span class="material-symbols-outlined" style="font-size:14px">podcasts</span> Generate Podcast Script
                  </button>
                </div>
              </div>
              <!-- Chat messages -->
              <div class="nb-chat-messages">
                <template x-for="(msg, i) in $store.knowledgeModal.nbChatMessages" :key="i">
                  <div class="nb-chat-msg" :class="'nb-chat-' + msg.role">
                    <div class="nb-chat-bubble" x-html="msg.content.replace(/\n/g, '<br>')"></div>
                  </div>
                </template>
                <div x-show="$store.knowledgeModal.nbChatMessages.length === 0" class="nb-empty-col">
                  Ask questions about your notebook sources
                </div>
              </div>
              <!-- Chat input -->
              <div class="nb-chat-input-area">
                <textarea class="nb-chat-textarea" x-model="$store.knowledgeModal.nbChatInput"
                  placeholder="Ask about your sources..." rows="2"
                  @keydown.enter.prevent="$store.knowledgeModal.sendNotebookChat()"></textarea>
                <button class="nb-btn-send" @click="$store.knowledgeModal.sendNotebookChat()" :disabled="$store.knowledgeModal.nbChatLoading">
                  <span class="material-symbols-outlined" style="font-size:16px">send</span>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Main List View (when not reading and not in notebook view) -->
    <template x-if="!$store.knowledgeModal.readingPaper && !$store.knowledgeModal.showNotebooks">
      <div class="kb-main-view">
        <!-- Header -->
        <div class="kb-header">
          <span class="material-symbols-outlined kb-icon">folder_open</span>
          <div>
            <h2>Knowledge Base</h2>
            <p class="kb-sub" x-text="$store.knowledgeModal.entryCount + ' files · ' + ($store.knowledgeModal.selectedIds.length) + ' selected'"></p>
          </div>
          <div class="kb-header-actions">
            <button class="kb-btn-notebook" @click="$store.knowledgeModal.toggleNotebookView()" title="Notebooks" :class="{active: $store.knowledgeModal.showNotebooks}">
              <span class="material-symbols-outlined" style="font-size:16px">auto_stories</span> Notebooks
            </button>
            <button class="kb-btn-sm" @click="$store.knowledgeModal.loadAllEntries()" :disabled="$store.knowledgeModal.loading" title="Refresh">
              <span class="material-symbols-outlined">refresh</span>
            </button>
            <button class="kb-btn-sm" @click="$store.knowledgeModal.triggerUploadRestore()" :disabled="$store.knowledgeModal.uploading" title="Upload files">
              <span class="material-symbols-outlined">upload_file</span>
            </button>
          </div>
        </div>

        <!-- Selection Action Bar (appears when files are selected) -->
        <div class="kb-action-bar" x-show="$store.knowledgeModal.selectedIds.length > 0">
          <span class="kb-selected-count" x-text="$store.knowledgeModal.selectedIds.length + ' selected'"></span>
          <div class="kb-action-buttons">
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('thesis')" title="Send to Thesis Writer">
              <span class="material-symbols-outlined" style="font-size:15px">school</span> Thesis
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('review')" title="Send to Literature Review">
              <span class="material-symbols-outlined" style="font-size:15px">rate_review</span> Review
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('podcast')" title="Send to Podcast">
              <span class="material-symbols-outlined" style="font-size:15px">podcasts</span> Podcast
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('ppt')" title="Send to PPT Generator">
              <span class="material-symbols-outlined" style="font-size:15px">slideshow</span> Slides
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.useSelectedFor('export')" title="Export Selected">
              <span class="material-symbols-outlined" style="font-size:15px">download</span> Export
            </button>
            <span style="border-left:1px solid var(--color-border);height:18px;margin:0 2px"></span>
            <button class="kb-action-btn" @click="$store.knowledgeModal.sendToObsidian()" title="Send selected files to Obsidian vault as .md with YAML frontmatter">
              <span class="material-symbols-outlined" style="font-size:15px">upload_file</span> Obsidian
            </button>
            <button class="kb-action-btn" @click="$store.knowledgeModal.pullFromObsidian()" title="Pull .md files from Obsidian vault into Knowledge Base">
              <span class="material-symbols-outlined" style="font-size:15px">download</span> From Obsidian
            </button>
          </div>
          <button class="kb-btn-clear" @click="$store.knowledgeModal.clearSelection()" title="Clear selection">
            <span class="material-symbols-outlined" style="font-size:15px">close</span>
          </button>
        </div>

        <!-- Error / Message -->
        <div x-show="$store.knowledgeModal.error" class="kb-error" x-text="$store.knowledgeModal.error"></div>
        <div x-show="$store.knowledgeModal.message" class="kb-msg" x-text="$store.knowledgeModal.message"></div>
        <div x-show="$store.knowledgeModal.loading" class="kb-loading"><div class="kb-spinner"></div> <span>Loading files...</span></div>

        <!-- Body: Category Sidebar + File Grid -->
        <div class="kb-body">
          <!-- Category Sidebar -->
          <div class="kb-sidebar">
            <div class="kb-sidebar-section">
              <div class="kb-sidebar-header">
                <span class="kb-sidebar-title">Categories</span>
                <button class="kb-add-cat-btn" @click="$store.knowledgeModal.showAddCategory = !$store.knowledgeModal.showAddCategory" title="Add category">
                  <span class="material-symbols-outlined" style="font-size:14px">add</span>
                </button>
              </div>
              <!-- Add new category form -->
              <div x-show="$store.knowledgeModal.showAddCategory" class="kb-new-cat-form">
                <input type="text" x-model="$store.knowledgeModal.newCategoryName" placeholder="Category name..."
                  class="kb-cat-input" @keyup.enter="$store.knowledgeModal.createCategory()" />
                <button class="kb-cat-add" @click="$store.knowledgeModal.createCategory()">Add</button>
              </div>
              <!-- Category list -->
              <button class="kb-cat-item" :class="{active: $store.knowledgeModal.activeCategory==='all'}" @click="$store.knowledgeModal.activeCategory='all'">
                <span class="material-symbols-outlined" style="font-size:15px">folder</span> All Files
                <span class="kb-cat-count" x-text="$store.knowledgeModal.entryCount"></span>
              </button>
              <template x-for="cat in $store.knowledgeModal.allCategories" :key="cat.key">
                <button class="kb-cat-item" :class="{active: $store.knowledgeModal.activeCategory===cat.key}" @click="$store.knowledgeModal.activeCategory=cat.key">
                  <span class="material-symbols-outlined" style="font-size:15px" x-text="cat.key==='literature'||cat.key==='deep_research'?'article':cat.key==='docking'||cat.key==='drug_analysis'?'science':cat.key==='notes'?'note':cat.key==='faculty'?'school':cat.key==='books'?'menu_book':'folder'"></span>
                  <span x-text="cat.label"></span>
                </button>
              </template>
            </div>
            <!-- Select All checkbox -->
            <div class="kb-select-all">
              <label class="kb-checkbox-label">
                <input type="checkbox" :checked="$store.knowledgeModal.selectedIds.length === $store.knowledgeModal.recentEntries.length && $store.knowledgeModal.recentEntries.length > 0"
                  @change="$store.knowledgeModal.selectAll()">
                <span>Select All</span>
              </label>
            </div>
          </div>

          <!-- File Grid -->
          <div class="kb-file-area">
            <!-- Filter bar -->
            <div class="kb-filter-bar" x-show="$store.knowledgeModal.entryCount > 0">
              <div class="kb-filter-group">
                <button class="kb-filter-chip" :class="{active: $store.knowledgeModal.recentFilter==='all'}" @click="$store.knowledgeModal.recentFilter='all'">All</button>
                <button class="kb-filter-chip" :class="{active: $store.knowledgeModal.recentFilter==='7d'}" @click="$store.knowledgeModal.recentFilter='7d'">Last 7 days</button>
                <button class="kb-filter-chip" :class="{active: $store.knowledgeModal.recentFilter==='30d'}" @click="$store.knowledgeModal.recentFilter='30d'">Last 30 days</button>
              </div>
              <select class="kb-source-select" x-model="$store.knowledgeModal.sourceFilter" @change="">
                <option value="all">All Sources</option>
                <option value="literature_search">📚 Literature Search</option>
                <option value="deep_research">🔍 Deep Research</option>
                <option value="docking">🧬 Docking</option>
                <option value="qsar">📊 QSAR</option>
                <option value="pharmacophore">💊 Pharmacophore</option>
                <option value="drug_analysis">💊 Drug Analysis</option>
                <option value="statistics">📈 Statistics</option>
                <option value="md_lite">⚗️ MD Simulation</option>
                <option value="faculty">🎓 Faculty</option>
                <option value="upload">📁 User Upload</option>
              </select>
            </div>

            <!-- Empty state -->
            <div x-show="!$store.knowledgeModal.loading && $store.knowledgeModal.filteredBySource.length === 0" class="kb-empty">
              <span class="material-symbols-outlined" style="font-size:40px;opacity:0.2">folder_open</span>
              <p x-show="$store.knowledgeModal.entryCount === 0">No files saved yet.</p>
              <p x-show="$store.knowledgeModal.entryCount > 0">No files match your filter. Try "All" to see everything.</p>
              <button class="kb-btn-upload-big" @click="$store.knowledgeModal.triggerUploadRestore()" x-show="$store.knowledgeModal.entryCount === 0">
                <span class="material-symbols-outlined">upload_file</span> Upload Files
              </button>
              <p style="font-size:0.55rem;margin-top:8px;color:var(--color-text-muted)" x-show="$store.knowledgeModal.entryCount === 0">Supports: PDF, DOCX, XLSX, CSV, PPT, SDF, PDB, TXT, MD, JSON, images, audio</p>
            </div>

            <!-- File Grid -->
            <div class="kb-file-grid" x-show="!$store.knowledgeModal.loading && $store.knowledgeModal.filteredBySource.length > 0">
              <template x-for="(entry, idx) in $store.knowledgeModal.filteredBySource" :key="entry.id || idx">
                <div class="kb-file-card" :class="{selected: $store.knowledgeModal.isSelected(entry.id)}">
                  <!-- Checkbox -->
                  <label class="kb-checkbox" @click.stop="$store.knowledgeModal.toggleSelection(entry.id)">
                    <input type="checkbox" :checked="$store.knowledgeModal.isSelected(entry.id)">
                  </label>
                  <!-- File icon -->
                  <span class="kb-file-card-icon" @click="$store.knowledgeModal.readEntry(entry)">
                    <span class="material-symbols-outlined" style="font-size:28px" x-text="entry.source_icon || 'description'"></span>
                  </span>
                  <!-- File info -->
                  <div class="kb-file-card-info" @click="$store.knowledgeModal.readEntry(entry)">
                    <div class="kb-file-card-name" x-text="entry.question || entry.title || 'Untitled'"></div>
                    <div class="kb-file-card-meta">
                      <span class="kb-source-badge" x-text="(entry.source_icon||'') + ' ' + (entry.source_label || entry.source || 'Knowledge Base')"></span>
                      <span x-show="entry.contentLength" x-text="entry.contentLength > 1000 ? Math.round(entry.contentLength/1000)+'KB' : (entry.contentLength||0)+'B'"></span>
                      <span class="kb-time-ago" x-text="$store.knowledgeModal.relativeTime(entry.createdAt)"></span>
                    </div>
                    <div class="kb-file-card-tags">
                      <template x-for="tag in (entry.tags||[]).slice(0,3)" :key="tag">
                        <span class="kb-tag" x-text="tag"></span>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- Upload zone -->
            <div class="kb-upload-zone" x-show="$store.knowledgeModal.entryCount > 0">
              <button class="kb-btn-upload" @click="$store.knowledgeModal.triggerUploadRestore()" :disabled="$store.knowledgeModal.uploading">
                <span class="material-symbols-outlined">add</span> Add Files
