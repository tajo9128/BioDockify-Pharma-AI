<html>
<head></head>
<body>
  <div x-data style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center">
    <span class="material-symbols-outlined" style="font-size:36px;color:var(--color-primary);margin-bottom:8px">rocket_launch</span>
    <p style="font-size:0.7rem;color:var(--color-text);font-weight:600;margin-bottom:4px">Deep Research is now part of Research Hub</p>
    <p style="font-size:0.6rem;color:var(--color-text-muted);margin-bottom:12px">All deep research features (10 databases, bulk collection, scanning) are now in the Research Hub window.</p>
    <button style="padding:8px 16px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.65rem;font-weight:600" onclick="if(typeof $store!=='undefined'&&$store.desktopWorkspace){$store.desktopWorkspace.closeWindow($store.desktopWorkspace.activeWindowId);$store.desktopWorkspace.openWindow('research-dashboard');setTimeout(()=>{if($store.researchDashboard)$store.researchDashboard.activeTab='collect'},300)}">
      Open Research Hub →
    </button>
  </div>
