<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("deepResearch", {
      topic: "", maxSources: 200, yearFrom: "", yearTo: "",
      databases: ["pubmed", "semantic_scholar", "crossref"],
      activeTab: "collect", loading: false, error: "", message: "",
      sessionId: "", sources: [], stats: null,
      scanKeywords: "", scannedSources: [], sessions: [],

      async collect() {
        if (!this.topic.trim()) { this.error = "Enter a research topic"; return; }
        this.loading = true; this.error = ""; this.message = ""; this.sources = []; this.stats = null;
        try {
          const r = await callJsonApi("deep_research", { action: "collect", topic: this.topic, max_sources: this.maxSources, databases: this.databases, year_from: this.yearFrom, year_to: this.yearTo });
          if (r.status === "ok") { this.sessionId = r.session_id; this.sources = r.sources || []; this.stats = r.stats || {}; this.message = `${this.stats.total} sources collected (${this.stats.duplicates_removed} duplicates removed)`; }
          else { this.error = r.error || "Collection failed"; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async scan() {
        if (!this.sessionId) { this.error = "Collect sources first"; return; }
        this.loading = true; this.error = "";
        const keywords = this.scanKeywords.split(",").map(k => k.trim()).filter(Boolean);
        try {
          const r = await callJsonApi("deep_research", { action: "scan", session_id: this.sessionId, keywords });
          if (r.status === "ok") { this.scannedSources = r.top_sources || []; this.message = `${r.scanned} scanned, ${this.scannedSources.length} top by relevance`; this.activeTab = "results"; }
          else { this.error = r.error || "Scan failed"; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async storeToKB() {
        if (!this.sessionId) { this.error = "Collect sources first"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("deep_research", { action: "store", session_id: this.sessionId, max_store: 50 });
          if (r.status === "ok") {
            // Add entries to the knowledge base notebook
            const kb = Alpine.store("knowledgeModal");
            const sources = this.scannedSources.length ? this.scannedSources : this.sources;
            let added = 0;
            for (const src of sources.slice(0, 50)) {
              if (kb && kb.addNoteBookEntry) {
                kb.addNoteBookEntry(
                  src.title || "Untitled",
                  src.abstract || "",
                  (src.journal || src.database || "Deep Research") + (src.doi ? " DOI:" + src.doi : ""),
                  ["deep-research", "literature"]
                );
                added++;
              }
            }
            this.message = `${r.stored} papers saved + ${added} added to notebook`;
          } else { this.error = r.error || "Store failed"; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async loadSessions() { try { const r = await callJsonApi("deep_research", { action: "list" }); if (r.status === "ok") this.sessions = r.sessions || []; } catch (e) {} },

      toggleDb(db) { const idx = this.databases.indexOf(db); if (idx >= 0) this.databases.splice(idx, 1); else this.databases.push(db); },
      formatYear(y) { return y ? String(y) : "N/A"; },
    });
  </script>
</head>
<body>
  <div x-data class="dr-panel" x-init="$store.deepResearch.loadSessions()">
    <!-- Header -->
    <div class="dr-header">
      <span class="material-symbols-outlined dr-icon">travel_explore</span>
      <div><h2>Deep Research</h2><p class="dr-sub">Collect thousands of sources from 5 databases · Scan · Filter · Store</p></div>
    </div>

    <div x-show="$store.deepResearch.error" class="dr-error" x-text="$store.deepResearch.error" @click="$store.deepResearch.error=''"></div>
    <div x-show="$store.deepResearch.message" class="dr-msg" x-text="$store.deepResearch.message" @click="$store.deepResearch.message=''"></div>
    <div x-show="$store.deepResearch.loading" class="dr-loading"><div class="loading-spinner"></div><span>Collecting sources...</span></div>

    <!-- Tabs -->
    <div class="dr-tabs">
      <button class="dr-tab" :class="{active:$store.deepResearch.activeTab=='collect'}" @click="$store.deepResearch.activeTab='collect'"><span class="material-symbols-outlined">search</span> Collect</button>
      <button class="dr-tab" :class="{active:$store.deepResearch.activeTab=='results'}" @click="$store.deepResearch.activeTab='results'"><span class="material-symbols-outlined">list</span> Results</button>
      <button class="dr-tab" :class="{active:$store.deepResearch.activeTab=='sessions'}" @click="$store.deepResearch.activeTab='sessions'"><span class="material-symbols-outlined">history</span> Sessions</button>
    </div>

    <!-- Body -->
    <div class="dr-body">

      <!-- ====== COLLECT ====== -->
      <div x-show="$store.deepResearch.activeTab=='collect'" class="dr-section">
        <!-- Topic Box -->
        <div class="dr-card"><h4><span class="material-symbols-outlined">search</span> Research Topic</h4>
          <textarea x-model="$store.deepResearch.topic" placeholder="Enter your research topic, keywords, or research question..." class="dr-textarea" rows="4"></textarea>
          <div class="dr-row" style="margin-top:6px">
            <input type="number" x-model="$store.deepResearch.yearFrom" placeholder="Year from" class="dr-input-sm" />
            <input type="number" x-model="$store.deepResearch.yearTo" placeholder="Year to" class="dr-input-sm" />
            <span style="font-size:0.55rem;color:var(--color-text-muted);white-space:nowrap">Max:</span>
            <input type="range" x-model="$store.deepResearch.maxSources" min="50" max="5000" step="50" style="flex:1" />
            <span style="font-size:0.58rem;font-weight:600;width:45px;text-align:right" x-text="$store.deepResearch.maxSources"></span>
          </div>
          <button class="dr-btn-primary" @click="$store.deepResearch.collect()" :disabled="$store.deepResearch.loading || !$store.deepResearch.topic" style="margin-top:8px">
            <span class="material-symbols-outlined" style="font-size:16px">travel_explore</span> Collect Sources
          </button>
        </div>

        <!-- Databases -->
        <div class="dr-card"><h4><span class="material-symbols-outlined">database</span> Databases</h4>
          <div class="dr-chips">
            <button class="dr-chip" :class="{active:$store.deepResearch.databases.includes('pubmed')}" @click="$store.deepResearch.toggleDb('pubmed')">PubMed</button>
            <button class="dr-chip" :class="{active:$store.deepResearch.databases.includes('semantic_scholar')}" @click="$store.deepResearch.toggleDb('semantic_scholar')">Semantic Scholar</button>
            <button class="dr-chip" :class="{active:$store.deepResearch.databases.includes('crossref')}" @click="$store.deepResearch.toggleDb('crossref')">Crossref</button>
            <button class="dr-chip" :class="{active:$store.deepResearch.databases.includes('openalex')}" @click="$store.deepResearch.toggleDb('openalex')">OpenAlex</button>
            <button class="dr-chip" :class="{active:$store.deepResearch.databases.includes('arxiv')}" @click="$store.deepResearch.toggleDb('arxiv')">arXiv</button>
          </div>
        </div>

        <!-- Stats -->
        <template x-if="$store.deepResearch.stats">
          <div class="dr-card"><h4><span class="material-symbols-outlined">bar_chart</span> Collection Stats</h4>
            <div class="dr-stats-grid">
              <div class="dr-stat-box"><span class="dr-stat-num" x-text="$store.deepResearch.stats.total || 0"></span><small>Total</small></div>
              <div class="dr-stat-box"><span class="dr-stat-num" x-text="$store.deepResearch.stats.duplicates_removed || 0"></span><small>Duplicates</small></div>
            </div>
            <div class="dr-db-list">
              <template x-for="(count, db) in $store.deepResearch.stats.by_database || {}" :key="db">
                <div class="dr-db-item"><span x-text="db"></span><span class="dr-db-count" x-text="count"></span></div>
              </template>
            </div>
          </div>
        </template>

        <!-- Scan & Store -->
        <div class="dr-card" x-show="$store.deepResearch.sources.length"><h4><span class="material-symbols-outlined">filter_list</span> Scan & Filter</h4>
          <input type="text" x-model="$store.deepResearch.scanKeywords" placeholder="Keywords for relevance (comma-separated)" class="dr-input" style="margin-bottom:6px" />
          <div class="dr-row">
            <button class="dr-btn-secondary" @click="$store.deepResearch.scan()" :disabled="$store.deepResearch.loading || !$store.deepResearch.sessionId"><span class="material-symbols-outlined" style="font-size:14px">filter_list</span> Scan for Relevance</button>
            <button class="dr-btn-primary" @click="$store.deepResearch.storeToKB()" :disabled="$store.deepResearch.loading || !$store.deepResearch.sessionId" style="background:#6366f1"><span class="material-symbols-outlined" style="font-size:14px">bookmark</span> Store to KB</button>
          </div>
        </div>
      </div>

      <!-- ====== RESULTS ====== -->
      <div x-show="$store.deepResearch.activeTab=='results'">
        <template x-if="$store.deepResearch.scannedSources.length">
          <div class="dr-section">
            <div class="dr-card"><h4 x-text="$store.deepResearch.scannedSources.length + ' Top Sources (by relevance)'"></h4></div>
            <template x-for="(src, idx) in $store.deepResearch.scannedSources" :key="idx">
              <div class="dr-card dr-card-paper">
                <div style="font-size:0.66rem;font-weight:600;color:var(--color-text)" x-text="src.title"></div>
                <div style="font-size:0.52rem;color:var(--color-text-muted);margin-top:2px" x-text="(src.authors || []).slice(0,3).join(', ') + (src.authors?.length > 3 ? ' et al.' : '')"></div>
                <div class="dr-meta">
                  <span x-text="src.journal || src.database"></span>
                  <span x-text="src.year || ''"></span>
                  <span x-show="src.citations" style="color:var(--color-primary);font-weight:600" x-text="src.citations + ' cit'"></span>
                  <span class="dr-score" :class="src.relevance_score >= 3 ? 'dr-score-high' : ''" x-text="'Score: ' + (src.relevance_score || 0)"></span>
                </div>
              </div>
            </template>
          </div>
        </template>
        <div x-show="!$store.deepResearch.scannedSources.length" class="dr-empty">
          <span class="material-symbols-outlined" style="font-size:32px;opacity:0.2">filter_list</span>
          <p>Collect sources first, then scan with keywords</p>
        </div>
      </div>

      <!-- ====== SESSIONS ====== -->
      <div x-show="$store.deepResearch.activeTab=='sessions'">
        <template x-if="$store.deepResearch.sessions.length">
          <div class="dr-section">
            <template x-for="s in $store.deepResearch.sessions" :key="s.session_id">
              <div class="dr-card" style="cursor:pointer" @click="$store.deepResearch.sessionId=s.session_id;$store.deepResearch.topic=s.topic;$store.deepResearch.activeTab='collect'">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div>
                    <div style="font-size:0.66rem;font-weight:600;color:var(--color-text)" x-text="s.topic"></div>
                    <div style="font-size:0.5rem;color:var(--color-text-muted)" x-text="s.total + ' sources · ' + (s.created_at || '').split('T')[0]"></div>
                  </div>
                  <span style="font-size:0.5rem;color:var(--color-primary)" x-text="s.session_id"></span>
                </div>
              </div>
            </template>
          </div>
        </template>
        <div x-show="!$store.deepResearch.sessions.length" class="dr-empty">
          <span class="material-symbols-outlined" style="font-size:32px;opacity:0.2">history</span>
          <p>No research sessions yet</p>
        </div>
      </div>
    </div>

    <style>
      .dr-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:14px 18px;background:var(--color-background) }
      .dr-header { display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-shrink:0 }
      .dr-icon { font-size:24px;color:var(--color-primary) }
      .dr-header h2 { color:var(--color-primary);font-size:1rem;margin:0;font-weight:700 }
      .dr-sub { color:var(--color-text-muted);font-size:0.54rem;margin:0 }
      .dr-tabs { display:flex;gap:1px;margin-bottom:8px;flex-shrink:0;border-bottom:1px solid var(--color-border);padding-bottom:4px }
      .dr-tab { display:flex;align-items:center;gap:3px;padding:5px 12px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--color-text-muted);cursor:pointer;font-size:0.64rem;font-weight:500 }
      .dr-tab:hover { color:var(--color-text) }
      .dr-tab.active { color:var(--color-primary);border-bottom-color:var(--color-primary) }
      .dr-tab .material-symbols-outlined { font-size:14px }
      .dr-body { flex:1;overflow-y:auto }
      .dr-section { display:flex;flex-direction:column;gap:6px }
      .dr-card { padding:10px 12px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px }
      .dr-card h4 { font-size:0.68rem;font-weight:600;color:var(--color-primary);margin:0 0 6px;display:flex;align-items:center;gap:4px }
      .dr-card h4 .material-symbols-outlined { font-size:15px }
      .dr-card-paper { border-left:3px solid var(--color-primary) }
      .dr-row { display:flex;gap:6px;align-items:center }
      .dr-chips { display:flex;flex-wrap:wrap;gap:4px }
      .dr-chip { padding:4px 12px;background:transparent;border:1px solid var(--color-border);border-radius:5px;color:var(--color-text-muted);cursor:pointer;font-size:0.6rem;font-weight:500 }
      .dr-chip.active { background:var(--color-primary);color:white;border-color:var(--color-primary) }
      .dr-input { width:100%;padding:7px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-background);color:var(--color-text);font-size:0.66rem;box-sizing:border-box }
      .dr-input:focus { outline:none;border-color:var(--color-primary) }
      .dr-input-sm { flex:1;padding:5px 8px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.62rem;box-sizing:border-box }
      .dr-textarea { width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-background);color:var(--color-text);font-size:0.7rem;resize:vertical;box-sizing:border-box;font-family:inherit }
      .dr-textarea:focus { outline:none;border-color:var(--color-primary) }
      .dr-btn-primary { display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:7px 14px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.68rem;font-weight:600 }
      .dr-btn-primary:disabled { opacity:0.5;cursor:not-allowed }
      .dr-btn-secondary { display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:6px 10px;background:transparent;border:1px solid var(--color-border);border-radius:5px;color:var(--color-text);cursor:pointer;font-size:0.6rem }
      .dr-btn-secondary:hover { border-color:var(--color-primary);color:var(--color-primary) }
      .dr-stats-grid { display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px }
      .dr-stat-box { text-align:center;padding:8px;background:var(--color-background);border:1px solid var(--color-border);border-radius:6px }
      .dr-stat-num { display:block;font-size:1.1rem;font-weight:700;color:var(--color-primary) }
      .dr-db-list { display:flex;flex-direction:column;gap:2px }
      .dr-db-item { display:flex;justify-content:space-between;font-size:0.56rem;padding:2px 0 }
      .dr-db-count { font-weight:600;color:var(--color-primary) }
      .dr-meta { display:flex;gap:8px;align-items:center;margin-top:3px;font-size:0.52rem;color:var(--color-text-muted) }
      .dr-score { font-weight:700;padding:1px 5px;border-radius:3px;font-size:0.48rem;background:rgba(255,255,255,0.05) }
      .dr-score-high { background:rgba(34,197,94,0.12);color:#22c55e }
      .dr-error { padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;color:#ff6b6b;font-size:0.6rem;margin-bottom:4px;cursor:pointer }
      .dr-msg { padding:4px 8px;background:rgba(0,212,170,0.08);border-radius:4px;color:var(--color-primary);font-size:0.6rem;margin-bottom:4px;cursor:pointer }
      .dr-loading { display:flex;align-items:center;gap:5px;font-size:0.6rem;color:var(--color-text-muted);margin-bottom:4px }
      .loading-spinner { width:12px;height:12px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .dr-empty { text-align:center;padding:30px }
      .dr-empty p { font-size:0.66rem;color:var(--color-text-muted);margin:6px 0 0 }
    </style>
  </div>
</body>
</html>
