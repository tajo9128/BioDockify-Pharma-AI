<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";
    export const store = createStore("clinicalModal", {
      activeTab: "interactions", loading: false, error: "", result: null,
      // Drug interaction
      diDrug1: "", diDrug2: "",
      // TDM
      tdmDrug: "", tdmDose: "", tdmInterval: "12", tdmHalfLife: "", tdmTarget: "", tdmMeasured: "",
      // Renal
      renalDrug: "", renalScr: "", renalAge: "50", renalSex: "male", renalDose: "",
      // Naranjo
      naranjoAnswers: Array(10).fill("unknown"),
      async checkInteraction() {
        if (!this.diDrug1 || !this.diDrug2) return;
        this.loading = true; this.error = "";
        try {
          this.result = await callJsonApi("clinical", { action: "drug_interaction", drug1: this.diDrug1, drug2: this.diDrug2 });
        } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async runTDM() {
        if (!this.tdmDrug || !this.tdmDose) return;
        this.loading = true; this.error = "";
        try {
          this.result = await callJsonApi("clinical", { action: "tdm", drug: this.tdmDrug, dose_mg: parseFloat(this.tdmDose), interval_hr: parseFloat(this.tdmInterval), half_life_hr: parseFloat(this.tdmHalfLife) || 0, target_trough: parseFloat(this.tdmTarget) || 0, measured_trough: parseFloat(this.tdmMeasured) || 0 });
        } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async runRenal() {
        if (!this.renalScr) return;
        this.loading = true; this.error = "";
        try {
          this.result = await callJsonApi("clinical", { action: "renal_adjust", drug: this.renalDrug, serum_creatinine_mg_dl: parseFloat(this.renalScr), age: parseInt(this.renalAge), sex: this.renalSex, current_dose_mg: parseFloat(this.renalDose) || 0 });
        } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async runNaranjo() {
        this.loading = true; this.error = "";
        try {
          this.result = await callJsonApi("clinical", { action: "naranjo", answers: this.naranjoAnswers });
        } catch(e) { this.error = e.message; }
        this.loading = false;
      }
    });
  </script>
</head>
<body>
  <div x-data class="dp-panel">
    <div class="dp-header">
      <span class="material-symbols-outlined dp-icon">clinical_notes</span>
      <div><h2>Clinical Pharmacy</h2><p class="dp-sub">Drug interactions, TDM, renal/hepatic dosing, ADR assessment</p></div>
    </div>
    <div class="dp-tabs">
      <button class="dp-tab" :class="{active:$store.clinicalModal.activeTab==='interactions'}" @click="$store.clinicalModal.activeTab='interactions'">Interactions</button>
      <button class="dp-tab" :class="{active:$store.clinicalModal.activeTab==='tdm'}" @click="$store.clinicalModal.activeTab='tdm'">TDM</button>
      <button class="dp-tab" :class="{active:$store.clinicalModal.activeTab==='renal'}" @click="$store.clinicalModal.activeTab='renal'">Renal Dose</button>
      <button class="dp-tab" :class="{active:$store.clinicalModal.activeTab==='naranjo'}" @click="$store.clinicalModal.activeTab='naranjo'">Naranjo ADR</button>
    </div>
    <div class="dp-body">
      <div x-show="$store.clinicalModal.error" class="dp-error" x-text="$store.clinicalModal.error"></div>
      <div x-show="$store.clinicalModal.loading" class="dp-loading"><div class="dp-spinner"></div> Processing...</div>
      <!-- Interactions -->
      <div x-show="$store.clinicalModal.activeTab==='interactions'">
        <div class="dp-card">
          <h3>Drug-Drug Interaction Checker</h3>
          <div class="dp-grid">
            <div><label class="dp-label">Drug 1:</label><input type="text" x-model="$store.clinicalModal.diDrug1" class="dp-input" placeholder="warfarin" /></div>
            <div><label class="dp-label">Drug 2:</label><input type="text" x-model="$store.clinicalModal.diDrug2" class="dp-input" placeholder="amiodarone" /></div>
          </div>
          <button class="dp-btn" @click="$store.clinicalModal.checkInteraction()" :disabled="$store.clinicalModal.loading">Check Interaction</button>
          <template x-if="$store.clinicalModal.result?.interaction_found">
            <div class="dp-result dp-danger">
              <div class="dp-stat"><span class="dp-stat-label">Severity</span><span class="dp-stat-val bad" x-text="$store.clinicalModal.result.severity"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Mechanism</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.mechanism"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Effect</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.effect"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Action</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.action"></span></div>
            </div>
          </template>
          <template x-if="$store.clinicalModal.result && !$store.clinicalModal.result.interaction_found">
            <div class="dp-result"><div class="dp-stat"><span class="dp-stat-label">Result</span><span class="dp-stat-val good" x-text="$store.clinicalModal.result.message"></span></div></div>
          </template>
        </div>
      </div>
      <!-- TDM -->
      <div x-show="$store.clinicalModal.activeTab==='tdm'">
        <div class="dp-card">
          <h3>Therapeutic Drug Monitoring</h3>
          <div class="dp-grid">
            <div><label class="dp-label">Drug:</label><input type="text" x-model="$store.clinicalModal.tdmDrug" class="dp-input" placeholder="vancomycin" /></div>
            <div><label class="dp-label">Dose (mg):</label><input type="number" x-model="$store.clinicalModal.tdmDose" class="dp-input" placeholder="1000" /></div>
            <div><label class="dp-label">Interval (hr):</label><input type="number" x-model="$store.clinicalModal.tdmInterval" class="dp-input" value="12" /></div>
            <div><label class="dp-label">Half-life (hr):</label><input type="number" x-model="$store.clinicalModal.tdmHalfLife" class="dp-input" placeholder="6" /></div>
            <div><label class="dp-label">Target trough:</label><input type="number" x-model="$store.clinicalModal.tdmTarget" class="dp-input" placeholder="15" /></div>
            <div><label class="dp-label">Measured trough:</label><input type="number" x-model="$store.clinicalModal.tdmMeasured" class="dp-input" placeholder="22" /></div>
          </div>
          <button class="dp-btn" @click="$store.clinicalModal.runTDM()" :disabled="$store.clinicalModal.loading">Calculate</button>
          <template x-if="$store.clinicalModal.result?.success">
            <div class="dp-result">
              <div class="dp-stat"><span class="dp-stat-label">Suggested dose</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.suggested_dose_mg + ' mg'"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Adjustment</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.adjustment"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Time to steady state</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.time_to_steady_state_days + ' days'"></span></div>
            </div>
          </template>
        </div>
      </div>
      <!-- Renal -->
      <div x-show="$store.clinicalModal.activeTab==='renal'">
        <div class="dp-card">
          <h3>Renal Dose Adjustment (CKD-EPI 2021)</h3>
          <div class="dp-grid">
            <div><label class="dp-label">Drug:</label><input type="text" x-model="$store.clinicalModal.renalDrug" class="dp-input" placeholder="metformin" /></div>
            <div><label class="dp-label">Serum Creatinine (mg/dL):</label><input type="number" x-model="$store.clinicalModal.renalScr" class="dp-input" placeholder="1.8" step="0.1" /></div>
            <div><label class="dp-label">Age:</label><input type="number" x-model="$store.clinicalModal.renalAge" class="dp-input" value="50" /></div>
            <div><label class="dp-label">Sex:</label><select x-model="$store.clinicalModal.renalSex" class="dp-input"><option value="male">Male</option><option value="female">Female</option></select></div>
            <div><label class="dp-label">Current dose (mg):</label><input type="number" x-model="$store.clinicalModal.renalDose" class="dp-input" placeholder="1000" /></div>
          </div>
          <button class="dp-btn" @click="$store.clinicalModal.runRenal()" :disabled="$store.clinicalModal.loading">Calculate GFR + Adjust</button>
          <template x-if="$store.clinicalModal.result?.gfr_ml_min">
            <div class="dp-result">
              <div class="dp-stat"><span class="dp-stat-label">GFR</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.gfr_ml_min + ' mL/min'"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">CKD Stage</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.ckd_stage"></span></div>
              <div class="dp-stat" x-show="$store.clinicalModal.result.suggested_dose_mg"><span class="dp-stat-label">Suggested dose</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.suggested_dose_mg + ' mg'"></span></div>
            </div>
          </template>
        </div>
      </div>
      <!-- Naranjo -->
      <div x-show="$store.clinicalModal.activeTab==='naranjo'">
        <div class="dp-card">
          <h3>Naranjo ADR Causality Assessment</h3>
          <p class="dp-hint">Answer each question: Yes, No, or Unknown</p>
          <div x-for="(q, i) in ['Previous reports on this reaction?','ADR appeared after drug?','ADR improved when discontinued?','ADR reappeared on re-administration?','Alternative causes?','Reaction with placebo?','Drug in toxic concentrations?','More severe at higher dose?','Similar reaction to same drug class?','Objective evidence confirms ADR?']" :key="i" style="margin-bottom:6px">
            <label class="dp-label" x-text="(i+1) + '. ' + q"></label>
            <select x-model="$store.clinicalModal.naranjoAnswers[i]" class="dp-input"><option value="yes">Yes</option><option value="no">No</option><option value="unknown">Unknown</option></select>
          </div>
          <button class="dp-btn" @click="$store.clinicalModal.runNaranjo()" :disabled="$store.clinicalModal.loading">Calculate Naranjo Score</button>
          <template x-if="$store.clinicalModal.result?.total_score !== undefined">
            <div class="dp-result">
              <div class="dp-stat"><span class="dp-stat-label">Score</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.total_score"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Category</span><span class="dp-stat-val" x-text="$store.clinicalModal.result.category"></span></div>
            </div>
          </template>
        </div>
      </div>
    </div>
    <style>
      .dp-panel{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background)}
      .dp-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0}
      .dp-icon{font-size:24px;color:var(--color-primary)}
      .dp-header h2{font-size:0.95rem;margin:0;font-weight:700;color:var(--color-text)}
      .dp-sub{font-size:0.6rem;color:var(--color-text-muted);margin:0}
      .dp-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0;flex-wrap:wrap}
      .dp-tab{padding:5px 10px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);font-size:0.6rem;cursor:pointer;border-radius:12px}
      .dp-tab.active{background:var(--color-primary);color:white;border-color:var(--color-primary)}
      .dp-body{flex:1;overflow-y:auto;padding:12px 16px}
      .dp-card{background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;padding:14px;margin-bottom:10px}
      .dp-card h3{font-size:0.8rem;margin:0 0 8px 0;color:var(--color-text)}
      .dp-hint{font-size:0.58rem;color:var(--color-text-muted);margin:0 0 8px 0;line-height:1.4}
      .dp-label{font-size:0.62rem;font-weight:600;color:var(--color-text);margin-bottom:3px;display:block}
      .dp-input{width:100%;padding:7px 10px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.65rem;box-sizing:border-box;margin-bottom:8px}
      .dp-input:focus{outline:none;border-color:var(--color-primary)}
      .dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .dp-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:var(--color-primary);border:none;border-radius:6px;color:white;font-size:0.7rem;font-weight:600;cursor:pointer;margin-top:6px}
      .dp-btn:disabled{opacity:0.5;cursor:not-allowed}
      .dp-error{padding:7px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:5px;color:#ff6b6b;font-size:0.6rem;margin-bottom:8px}
      .dp-loading{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;font-size:0.65rem;color:var(--color-text-muted)}
      .dp-spinner{width:14px;height:14px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:dpspin 0.8s linear infinite}
      @keyframes dpspin{to{transform:rotate(360deg)}}
      .dp-result{margin-top:10px;padding:10px;background:var(--color-background);border:1px solid var(--color-border);border-radius:6px}
      .dp-result.dp-danger{border-color:rgba(255,107,107,0.4);background:rgba(255,107,107,0.05)}
      .dp-stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--color-border)}
      .dp-stat:last-child{border-bottom:none}
      .dp-stat-label{font-size:0.6rem;color:var(--color-text-muted);font-weight:600}
      .dp-stat-val{font-size:0.65rem;color:var(--color-text);font-weight:600}
      .dp-stat-val.bad{color:#ff6b6b}
      .dp-stat-val.good{color:#22c55e}
    </style>
  </div>
</body>
</html>
