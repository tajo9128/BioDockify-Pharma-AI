<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";
    export const store = createStore("pharmacophore", {
      smiles: "", features: [], featureSummary: {}, loading: false, error: "",
      querySmiles: "", librarySmiles: "", hits: [], screenLoading: false,
      async generate() {
        if (!this.smiles) { this.error = "Enter a SMILES string"; return; }
        this.loading = true; this.error = "";
        try { const r = await callJsonApi("pharmacophore", { action: "generate", smiles: this.smiles }); if (!r.success) { this.error = r.error; } else { this.features = r.features; this.featureSummary = r.feature_summary; } } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async screen() {
        if (!this.querySmiles || !this.librarySmiles) { this.error = "Enter query and library SMILES"; return; }
        this.screenLoading = true; this.error = "";
        try { const r = await callJsonApi("pharmacophore", { action: "screen", query_smiles: this.querySmiles, library_smiles: this.librarySmiles }); if (!r.success) { this.error = r.error; } else { this.hits = r.hits; } } catch (e) { this.error = e.message; }
        this.screenLoading = false;
      },
      fColor(t) { const c = {Donor:'#4169E1',Acceptor:'#DC143C',Hydrophobic:'#FFD700',Aromatic:'#9932CC',PosIonizable:'#32CD32',NegIonizable:'#FF8C00'}; return c[t]||'#888' },
    });
  </script>
</head>
<body>
  <div x-data class="nb-panel">
    <div class="nb-header"><span class="material-symbols-outlined nb-icon">ads_click</span><div><h2>Pharmacophore</h2><p class="nb-sub">Feature detection & library screening</p></div></div>
    <div x-show="$store.pharmacophore.error" class="nb-error" x-text="$store.pharmacophore.error"></div>

    <div class="nb-content">
      <div class="nb-form"><h4>Generate Pharmacophore</h4>
        <div class="nb-form-row">
          <input type="text" x-model="$store.pharmacophore.smiles" placeholder="SMILES (e.g. CC(=O)Oc1ccccc1C(=O)O)" class="nb-input flex-1" style="font-family:monospace" @keyup.enter="$store.pharmacophore.generate()" />
          <button class="nb-btn-primary" @click="$store.pharmacophore.generate()" style="flex:none;width:auto" :disabled="$store.pharmacophore.loading || !$store.pharmacophore.smiles">Generate</button>
        </div>
        <div x-show="$store.pharmacophore.loading" class="nb-loading"><div class="loading-spinner"></div><span>Extracting features...</span></div>
        <template x-if="$store.pharmacophore.features.length">
          <div style="margin-top:6px"><div class="nb-entry-meta" style="margin-bottom:4px" x-text="$store.pharmacophore.features.length + ' features found'"></div><div style="display:flex;gap:4px;flex-wrap:wrap"><template x-for="(count, type) in $store.pharmacophore.featureSummary"><span style="padding:2px 8px;border-radius:4px;font-size:0.55rem;font-weight:600;color:white" :style="'background:' + $store.pharmacophore.fColor(type)" x-text="type + ': ' + count"></span></template></div></div>
        </template>
      </div>

      <div class="nb-form"><h4>Library Screening</h4>
        <input type="text" x-model="$store.pharmacophore.querySmiles" placeholder="Query SMILES" class="nb-input-sm" style="margin-bottom:4px;font-family:monospace" />
        <textarea x-model="$store.pharmacophore.librarySmiles" placeholder="Library SMILES (one per line)..." class="nb-textarea" style="font-family:monospace"></textarea>
        <button class="nb-btn-primary" @click="$store.pharmacophore.screen()" :disabled="$store.pharmacophore.screenLoading || !$store.pharmacophore.querySmiles || !$store.pharmacophore.librarySmiles">Screen Library</button>
        <template x-if="$store.pharmacophore.hits.length">
          <div style="margin-top:6px"><div class="nb-entry-meta" x-text="$store.pharmacophore.hits.length + ' hits'"></div>
            <template x-for="h in $store.pharmacophore.hits">
              <div class="nb-entry-card" style="display:flex;justify-content:space-between"><span class="nb-entry-title" style="font-family:monospace" x-text="h.smiles.substring(0,50)"></span><span style="color:var(--color-primary);font-weight:600;font-size:0.6rem" x-text="(h.score * 100).toFixed(0) + '%'"></span></div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <style>
      .nb-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 14px;background:var(--color-background) }
      .nb-header { display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0 }
      .nb-icon { font-size:22px;color:var(--color-primary) }
      .nb-header h2 { color:var(--color-primary);font-size:0.9rem;margin:0;font-weight:700 }
      .nb-sub { color:var(--color-text-muted);font-size:0.58rem;margin:0 }
      .nb-content { flex:1;overflow-y:auto;min-width:0;min-height:0 }
      .nb-error { padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;color:var(--color-error-text);font-size:0.6rem;margin-bottom:4px }
      .nb-loading { display:flex;align-items:center;gap:5px;font-size:0.62rem;color:var(--color-text-muted);margin-bottom:4px }
      .loading-spinner { width:12px;height:12px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .nb-form { padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:8px }
      .nb-form h4 { font-size:0.64rem;font-weight:600;color:var(--color-primary);margin:0 0 6px 0 }
      .nb-form-row { display:flex;gap:4px;align-items:center }
      .nb-input { flex:1;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-background);color:var(--color-text);font-size:0.68rem;min-width:0 }
      .nb-input:focus { outline:none;border-color:var(--color-primary) }
      .nb-input::placeholder { color:var(--color-text-muted);font-size:0.62rem }
      .nb-input-sm { width:100%;padding:5px 8px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.62rem;box-sizing:border-box }
      .nb-input-sm:focus { outline:none;border-color:var(--color-primary) }
      .nb-textarea { width:100%;padding:5px 8px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.62rem;min-height:50px;resize:vertical;box-sizing:border-box;margin-bottom:4px;font-family:monospace }
      .nb-btn-primary { display:flex;align-items:center;justify-content:center;gap:3px;width:100%;padding:6px 10px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.66rem;font-weight:600;white-space:nowrap;box-sizing:border-box }
      .nb-btn-primary:disabled { opacity:0.5;cursor:not-allowed }
      .nb-entry-card { padding:8px 10px;background:var(--color-background);border:1px solid var(--color-border);border-radius:7px;margin-bottom:3px }
      .nb-entry-title { flex:1;font-size:0.66rem;font-weight:600;color:var(--color-text) }
      .nb-entry-meta { display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px;font-size:0.55rem;color:var(--color-text-muted) }
      .flex-1 { flex:1;min-width:0 }
    </style>
  </div>
</body>
</html>
