<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("pharmacophoreModal", {
      activeTab: "generate",
      smiles: "",
      proteinPdb: "",
      result: null,
      loading: false,
      error: "",
      screenSmiles: "",
      screenLibrary: "",
      screenResult: null,
      hypothesisSmiles: "",
      hypothesisResult: null,
      fingerprintSmiles: "",
      fingerprintResult: null,
      shapeQuery: "",
      shapeTarget: "",
      shapeResult: null,

      async generate() {
        if (!this.smiles) return;
        this.loading = true;
        this.error = "";
        try {
          const r = await callJsonApi("pharmacophore", { action: "generate", smiles: this.smiles.trim() });
          if (!r.success) { this.error = r.error; } else { this.result = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async proteinModel() {
        if (!this.proteinPdb) return;
        this.loading = true;
        this.error = "";
        try {
          const r = await callJsonApi("pharmacophore", { action: "protein_model", protein_pdb: this.proteinPdb });
          if (!r.success) { this.error = r.error; } else { this.result = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async screen() {
        if (!this.screenSmiles || !this.screenLibrary) return;
        this.loading = true;
        this.error = "";
        try {
          const librarySmiles = this.screenLibrary.split("\n").map(s => s.trim()).filter(s => s);
          const r = await callJsonApi("pharmacophore", {
            action: "screen",
            query_smiles: this.screenSmiles.trim(),
            library_smiles: librarySmiles,
          });
          if (!r.success) { this.error = r.error; } else { this.screenResult = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async hypothesis() {
        if (!this.hypothesisSmiles) return;
        this.loading = true;
        this.error = "";
        try {
          const smilesList = this.hypothesisSmiles.split("\n").map(s => s.trim()).filter(s => s);
          const r = await callJsonApi("pharmacophore", {
            action: "hypothesis",
            active_smiles: smilesList,
          });
          if (!r.success) { this.error = r.error; } else { this.hypothesisResult = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async fingerprint() {
        if (!this.fingerprintSmiles) return;
        this.loading = true;
        this.error = "";
        try {
          const r = await callJsonApi("pharmacophore", {
            action: "enhanced_fingerprint",
            smiles: this.fingerprintSmiles.trim(),
          });
          if (!r.success) { this.error = r.error; } else { this.fingerprintResult = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async shapeMatch() {
        if (!this.shapeQuery || !this.shapeTarget) return;
        this.loading = true;
        this.error = "";
        try {
          const r = await callJsonApi("pharmacophore", {
            action: "enhanced_shape",
            query_smiles: this.shapeQuery.trim(),
            target_smiles: this.shapeTarget.trim(),
          });
          if (!r.success) { this.error = r.error; } else { this.shapeResult = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel">
    <div class="panel-header">
      <div class="header-left">
        <span class="material-symbols-outlined header-icon">hub</span>
        <div>
          <h2>Pharmacophore Modeling</h2>
          <p class="header-subtitle">OpenPharmaco + Pharmer engine</p>
        </div>
      </div>
    </div>
    <div class="panel-body">
      <!-- Error display -->
      <div x-show="$store.pharmacophoreModal.error" class="dock-error" x-text="$store.pharmacophoreModal.error"></div>
      
      <!-- Tabs -->
      <div class="tabs">
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'generate'}" @click="$store.pharmacophoreModal.activeTab = 'generate'">Generate</button>
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'protein'}" @click="$store.pharmacophoreModal.activeTab = 'protein'">Protein Model</button>
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'screen'}" @click="$store.pharmacophoreModal.activeTab = 'screen'">Screen</button>
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'hypothesis'}" @click="$store.pharmacophoreModal.activeTab = 'hypothesis'">Hypothesis</button>
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'fingerprint'}" @click="$store.pharmacophoreModal.activeTab = 'fingerprint'">Fingerprint</button>
        <button :class="{'active': $store.pharmacophoreModal.activeTab === 'shape'}" @click="$store.pharmacophoreModal.activeTab = 'shape'">Shape Match</button>
      </div>
      
      <!-- Generate Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'generate'">
        <div class="input-group">
          <label>SMILES:</label>
          <input type="text" x-model="$store.pharmacophoreModal.smiles" class="mt-input" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O" @keyup.enter="$store.pharmacophoreModal.generate()" />
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.generate()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.smiles">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Generate Pharmacophore
        </button>
        
        <!-- Generate Result -->
        <template x-if="$store.pharmacophoreModal.result && $store.pharmacophoreModal.result.features">
          <div class="result-card">
            <h3>Pharmacophore Features (<span x-text="$store.pharmacophoreModal.result.num_features"></span>)</h3>
            <div class="features-grid">
              <template x-for="(count, type) in $store.pharmacophoreModal.result.feature_summary" :key="type">
                <div class="feature-card">
                  <div class="feature-type" x-text="type"></div>
                  <div class="feature-count" x-text="count"></div>
                </div>
              </template>
            </div>
            <div class="features-list">
              <template x-for="(feat, index) in $store.pharmacophoreModal.result.features" :key="index">
                <div class="feature-item">
                  <div class="feature-badge" :style="'background:' + feat.color" x-text="feat.family"></div>
                  <div class="feature-pos" x-text="'(' + feat.position.x + ', ' + feat.position.y + ', ' + feat.position.z + ')'"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Protein Model Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'protein'">
        <div class="input-group">
          <label>Protein PDB:</label>
          <textarea x-model="$store.pharmacophoreModal.proteinPdb" class="mt-input" rows="8" placeholder="Paste PDB content here..."></textarea>
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.proteinModel()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.proteinPdb">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Extract Features
        </button>
        
        <!-- Protein Model Result -->
        <template x-if="$store.pharmacophoreModal.result && $store.pharmacophoreModal.result.features && $store.pharmacophoreModal.activeTab === 'protein'">
          <div class="result-card">
            <h3>Protein Features (<span x-text="$store.pharmacophoreModal.result.num_features"></span>)</h3>
            <div class="features-grid">
              <template x-for="(count, type) in $store.pharmacophoreModal.result.feature_summary" :key="type">
                <div class="feature-card">
                  <div class="feature-type" x-text="type"></div>
                  <div class="feature-count" x-text="count"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Screen Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'screen'">
        <div class="input-group">
          <label>Query SMILES:</label>
          <input type="text" x-model="$store.pharmacophoreModal.screenSmiles" class="mt-input" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O" />
        </div>
        
        <div class="input-group">
          <label>Library SMILES (one per line):</label>
          <textarea x-model="$store.pharmacophoreModal.screenLibrary" class="mt-input" rows="8" placeholder="CC12CCC3C(CCC4CC(=O)CCC34C)C1CCC2O&#10;..."></textarea>
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.screen()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.screenSmiles || !$store.pharmacophoreModal.screenLibrary">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Screen Library
        </button>
        
        <!-- Screen Result -->
        <template x-if="$store.pharmacophoreModal.screenResult">
          <div class="result-card">
            <h3>Screening Results</h3>
            <div class="stats-row">
              <div class="stat"><div class="stat-label">Query Features</div><div class="stat-value" x-text="$store.pharmacophoreModal.screenResult.query_types?.length"></div></div>
              <div class="stat"><div class="stat-label">Screened</div><div class="stat-value" x-text="$store.pharmacophoreModal.screenResult.total_screened"></div></div>
              <div class="stat"><div class="stat-label">Hits</div><div class="stat-value" x-text="$store.pharmacophoreModal.screenResult.total_hits"></div></div>
            </div>
            <div class="hits-list">
              <template x-for="(hit, index) in $store.pharmacophoreModal.screenResult.hits" :key="index">
                <div class="hit-item">
                  <div class="hit-smiles" x-text="hit.smiles"></div>
                  <div class="hit-score">
                    <span class="score-value" x-text="hit.weighted_score"></span>
                    <span class="score-label">%</span>
                  </div>
                  <div class="hit-types" x-text="hit.matched_types.join(', ')"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Hypothesis Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'hypothesis'">
        <div class="input-group">
          <label>Active SMILES (one per line):</label>
          <textarea x-model="$store.pharmacophoreModal.hypothesisSmiles" class="mt-input" rows="8" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O&#10;CC12CCC3C(CCC4CC(=O)CCC34C)C1CCC2O&#10;..."></textarea>
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.hypothesis()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.hypothesisSmiles">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Generate Hypothesis
        </button>
        
        <!-- Hypothesis Result -->
        <template x-if="$store.pharmacophoreModal.hypothesisResult">
          <div class="result-card">
            <h3>Pharmacophore Hypothesis</h3>
            <div class="hypothesis-features">
              <template x-for="(feat, index) in $store.pharmacophoreModal.hypothesisResult.hypothesis" :key="index">
                <div class="hypothesis-feature">
                  <div class="feature-badge" :style="'background:' + feat.color" x-text="feat.type"></div>
                  <div class="feature-center" x-text="'Center: (' + feat.center.join(', ') + ')'"></div>
                  <div class="feature-coverage" x-text="'Coverage: ' + (feat.coverage * 100).toFixed(0) + '%'"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Fingerprint Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'fingerprint'">
        <div class="input-group">
          <label>SMILES:</label>
          <input type="text" x-model="$store.pharmacophoreModal.fingerprintSmiles" class="mt-input" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O" @keyup.enter="$store.pharmacophoreModal.fingerprint()" />
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.fingerprint()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.fingerprintSmiles">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Generate Fingerprint
        </button>
        
        <!-- Fingerprint Result -->
        <template x-if="$store.pharmacophoreModal.fingerprintResult">
          <div class="result-card">
            <h3>Pharmacophore Fingerprint</h3>
            <div class="stats-row">
              <div class="stat"><div class="stat-label">Features</div><div class="stat-value" x-text="$store.pharmacophoreModal.fingerprintResult.num_features"></div></div>
              <div class="stat"><div class="stat-label">Bits Set</div><div class="stat-value" x-text="$store.pharmacophoreModal.fingerprintResult.bits_set"></div></div>
              <div class="stat"><div class="stat-label">Total Bits</div><div class="stat-value" x-text="$store.pharmacophoreModal.fingerprintResult.bits_total"></div></div>
            </div>
            <div class="fingerprint-display">
              <div class="fp-label">Fingerprint:</div>
              <div class="fp-string" x-text="$store.pharmacophoreModal.fingerprintResult.fingerprint"></div>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Shape Match Tab -->
      <div x-show="$store.pharmacophoreModal.activeTab === 'shape'">
        <div class="input-group">
          <label>Query SMILES:</label>
          <input type="text" x-model="$store.pharmacophoreModal.shapeQuery" class="mt-input" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O" />
        </div>
        
        <div class="input-group">
          <label>Target SMILES:</label>
          <input type="text" x-model="$store.pharmacophoreModal.shapeTarget" class="mt-input" placeholder="CC12CCC3C(CCC4CC(=O)CCC34C)C1CCC2O" @keyup.enter="$store.pharmacophoreModal.shapeMatch()" />
        </div>
        
        <button class="btn-run" @click="$store.pharmacophoreModal.shapeMatch()" :disabled="$store.pharmacophoreModal.loading || !$store.pharmacophoreModal.shapeQuery || !$store.pharmacophoreModal.shapeTarget">
          <span x-show="$store.pharmacophoreModal.loading" class="loading-spinner"></span>
          Compare Shapes
        </button>
        
        <!-- Shape Result -->
        <template x-if="$store.pharmacophoreModal.shapeResult">
          <div class="result-card">
            <h3>Shape Similarity</h3>
            <div class="stats-row">
              <div class="stat"><div class="stat-label">Similarity</div><div class="stat-value" :class="{'good': $store.pharmacophoreModal.shapeResult.shape_similarity >= 0.5, 'bad': $store.pharmacophoreModal.shapeResult.shape_similarity < 0.5}" x-text="($store.pharmacophoreModal.shapeResult.shape_similarity * 100).toFixed(1) + '%'"></div></div>
              <div class="stat"><div class="stat-label">Match</div><div class="stat-value" :class="{'good': $store.pharmacophoreModal.shapeResult.match, 'bad': !$store.pharmacophoreModal.shapeResult.match}" x-text="$store.pharmacophoreModal.shapeResult.match ? 'YES' : 'NO'"></div></div>
            </div>
          </div>
        </template>
      </div>
    </div>
    
    <style>
      .dock-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .panel-header { padding:14px 20px;border-bottom:1px solid var(--color-border);background:var(--color-panel) }
      .header-left { display:flex;align-items:center;gap:12px }
      .header-icon { font-size:28px;color:var(--color-primary) }
      .panel-header h2 { color:var(--color-text);font-size:1.05rem;margin:0;font-weight:700 }
      .header-subtitle { color:var(--color-text-muted);font-size:0.7rem;margin:0 }
      .panel-body { flex:1;overflow-y:auto;padding:16px 20px }
      .dock-error { padding:8px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.68rem;margin-bottom:10px }
      .tabs { display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap }
      .tabs button { flex:1;padding:8px 12px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);font-size:0.7rem;cursor:pointer;border-radius:6px;min-width:80px }
      .tabs button.active { background:var(--color-primary);color:white;border-color:var(--color-primary) }
      .input-group { margin-bottom:12px }
      .input-group label { display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:4px }
      .mt-input { width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-panel);color:var(--color-text);font-size:0.7rem;font-family:monospace;box-sizing:border-box }
      .mt-input:focus { outline:none;border-color:var(--color-primary) }
      .btn-run { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:10px;background:var(--color-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-size:0.8rem;font-weight:600 }
      .btn-run:disabled { opacity:0.5;cursor:not-allowed }
      .loading-spinner { width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top:2px solid white;border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .result-card { margin-top:16px;padding:16px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px }
      .result-card h3 { margin:0 0 12px 0;font-size:0.9rem;color:var(--color-text) }
      .stats-row { display:flex;gap:12px;margin-bottom:12px }
      .stat { flex:1;text-align:center;padding:8px;background:rgba(34,197,94,0.05);border-radius:6px }
      .stat-label { font-size:0.65rem;color:var(--color-text-muted);font-weight:600 }
      .stat-value { font-size:0.85rem;font-weight:700;color:#22c55e;margin-top:2px }
      .stat-value.good { color:#22c55e }
      .stat-value.bad { color:#ff6b6b }
      .features-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:12px }
      .feature-card { text-align:center;padding:8px;background:rgba(65,105,225,0.05);border-radius:6px }
      .feature-type { font-size:0.7rem;font-weight:600;color:var(--color-text) }
      .feature-count { font-size:0.85rem;font-weight:700;color:var(--color-primary);margin-top:2px }
      .features-list { display:flex;flex-wrap:wrap;gap:6px }
      .feature-item { display:flex;align-items:center;gap:4px;font-size:0.65rem }
      .feature-badge { padding:2px 8px;border-radius:4px;color:white;font-size:0.6rem;font-weight:600 }
      .feature-pos { font-family:monospace;font-size:0.6rem;color:var(--color-text-muted) }
      .hits-list { display:flex;flex-direction:column;gap:6px }
      .hit-item { display:flex;align-items:center;gap:12px;padding:8px;background:rgba(34,197,94,0.05);border-radius:6px }
      .hit-smiles { flex:1;font-family:monospace;font-size:0.65rem;color:var(--color-text) }
      .hit-score { text-align:center }
      .score-value { font-size:0.85rem;font-weight:700;color:#22c55e }
      .score-label { font-size:0.6rem;color:var(--color-text-muted) }
      .hit-types { font-size:0.6rem;color:var(--color-text-muted) }
      .hypothesis-features { display:flex;flex-direction:column;gap:8px }
      .hypothesis-feature { display:flex;align-items:center;gap:12px;padding:8px;background:rgba(65,105,225,0.05);border-radius:6px }
      .feature-center { font-family:monospace;font-size:0.65rem;color:var(--color-text-muted) }
      .feature-coverage { font-size:0.7rem;font-weight:600;color:#22c55e }
      .fingerprint-display { margin-top:12px }
      .fp-label { font-size:0.7rem;font-weight:600;color:var(--color-text);margin-bottom:4px }
      .fp-string { font-family:monospace;font-size:0.65rem;color:var(--color-text);word-break:break-all;background:rgba(0,0,0,0.05);padding:8px;border-radius:6px }
    </style>
  </div>
</body>
</html>
