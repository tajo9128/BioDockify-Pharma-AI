<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("enviroTox", {
      activeTab: "assess",
      loading: false,
      error: "",
      message: "",

      smiles: "Clc1ccc(C(c2ccc(Cl)cc2)Cl)cc1",
      result: null,
      batchText: "CCO\nCC(=O)Oc1ccccc1C(=O)O",
      batchResult: null,

      flash(msg) { this.message = msg; setTimeout(() => this.message = "", 2500); },

      async assess() {
        if (!this.smiles.trim()) { this.error = "Enter SMILES"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("envirotox", { action: "assess", smiles: this.smiles.trim() });
          if (r.error) { this.error = r.error; return; }
          this.result = r;
          this.flash(`Overall concern: ${r.overall_concern}`);
        } finally { this.loading = false; }
      },

      async batch() {
        const list = this.batchText.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        if (!list.length) { this.error = "Enter SMILES list"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("envirotox", { action: "batch", smiles_list: list });
          if (r.error) { this.error = r.error; return; }
          this.batchResult = r;
          this.flash(`${r.count} compounds screened`);
        } finally { this.loading = false; }
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel">

    <!-- Header -->
    <div class="panel-header">
      <div class="header-left">
        <span class="material-symbols-outlined header-icon">eco</span>
        <div>
          <h2>Environmental Toxicology</h2>
          <p class="header-subtitle">PBT screening · Bioconcentration · Fish toxicity · Biodegradability</p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="dock-tabs">
      <button class="dock-tab" :class="{active: $store.enviroTox.activeTab==='assess'}" @click="$store.enviroTox.activeTab='assess'">
        <span class="material-symbols-outlined">health_and_safety</span> Assess</button>
      <button class="dock-tab" :class="{active: $store.enviroTox.activeTab==='batch'}" @click="$store.enviroTox.activeTab='batch'">
        <span class="material-symbols-outlined">playlist_add_check</span> Batch Screen</button>
    </div>

    <!-- Body -->
    <div class="panel-body">
      <div x-show="$store.enviroTox.error" class="dock-error" x-text="$store.enviroTox.error"></div>
      <div x-show="$store.enviroTox.message" class="dock-msg" x-text="$store.enviroTox.message"></div>
      <div x-show="$store.enviroTox.loading" class="dock-loading"><div class="loading-spinner"></div><span>Screening compound...</span></div>

      <!-- Assess -->
      <div class="tab-content" x-show="$store.enviroTox.activeTab==='assess'">
        <h3 class="section-title">Assess Environmental Risk</h3>
        <div class="dock-card">
          <div class="dock-card-header">
            <span class="material-symbols-outlined dock-card-icon">eco</span>
            <h4>Compound</h4>
          </div>
          <div class="et-row">
            <input x-model="$store.enviroTox.smiles" class="mt-input" placeholder="Compound SMILES" @keydown.enter="$store.enviroTox.assess()">
          </div>
        </div>
        <button class="btn-run" @click="$store.enviroTox.assess()" :disabled="$store.enviroTox.loading">
          <span class="material-symbols-outlined">play_arrow</span>
          <span x-text="$store.enviroTox.loading ? 'Assessing...' : 'Assess'"></span>
        </button>

        <template x-if="$store.enviroTox.result">
          <div class="et-block">
            <div class="et-concern" :class="'concern-' + $store.enviroTox.result.overall_concern">
              Overall concern: <b x-text="$store.enviroTox.result.overall_concern.toUpperCase()"></b>
              <span class="et-formula" x-text="$store.enviroTox.result.descriptors.formula + ' · logP ' + $store.enviroTox.result.descriptors.logp + ' · MW ' + $store.enviroTox.result.descriptors.mw"></span>
            </div>

            <div class="analysis-grid">
              <div class="analysis-card">
                <span class="card-title">Bioconcentration</span>
                <span class="card-desc" style="font-size:0.85rem;font-weight:700;color:var(--color-primary)" x-text="$store.enviroTox.result.bioconcentration.bcf_l_kg + ' L/kg'"></span>
                <span class="card-desc" x-text="'log BCF ' + $store.enviroTox.result.bioconcentration.log_bcf"></span>
                <div class="et-flags">
                  <span class="et-flag bad" x-show="$store.enviroTox.result.bioconcentration.bioaccumulative_b">B ≥ 2000</span>
                  <span class="et-flag bad" x-show="$store.enviroTox.result.bioconcentration.very_bioaccumulative_vb">vB ≥ 5000</span>
                </div>
                <span class="et-model" x-text="$store.enviroTox.result.bioconcentration.model"></span>
              </div>
              <div class="analysis-card">
                <span class="card-title">Fish 96h LC50</span>
                <span class="card-desc" style="font-size:0.85rem;font-weight:700;color:var(--color-primary)" x-text="$store.enviroTox.result.fish_toxicity_96h.lc50_mg_l + ' mg/L'"></span>
                <div class="et-flags">
                  <span class="et-flag bad" x-show="$store.enviroTox.result.fish_toxicity_96h.toxic_t">T &lt; 10 mg/L</span>
                </div>
                <span class="card-desc" x-text="$store.enviroTox.result.fish_toxicity_96h.mode_of_action.join('; ')"></span>
              </div>
              <div class="analysis-card">
                <span class="card-title">Biodegradability</span>
                <span class="card-desc" style="font-size:0.85rem;font-weight:700" x-text="$store.enviroTox.result.biodegradability.verdict"></span>
                <span class="card-desc" x-text="'score ' + $store.enviroTox.result.biodegradability.biowin_like_score"></span>
                <span class="card-desc" x-text="$store.enviroTox.result.pbt_screen.classification"></span>
              </div>
              <div class="analysis-card">
                <span class="card-title">Soil Adsorption</span>
                <span class="card-desc" style="font-size:0.85rem;font-weight:700;color:var(--color-primary)" x-text="$store.enviroTox.result.soil_adsorption.koc_l_kg + ' L/kg'"></span>
                <span class="card-desc" x-text="$store.enviroTox.result.soil_adsorption.mobility"></span>
              </div>
            </div>

            <div class="et-flags" x-show="$store.enviroTox.result.green_chemistry_flags.length">
              <template x-for="f in $store.enviroTox.result.green_chemistry_flags" :key="f">
                <span class="et-flag warn" x-text="f"></span>
              </template>
            </div>
            <div class="et-note" x-text="$store.enviroTox.result.disclaimer"></div>
          </div>
        </template>

        <div class="no-results" x-show="!$store.enviroTox.result && !$store.enviroTox.loading">
          <span class="material-symbols-outlined">eco</span>
          <p>Enter a compound SMILES to screen for environmental hazards</p>
        </div>
      </div>

      <!-- Batch -->
      <div class="tab-content" x-show="$store.enviroTox.activeTab==='batch'">
        <h3 class="section-title">Batch Screening</h3>
        <div class="dock-card">
          <div class="dock-card-header">
            <span class="material-symbols-outlined dock-card-icon">playlist_add_check</span>
            <h4>Compound List</h4>
          </div>
          <textarea x-model="$store.enviroTox.batchText" rows="4" class="mt-textarea" placeholder="One SMILES per line"></textarea>
        </div>
        <button class="btn-run" @click="$store.enviroTox.batch()" :disabled="$store.enviroTox.loading">
          <span class="material-symbols-outlined">playlist_add_check</span>
          <span x-text="$store.enviroTox.loading ? 'Screening...' : 'Screen Batch'"></span>
        </button>
        <template x-if="$store.enviroTox.batchResult">
          <div class="et-block">
            <div class="data-info-bar">
              <span class="material-symbols-outlined success-icon">check_circle</span>
              <span class="analysis-name" x-text="$store.enviroTox.batchResult.count + ' compounds screened'"></span>
            </div>
            <table class="et-table">
              <thead><tr><th>SMILES</th><th>Formula</th><th>logP</th><th>BCF</th><th>LC50 mg/L</th><th>Biodeg</th><th>Concern</th></tr></thead>
              <tbody>
                <template x-for="r in $store.enviroTox.batchResult.results" :key="r.smiles">
                  <tr>
                    <td><code x-text="(r.smiles || r.error || '').slice(0, 34)"></code></td>
                    <td x-text="r.formula || ''"></td>
                    <td x-text="r.logp ?? ''"></td>
                    <td x-text="r.bcf_l_kg ?? ''"></td>
                    <td x-text="r.lc50_mg_l ?? ''"></td>
                    <td class="et-muted" x-text="(r.biodeg || '').split(' ')[0]"></td>
                    <td><span :class="'concern-badge-' + (r.concern || '')" x-text="r.concern || 'error'"></span></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </div>

    <style>
      .dock-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--color-background); }
      .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--color-border); background: var(--color-panel); flex-shrink: 0; }
      .header-left { display: flex; align-items: center; gap: 12px; }
      .header-icon { font-size: 28px; color: var(--color-primary); }
      .panel-header h2 { color: var(--color-text); font-size: 1.05rem; margin: 0; font-weight: 700; }
      .header-subtitle { color: var(--color-text-muted); font-size: 0.7rem; margin: 2px 0 0 0; }

      .dock-tabs { display: flex; gap: 2px; padding: 6px 20px; border-bottom: 1px solid var(--color-border); background: var(--color-panel); flex-shrink: 0; overflow-x: auto; }
      .dock-tab { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--color-text-muted); cursor: pointer; font-size: 0.68rem; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
      .dock-tab:hover { color: var(--color-text); }
      .dock-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
      .dock-tab .material-symbols-outlined { font-size: 15px; }

      .panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
      .tab-content { min-height: 120px; }

      .dock-error { padding: 8px 10px; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); border-radius: 6px; color: var(--color-error-text, #ff6b6b); font-size: 0.68rem; margin-bottom: 10px; }
      .dock-msg { padding: 8px 10px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 6px; color: #22c55e; font-size: 0.68rem; margin-bottom: 10px; }
      .dock-loading { display: flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 0.7rem; color: var(--color-text-muted); }
      .loading-spinner { width: 15px; height: 15px; border: 2px solid var(--color-border); border-top: 2px solid var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .section-title { font-size: 0.78rem; font-weight: 700; color: var(--color-text); margin: 0 0 8px 0; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }

      .dock-card { padding: 14px; background: var(--color-panel); border: 1px solid var(--color-border); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
      .dock-card-header { display: flex; align-items: center; gap: 8px; }
      .dock-card-icon { font-size: 20px; color: var(--color-primary); }
      .dock-card h4 { color: var(--color-text); font-size: 0.78rem; font-weight: 600; margin: 0; }

      .mt-input { width: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 7px; background: var(--color-background); color: var(--color-text); font-size: 0.7rem; font-family: var(--font-mono, monospace); min-width: 0; }
      .mt-input:focus { outline: none; border-color: var(--color-primary); }
      .mt-input::placeholder { font-family: var(--font-family-main); color: var(--color-text-muted); font-size: 0.64rem; }
      .mt-textarea { width: 100%; min-height: 54px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 7px; background: var(--color-background); color: var(--color-text); font-size: 0.68rem; font-family: var(--font-mono, monospace); resize: vertical; }
      .mt-textarea:focus { outline: none; border-color: var(--color-primary); }
      .et-row { display: flex; gap: 8px; }

      .btn-run { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 6px; padding: 10px; background: var(--color-primary); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; }
      .btn-run:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
      .btn-run:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .data-info-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--color-background); border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 8px; font-size: 0.75rem; }
      .success-icon { font-size: 16px; color: #22c55e; }
      .analysis-name { color: var(--color-text); font-weight: 500; }

      .analysis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .analysis-card { display: flex; flex-direction: column; align-items: center; padding: 12px 8px; background: var(--color-background); border: 2px solid var(--color-border); border-radius: 10px; text-align: center; gap: 3px; }
      .card-title { font-size: 0.68rem; font-weight: 700; color: var(--color-text); }
      .card-desc { font-size: 0.6rem; color: var(--color-text-muted); }

      .et-block { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; background: var(--color-panel); }
      .et-concern { font-size: 0.8rem; padding: 6px 0 10px; border-bottom: 1px solid var(--color-border); font-weight: 600; }
      .et-formula { font-size: 0.62rem; color: var(--color-text-muted); margin-left: 10px; font-weight: 400; }
      .concern-high { color: #ff6b6b; }
      .concern-moderate { color: #f59e0b; }
      .concern-low { color: #22c55e; }
      .et-flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
      .et-flag { font-size: 0.55rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
      .et-flag.bad { background: rgba(255,107,107,0.12); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.25); }
      .et-flag.warn { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
      .et-muted { color: var(--color-text-muted); font-size: 0.62rem; }
      .et-model { color: var(--color-text-muted); font-size: 0.56rem; font-style: italic; }
      .et-note { color: var(--color-text-muted); font-size: 0.6rem; font-style: italic; }

      .et-table { border-collapse: collapse; font-size: 0.64rem; width: 100%; }
      .et-table th { text-align: left; color: var(--color-text-muted); padding: 4px 8px; border-bottom: 1px solid var(--color-border); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .et-table td { padding: 4px 8px; border-bottom: 1px dotted var(--color-border); color: var(--color-text); }
      .et-table code { font-size: 0.6rem; font-family: var(--font-mono, monospace); color: var(--color-primary); word-break: break-all; }
      .concern-badge-high { color: #ff6b6b; font-weight: 600; }
      .concern-badge-moderate { color: #f59e0b; font-weight: 600; }
      .concern-badge-low { color: #22c55e; font-weight: 600; }

      .no-results { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--color-text-muted); text-align: center; }
      .no-results .material-symbols-outlined { font-size: 42px; opacity: 0.25; margin-bottom: 10px; }
      .no-results p { font-size: 0.8rem; margin: 0; }
    </style>
  </div>
</body>
</html>
