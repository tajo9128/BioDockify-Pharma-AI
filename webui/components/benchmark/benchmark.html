<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("benchmarkModal", {
      results: null, loading: false, error: "",

      async run() {
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("benchmark", { action: "run" });
          this.results = r;
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
    });
  </script>
</head>
<body style="margin:0">
  <div x-data class="dock-panel">
    <div class="panel-header"><div class="header-left"><span class="material-symbols-outlined header-icon">monitoring</span><div><h2>Benchmark Suite</h2><p class="header-subtitle">System diagnostics &amp; validation</p></div></div></div>
    <div class="panel-body">
      <div x-show="$store.benchmarkModal.error" class="dock-error" x-text="$store.benchmarkModal.error"></div>
      <button class="btn-run" @click="$store.benchmarkModal.run()" :disabled="$store.benchmarkModal.loading" style="margin-top:0">Run All Benchmarks</button>
      <div x-show="$store.benchmarkModal.loading" class="dock-loading"><div class="loading-spinner"></div><span>Running diagnostics...</span></div>
      <template x-if="$store.benchmarkModal.results?.benchmarks">
        <div style="margin-top:12px">
          <template x-for="(v, name) in $store.benchmarkModal.results.benchmarks" :key="name">
            <div style="padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:0.7rem;font-weight:600;color:var(--color-text);text-transform:uppercase" x-text="name"></span>
              <span style="font-size:0.65rem;font-weight:700" :style="'color:' + (v?.passed ? '#22c55e' : '#ff6b6b')" x-text="v?.passed ? 'PASS' : (v?.error || 'FAIL')"></span>
            </div>
          </template>
        </div>
      </template>
    </div>
    <style>
      .dock-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .panel-header { padding:14px 20px;border-bottom:1px solid var(--color-border);background:var(--color-panel) }
      .header-left { display:flex;align-items:center;gap:12px }
      .header-icon { font-size:28px;color:var(--color-primary) }
      .panel-header h2 { color:var(--color-text);font-size:1.05rem;margin:0;font-weight:700 }
      .header-subtitle { color:var(--color-text-muted);font-size:0.7rem;margin:0 }
      .panel-body { flex:1;overflow-y:auto;padding:16px 20px }
      .dock-error { padding:8px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.68rem;margin-bottom:10px }
      .dock-loading { display:flex;align-items:center;gap:6px;padding:8px 0;font-size:0.7rem;color:var(--color-text-muted) }
      .loading-spinner { width:15px;height:15px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .btn-run { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;background:var(--color-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-size:0.8rem;font-weight:600 }
      .btn-run:disabled { opacity:0.5;cursor:not-allowed }
    </style>
  </div>
</body>
</html>
