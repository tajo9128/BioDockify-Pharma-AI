<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";
    export const store = createStore("benchmarkModal", { results: null, loading: false, error: "",
      async run() { this.loading = true; this.error = ""; try { this.results = await callJsonApi("benchmark", { action: "run" }); } catch (e) { this.error = e.message; } this.loading = false; },
    });
  </script>
</head>
<body style="margin:0">
  <div x-data class="nb-panel">
    <div class="nb-header"><span class="material-symbols-outlined nb-icon">monitoring</span><div><h2>Benchmark Suite</h2><p class="nb-sub">System diagnostics &amp; validation</p></div></div>
    <div x-show="$store.benchmarkModal.error" class="nb-error" x-text="$store.benchmarkModal.error"></div>
    <button class="nb-btn-primary" @click="$store.benchmarkModal.run()" :disabled="$store.benchmarkModal.loading" style="margin-bottom:8px">Run All Benchmarks</button>
    <div x-show="$store.benchmarkModal.loading" class="nb-loading"><div class="loading-spinner"></div><span>Running diagnostics...</span></div>
    <div x-show="$store.benchmarkModal.results?.benchmarks" class="nb-content">
      <!-- Dependencies -->
      <template x-if="$store.benchmarkModal.results.benchmarks.dependencies">
        <div class="nb-form"><h4>Dependencies</h4>
          <template x-for="(v, name) in $store.benchmarkModal.results.benchmarks.dependencies">
            <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center">
              <div><span class="nb-entry-title" x-text="name"></span><span class="nb-entry-meta" style="margin-left:6px" x-text="v.type || ''"></span></div>
              <span style="font-size:0.6rem;font-weight:700" :style="'color:' + (v.status === 'available' ? '#22c55e' : v.status === 'not_installed' ? '#ffd93d' : '#ff6b6b')" x-text="v.status"></span>
            </div>
          </template>
        </div>
      </template>
      <!-- API Health -->
      <template x-if="$store.benchmarkModal.results.benchmarks.api_health">
        <div class="nb-form"><h4>API Health</h4>
          <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center">
            <div><span class="nb-entry-title" x-text="$store.benchmarkModal.results.benchmarks.api_health.url || 'Self-check'"></span></div>
            <span style="font-size:0.6rem;font-weight:700" :style="'color:' + ($store.benchmarkModal.results.benchmarks.api_health.passed ? '#22c55e' : '#ff6b6b')" x-text="$store.benchmarkModal.results.benchmarks.api_health.passed ? 'PASS (' + ($store.benchmarkModal.results.benchmarks.api_health.response_time_s||0) + 's)' : ($store.benchmarkModal.results.benchmarks.api_health.error || 'FAIL')"></span>
          </div>
        </div>
      </template>
      <!-- Storage -->
      <template x-if="$store.benchmarkModal.results.benchmarks.storage">
        <div class="nb-form"><h4>Storage</h4>
          <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center">
            <div><span class="nb-entry-title" x-text="($store.benchmarkModal.results.benchmarks.storage.free_gb || 0) + ' GB free / ' + ($store.benchmarkModal.results.benchmarks.storage.total_gb || 0) + ' GB'"></span></div>
            <span style="font-size:0.6rem;font-weight:700" :style="'color:' + ($store.benchmarkModal.results.benchmarks.storage.passed ? '#22c55e' : '#ff6b6b')" x-text="$store.benchmarkModal.results.benchmarks.storage.passed ? 'PASS (>500MB)' : 'LOW DISK'"></span>
          </div>
        </div>
      </template>
      <!-- RDKit -->
      <template x-if="$store.benchmarkModal.results.benchmarks.rdkit">
        <div class="nb-form"><h4>RDKit Validation</h4>
          <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center">
            <div><span class="nb-entry-title">Aspirin SMILES → MW</span><span class="nb-entry-meta" style="margin-left:6px" x-text="($store.benchmarkModal.results.benchmarks.rdkit.elapsed_s || 0) + 's, MW: ' + ($store.benchmarkModal.results.benchmarks.rdkit.mw || 'N/A')"></span></div>
            <span style="font-size:0.6rem;font-weight:700" :style="'color:' + ($store.benchmarkModal.results.benchmarks.rdkit.passed ? '#22c55e' : '#ff6b6b')" x-text="$store.benchmarkModal.results.benchmarks.rdkit.passed ? 'PASS' : 'FAIL'"></span>
          </div>
        </div>
      </template>
    </div>
    <style>
      .nb-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 14px;background:var(--color-background) }
      .nb-header { display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0 }
      .nb-icon { font-size:22px;color:var(--color-primary) }
      .nb-header h2 { color:var(--color-primary);font-size:0.9rem;margin:0;font-weight:700 }
      .nb-sub { color:var(--color-text-muted);font-size:0.58rem;margin:0 }
      .nb-content { flex:1;overflow-y:auto }
      .nb-error { padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;color:var(--color-error-text);font-size:0.6rem;margin-bottom:4px }
      .nb-loading { display:flex;align-items:center;gap:5px;font-size:0.62rem;color:var(--color-text-muted);margin-bottom:4px }
      .loading-spinner { width:12px;height:12px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .nb-form { padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:8px }
      .nb-form h4 { font-size:0.64rem;font-weight:600;color:var(--color-primary);margin:0 0 6px 0 }
      .nb-btn-primary { display:flex;align-items:center;justify-content:center;gap:3px;width:100%;padding:6px 10px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.66rem;font-weight:600 }
      .nb-btn-primary:disabled { opacity:0.5;cursor:not-allowed }
      .nb-entry-card { padding:8px 10px;background:var(--color-background);border:1px solid var(--color-border);border-radius:7px;margin-bottom:3px }
      .nb-entry-title { flex:1;font-size:0.66rem;font-weight:600;color:var(--color-text) }
      .nb-entry-meta { font-size:0.55rem;color:var(--color-text-muted) }
    </style>
  </div>
</body>
</html>
