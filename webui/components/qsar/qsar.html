<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("qsarModeler", {
      activeTab: "train", loading: false, error: "", message: "",
      task: "regression",
      uploadedContent: null, uploadedFileName: "",
      smilesCol: "smiles", activityCol: "activity",
      modelType: "RandomForest", cvFolds: 5, modelName: "", testSplit: 20,
      datasetProcessed: null,
      trainingJobId: null, trainingStatus: "", trainedModelId: null,
      featureSelection: null, featureSelectionK: 20,
      predictSmiles: "", selectedModelId: "", predictResult: null,
      savedModels: [],
      // Batch predict
      batchSmiles: "", batchModelId: "", batchResults: [], batchLoading: false,
      // Read-across
      raModelId: "", raSmiles: "", raAnalogues: [], raLoading: false,
      // Williams plot
      wpModelId: "", williamsSvg: null,
      // Feature importance
      fiModelId: "", fiData: null,

      async onOpen() { await this.loadModels(); },

      get modelTypes() {
        return this.task === "classification"
          ? ["RandomForestClassifier","SVC","LogisticRegression"]
          : ["RandomForest","GradientBoosting","SVR","PLS","Ridge","Lasso"];
      },

      handleFileUpload(e) {
        const f = e.target.files[0]; if (!f) return; this.uploadedFileName = f.name;
        const r = new FileReader(); r.onload = () => { this.uploadedContent = r.result; }; r.readAsText(f);
      },
      async processDataset() {
        if (!this.uploadedContent) { this.error = "Upload a CSV file"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("qsar", { action: "process_dataset", content: this.uploadedContent, smiles_col: this.smilesCol, activity_col: this.activityCol, groups: "all", task: this.task });
          if (r.error) { this.error = r.error; } else { this.datasetProcessed = r; this.message = `${r.n_compounds} compounds, ${r.n_features} features`; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async runFeatureSelection() {
        if (!this.datasetProcessed) { this.error = "Process dataset first"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("qsar", { action: "feature_selection", X: this.datasetProcessed.X, y: this.datasetProcessed.y, feature_names: this.datasetProcessed.feature_names, k: parseInt(this.featureSelectionK) || 20 });
          if (r.error) { this.error = r.error; } else { this.featureSelection = r.top_features; this.message = `Top ${r.n_selected} features selected`; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async startTraining() {
        if (!this.datasetProcessed) { this.error = "Process dataset first"; return; }
        this.loading = true; this.error = "";
        try {
          const payload = {
            action: "train", X: this.datasetProcessed.X, y: this.datasetProcessed.y,
            feature_names: this.datasetProcessed.feature_names, model_type: this.modelType,
            model_name: this.modelName || `QSAR_${Date.now()}`, cv_folds: this.cvFolds,
            test_split: this.testSplit / 100, task: this.task,
            _smiles: this.datasetProcessed._smiles || [],
          };
          const r = await callJsonApi("qsar", payload);
          if (r.error) { this.error = r.error; }
          else { this.trainingJobId = r.job_id; this.trainingStatus = "pending"; this.trainedModelId = null; this.pollTraining(); }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async pollTraining() {
        if (!this.trainingJobId) return;
        const r = await callJsonApi("qsar", { action: "training_status", job_id: this.trainingJobId });
        this.trainingStatus = r.status;
        if (r.status === "completed") {
          this.trainedModelId = r.model_id;
          const mt = r.result?.metrics || {};
          if (this.task === "classification")
            this.message = `Model trained — CV Acc: ${(mt.cv_accuracy||0).toFixed(3)} · F1: ${(mt.train_f1||0).toFixed(3)}`;
          else
            this.message = `Model trained — CV R²: ${(mt.cv_r2||0).toFixed(3)} · RMSE: ${(mt.cv_rmse||0).toFixed(3)}`;
          await this.loadModels();
        } else if (r.status === "failed") { this.error = r.error || "Training failed"; }
        else { setTimeout(() => this.pollTraining(), 2000); }
      },
      async loadModels() { try { this.savedModels = (await callJsonApi("qsar", { action: "models" })).models || []; } catch (e) {} },
      async runPrediction() {
        if (!this.predictSmiles || !this.selectedModelId) { this.error = "Enter SMILES and select a model"; return; }
        this.loading = true; this.error = "";
        try { this.predictResult = await callJsonApi("qsar", { action: "predict", model_id: this.selectedModelId, smiles: this.predictSmiles }); } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async runBatchPredict() {
        if (!this.batchSmiles || !this.batchModelId) { this.error = "Enter SMILES list and select a model"; return; }
        this.batchLoading = true; this.error = "";
        try {
          const r = await callJsonApi("qsar", { action: "predict_batch", model_id: this.batchModelId, smiles_list: this.batchSmiles });
          if (r.error) { this.error = r.error; } else { this.batchResults = r.predictions || []; this.message = `${r.n_predictions}/${r.total} predicted`; }
        } catch (e) { this.error = e.message; }
        this.batchLoading = false;
      },
      async runReadAcross() {
        if (!this.raSmiles || !this.raModelId) { this.error = "Enter SMILES and select a model"; return; }
        this.raLoading = true; this.error = "";
        try {
          const r = await callJsonApi("qsar", { action: "read_across", model_id: this.raModelId, smiles: this.raSmiles });
          if (r.error) { this.error = r.error; } else { this.raAnalogues = r.analogues || []; }
        } catch (e) { this.error = e.message; }
        this.raLoading = false;
      },
      async loadWilliamsPlot(id) {
        this.wpModelId = id; this.loading = true;
        try {
          const r = await callJsonApi("qsar", { action: "williams_plot", model_id: id });
          if (r.error) { this.error = r.error; } else { this.williamsSvg = r.svg; this.activeTab = "williams"; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      async loadFeatureImportance(id) {
        this.fiModelId = id;
        try {
          const r = await callJsonApi("qsar", { action: "training_status", job_id: id });
          this.fiData = null;
        } catch (e) {}
      },
      async deleteModel(id) { await callJsonApi("qsar", { action: "delete_model", model_id: id }); await this.loadModels(); },

      mDesc(m) {
        if (m.model_task === "classification")
          return `CV Acc: ${(m.metrics?.cv_accuracy||0).toFixed(3)} · F1: ${(m.metrics?.train_f1||0).toFixed(3)}`;
        return `CV R²: ${(m.metrics?.cv_r2||0).toFixed(3)} · RMSE: ${(m.metrics?.cv_rmse||0).toFixed(3)}`;
      },
      classCounts(y) {
        const c = {}; (y||[]).forEach(v => { c[v] = (c[v]||0)+1; });
        return Object.entries(c).map(([k,v]) => `${k}:${v}`).join(' ');
      },
    });
  </script>
</head>
<body>
  <div x-data class="nb-panel">
    <div class="nb-header">
      <span class="material-symbols-outlined nb-icon">model_training</span>
      <div><h2>QSAR Modeler</h2><p class="nb-sub">Train · Predict · Batch · Read-Across · Williams Plot</p></div>
    </div>

    <div class="nb-tabs">
      <button class="nb-tab" :class="{active:$store.qsarModeler.activeTab=='train'}" @click="$store.qsarModeler.activeTab='train'">Train</button>
      <button class="nb-tab" :class="{active:$store.qsarModeler.activeTab=='predict'}" @click="$store.qsarModeler.activeTab='predict'">Predict</button>
      <button class="nb-tab" :class="{active:$store.qsarModeler.activeTab=='batch'}" @click="$store.qsarModeler.activeTab='batch'">Batch</button>
      <button class="nb-tab" :class="{active:$store.qsarModeler.activeTab=='readacross'}" @click="$store.qsarModeler.activeTab='readacross'">Read-Across</button>
      <button class="nb-tab" :class="{active:$store.qsarModeler.activeTab=='models'}" @click="$store.qsarModeler.activeTab='models'">Models</button>
    </div>

    <div x-show="$store.qsarModeler.error" class="nb-error" x-text="$store.qsarModeler.error"></div>
    <div x-show="$store.qsarModeler.message" class="nb-msg" x-text="$store.qsarModeler.message"></div>
    <div x-show="$store.qsarModeler.loading" class="nb-loading"><div class="loading-spinner"></div><span>Computing...</span></div>

    <div class="nb-content">
      <!-- ====== TRAIN ====== -->
      <div x-show="$store.qsarModeler.activeTab=='train'" style="display:flex;flex-direction:column;gap:5px">
        <!-- Task Toggle -->
        <div class="nb-form-row">
          <button class="nb-tab-sm" :class="{active:$store.qsarModeler.task=='regression'}" @click="$store.qsarModeler.task='regression';$store.qsarModeler.modelType='RandomForest'">Regression</button>
          <button class="nb-tab-sm" :class="{active:$store.qsarModeler.task=='classification'}" @click="$store.qsarModeler.task='classification';$store.qsarModeler.modelType='RandomForestClassifier'">Classification</button>
        </div>

        <div class="nb-form-row">
          <label class="nb-upload-label"><span class="material-symbols-outlined">upload_file</span> CSV<input type="file" accept=".csv" hidden @change="$store.qsarModeler.handleFileUpload($event)" /></label>
          <span x-text="$store.qsarModeler.uploadedFileName || 'No file'" class="nb-upload-name"></span>
        </div>
        <div class="nb-form-row">
          <input type="text" x-model="$store.qsarModeler.smilesCol" placeholder="SMILES col" class="nb-input-sm flex-1" />
          <input type="text" x-model="$store.qsarModeler.activityCol" placeholder="Activity col" class="nb-input-sm flex-1" />
          <input type="text" x-model="$store.qsarModeler.modelName" placeholder="Model name" class="nb-input-sm flex-1" />
        </div>
        <div class="nb-form-row">
          <select x-model="$store.qsarModeler.modelType" class="nb-select" style="flex:1">
            <template x-for="mt in $store.qsarModeler.modelTypes" :key="mt"><option :value="mt" x-text="mt"></option></template>
          </select>
          <input type="number" x-model="$store.qsarModeler.cvFolds" min="2" max="10" class="nb-input-sm" style="width:55px;flex:none" title="CV folds" />
          <span style="font-size:0.55rem;color:var(--color-text-muted);white-space:nowrap">Test:</span>
          <input type="range" x-model="$store.qsarModeler.testSplit" min="0" max="50" step="5" style="width:60px" />
          <span style="font-size:0.52rem;color:var(--color-text-muted);width:28px" x-text="$store.qsarModeler.testSplit + '%'"></span>
        </div>

        <div x-show="$store.qsarModeler.datasetProcessed" class="nb-msg">
          <span x-html="(d=>`${d.n_compounds} cpds · ${d.n_features} descriptors · ${$store.qsarModeler.task}`)($store.qsarModeler.datasetProcessed)"></span>
          <span x-show="$store.qsarModeler.task=='classification'" x-text="' · classes: ' + $store.qsarModeler.classCounts($store.qsarModeler.datasetProcessed.y)" style="font-size:0.52rem"></span>
        </div>

        <button class="nb-btn-primary" @click="$store.qsarModeler.processDataset()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.uploadedContent">1. Process Dataset</button>

        <!-- Feature Selection -->
        <div class="nb-form-row" style="margin-top:4px">
          <button class="nb-btn-secondary" @click="$store.qsarModeler.runFeatureSelection()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.datasetProcessed" style="flex:1">Feature Selection</button>
          <input type="number" x-model="$store.qsarModeler.featureSelectionK" min="5" max="50" class="nb-input-sm" style="width:45px;flex:none" title="Top K" />
        </div>
        <template x-if="$store.qsarModeler.featureSelection">
          <div style="font-size:0.52rem;color:var(--color-text-muted);max-height:80px;overflow-y:auto">
            <template x-for="f in $store.qsarModeler.featureSelection.slice(0,10)">
              <span style="margin-right:6px" x-text="f.feature + ':' + f.score.toFixed(3)"></span>
            </template>
          </div>
        </template>

        <button class="nb-btn-primary" @click="$store.qsarModeler.startTraining()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.datasetProcessed" style="background:#22c55e">2. Start Training</button>
        <div x-show="$store.qsarModeler.trainingJobId" class="nb-msg"><span x-text="'Status: ' + $store.qsarModeler.trainingStatus" style="text-transform:uppercase;font-weight:600"></span></div>
      </div>

      <!-- ====== PREDICT ====== -->
      <div x-show="$store.qsarModeler.activeTab=='predict'" style="display:flex;flex-direction:column;gap:6px">
        <select x-model="$store.qsarModeler.selectedModelId" class="nb-select"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
        <input type="text" x-model="$store.qsarModeler.predictSmiles" placeholder="SMILES string" class="nb-input" style="font-family:monospace" @keyup.enter="$store.qsarModeler.runPrediction()" />
        <button class="nb-btn-primary" @click="$store.qsarModeler.runPrediction()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.predictSmiles">Predict</button>
        <div x-show="$store.qsarModeler.predictResult" class="nb-entry-card">
          <div class="nb-entry-title" x-text="$store.qsarModeler.predictResult.smiles" style="font-family:monospace;font-size:0.62rem"></div>
          <div style="font-size:0.8rem;font-weight:700;color:var(--color-primary);margin:4px 0" x-text="'Predicted: ' + ($store.qsarModeler.predictResult.predicted_activity?.toFixed(4) || 'N/A')"></div>
          <div x-show="$store.qsarModeler.predictResult.model_task == 'classification'" style="font-size:0.58rem;color:var(--color-text-muted)">
            <span x-text="'Class: ' + $store.qsarModeler.predictResult.predicted_class"></span>
            <template x-if="$store.qsarModeler.predictResult.probabilities">
              <span x-text="' · Probs: [' + $store.qsarModeler.predictResult.probabilities.join(', ') + ']'"></span>
            </template>
          </div>
          <div class="nb-entry-meta"><span x-text="'AD: ' + $store.qsarModeler.predictResult.ad_status" :style="'color:' + ($store.qsarModeler.predictResult.ad_status=='in_domain'?'#22c55e':'#ff6b6b')"></span></div>
        </div>
      </div>

      <!-- ====== BATCH PREDICT ====== -->
      <div x-show="$store.qsarModeler.activeTab=='batch'" style="display:flex;flex-direction:column;gap:6px">
        <select x-model="$store.qsarModeler.batchModelId" class="nb-select"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
        <textarea x-model="$store.qsarModeler.batchSmiles" placeholder="SMILES (one per line)..." class="nb-textarea" style="font-family:monospace;min-height:80px"></textarea>
        <button class="nb-btn-primary" @click="$store.qsarModeler.runBatchPredict()" :disabled="$store.qsarModeler.batchLoading || !$store.qsarModeler.batchSmiles">Batch Predict</button>
        <div x-show="$store.qsarModeler.batchLoading" class="nb-loading"><div class="loading-spinner"></div><span>Screening...</span></div>
        <template x-if="$store.qsarModeler.batchResults.length">
          <div style="margin-top:4px">
            <div class="nb-entry-meta" x-text="$store.qsarModeler.batchResults.length + ' predictions'"></div>
            <div style="max-height:300px;overflow-y:auto">
              <template x-for="p in $store.qsarModeler.batchResults">
                <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center;padding:3px 6px;font-size:0.55rem">
                  <span style="font-family:monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="p.smiles"></span>
                  <span style="font-weight:700;color:var(--color-primary);margin:0 8px" x-text="p.predicted.toFixed(4)"></span>
                  <span x-show="p.ad_status" style="font-size:0.48rem" :style="'color:' + (p.ad_status=='in_domain'?'#22c55e':'#ffd93d')" x-text="p.ad_status"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- ====== READ-ACROSS ====== -->
      <div x-show="$store.qsarModeler.activeTab=='readacross'" style="display:flex;flex-direction:column;gap:6px">
        <select x-model="$store.qsarModeler.raModelId" class="nb-select"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
        <input type="text" x-model="$store.qsarModeler.raSmiles" placeholder="Query SMILES" class="nb-input" style="font-family:monospace" @keyup.enter="$store.qsarModeler.runReadAcross()" />
        <button class="nb-btn-primary" @click="$store.qsarModeler.runReadAcross()" :disabled="$store.qsarModeler.raLoading || !$store.qsarModeler.raSmiles">Find Analogues</button>
        <template x-if="$store.qsarModeler.raAnalogues.length">
          <div style="margin-top:4px">
            <div class="nb-entry-meta" x-text="$store.qsarModeler.raAnalogues.length + ' analogues (ECFP4 Tanimoto ≥ 0.3)'"></div>
            <template x-for="a in $store.qsarModeler.raAnalogues">
              <div class="nb-entry-card" style="display:flex;justify-content:space-between;align-items:center;font-size:0.52rem">
                <span style="font-family:monospace;flex:1" x-text="a.smiles.substring(0,35)"></span>
                <span style="color:var(--color-primary);font-weight:600;width:55px;text-align:center" x-text="(a.activity||0).toFixed(2)"></span>
                <span style="color:var(--color-text-muted);width:45px;text-align:right" x-text="Math.round(a.similarity*100)+'%'"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- ====== MODELS ====== -->
      <div x-show="$store.qsarModeler.activeTab=='models'">
        <template x-if="!$store.qsarModeler.savedModels.length">
          <div class="nb-empty"><span class="material-symbols-outlined nb-empty-icon">inventory_2</span><p>No models trained</p></div>
        </template>
        <template x-for="m in $store.qsarModeler.savedModels">
          <div class="nb-entry-card" style="display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <div class="nb-entry-title" x-text="m.name"></div>
                <div class="nb-entry-meta" x-text="m.model_type + ' · ' + $store.qsarModeler.mDesc(m) + ' · ' + m.n_features + ' features'"></div>
                <div class="nb-entry-meta">
                  <span x-show="m.model_task=='classification'" style="background:var(--color-primary);color:white;padding:0 4px;border-radius:2px;font-size:0.42rem">CLASS</span>
                  <span x-show="m.model_task!='classification'" style="background:#22c55e;color:white;padding:0 4px;border-radius:2px;font-size:0.42rem">REG</span>
                  <span x-text="' · test_split: ' + (m.metrics?.test_n ? (m.metrics.test_n + ' compounds') : 'none')" style="color:var(--color-text-muted)"></span>
                </div>
              </div>
              <button class="nb-del-btn" @click="$store.qsarModeler.deleteModel(m.model_id)">Delete</button>
            </div>
            <!-- Test metrics -->
            <div x-show="m.metrics?.test_r2 != null || m.metrics?.test_accuracy != null" style="font-size:0.5rem;color:#22c55e">
              <span x-show="m.metrics.test_r2 != null" x-text="'Ext. Test R²: ' + m.metrics.test_r2.toFixed(3) + ' · RMSE: ' + (m.metrics.test_rmse||0).toFixed(3)"></span>
              <span x-show="m.metrics.test_accuracy != null" x-text="'Ext. Test Acc: ' + (m.metrics.test_accuracy||0).toFixed(3) + ' · F1: ' + (m.metrics.test_f1||0).toFixed(3)"></span>
            </div>
            <!-- Feature Importance mini -->
            <div x-show="$store.qsarModeler.fiModelId == m.model_id && $store.qsarModeler.fiData" style="font-size:0.48rem;color:var(--color-text-muted);max-height:60px;overflow-y:auto">
              <template x-for="(v,k) in Object.entries($store.qsarModeler.fiData).slice(0,8)">
                <span style="margin-right:4px" x-text="k+':'+v"></span>
              </template>
            </div>
            <div style="display:flex;gap:3px;margin-top:2px">
              <button class="nb-btn-sm" @click="$store.qsarModeler.loadWilliamsPlot(m.model_id)">Williams Plot</button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Williams Plot (shown in a modal-like overlay) -->
    <div x-show="$store.qsarModeler.activeTab=='williams'" style="position:absolute;top:0;left:0;right:0;bottom:0;background:var(--color-background);z-index:10;display:flex;flex-direction:column;padding:10px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:0.7rem">Williams Plot — Applicability Domain</span>
        <button @click="$store.qsarModeler.activeTab='models'" style="background:none;border:1px solid var(--color-border);border-radius:4px;color:var(--color-text-muted);cursor:pointer;font-size:0.6rem;padding:2px 8px">← Back</button>
      </div>
      <div x-show="$store.qsarModeler.williamsSvg" style="flex:1;overflow:auto;display:flex;justify-content:center" x-html="$store.qsarModeler.williamsSvg"></div>
      <div x-show="!$store.qsarModeler.williamsSvg" class="nb-empty"><p>Click "Williams Plot" on a model that has training data cached</p></div>
    </div>

    <style>
      .nb-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 14px;background:var(--color-background);position:relative }
      .nb-header { display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0 }
      .nb-icon { font-size:22px;color:var(--color-primary) }
      .nb-header h2 { color:var(--color-primary);font-size:0.9rem;margin:0;font-weight:700 }
      .nb-sub { color:var(--color-text-muted);font-size:0.52rem;margin:0 }
      .nb-tabs { display:flex;gap:1px;margin-bottom:6px;flex-shrink:0;border-bottom:1px solid var(--color-border);padding-bottom:4px }
      .nb-tab { padding:5px 10px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--color-text-muted);cursor:pointer;font-size:0.62rem;font-weight:500;transition:all 0.15s }
      .nb-tab:hover { color:var(--color-text) }
      .nb-tab.active { color:var(--color-primary);border-bottom-color:var(--color-primary) }
      .nb-content { flex:1;overflow-y:auto }
      .nb-error { padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;color:#ff6b6b;font-size:0.6rem;margin-bottom:4px;flex-shrink:0 }
      .nb-msg { padding:4px 8px;background:rgba(0,212,170,0.08);border-radius:4px;color:var(--color-primary);font-size:0.6rem;margin-bottom:4px;flex-shrink:0 }
