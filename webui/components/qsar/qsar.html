<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("qsarModeler", {
      activeTab: "train", loading: false, error: "", message: "",
      task: "regression",
      uploadedContent: null, uploadedFileName: "", smilesCol: "smiles", activityCol: "activity",
      modelType: "RandomForest", cvFolds: 5, modelName: "", testSplit: 20,
      datasetProcessed: null, trainingJobId: null, trainingStatus: "", trainedModelId: null,
      featureSelection: null, featureSelectionK: 20,
      predictSmiles: "", selectedModelId: "", predictResult: null, savedModels: [],
      batchSmiles: "", batchModelId: "", batchResults: [], batchLoading: false,
      raModelId: "", raSmiles: "", raAnalogues: [], raLoading: false,
      wpModelId: "", williamsSvg: null, fiModelId: "", fiData: null,

      async onOpen() { await this.loadModels(); },
      get modelTypes() { return this.task === "classification" ? ["RandomForestClassifier","SVC","LogisticRegression"] : ["RandomForest","GradientBoosting","SVR","PLS","Ridge","Lasso"]; },
      handleFileUpload(e) { const f = e.target.files[0]; if (!f) return; this.uploadedFileName = f.name; const r = new FileReader(); r.onload = () => { this.uploadedContent = r.result; }; r.readAsText(f); },
      async processDataset() { if (!this.uploadedContent) { this.error = "Upload a CSV file"; return; } this.loading = true; this.error = ""; try { const r = await callJsonApi("qsar", { action: "process_dataset", content: this.uploadedContent, smiles_col: this.smilesCol, activity_col: this.activityCol, groups: "all", task: this.task }); if (r.error) { this.error = r.error; } else { this.datasetProcessed = r; this.message = `${r.n_compounds} compounds, ${r.n_features} features`; } } catch (e) { this.error = e.message; } this.loading = false; },
      async runFeatureSelection() { if (!this.datasetProcessed) { this.error = "Process dataset first"; return; } this.loading = true; this.error = ""; try { const r = await callJsonApi("qsar", { action: "feature_selection", X: this.datasetProcessed.X, y: this.datasetProcessed.y, feature_names: this.datasetProcessed.feature_names, k: parseInt(this.featureSelectionK) || 20 }); if (r.error) { this.error = r.error; } else { this.featureSelection = r.top_features; this.message = `Top ${r.n_selected} features selected`; } } catch (e) { this.error = e.message; } this.loading = false; },
      async startTraining() { if (!this.datasetProcessed) { this.error = "Process dataset first"; return; } this.loading = true; this.error = ""; try { const r = await callJsonApi("qsar", { action: "train", X: this.datasetProcessed.X, y: this.datasetProcessed.y, feature_names: this.datasetProcessed.feature_names, model_type: this.modelType, model_name: this.modelName || `QSAR_${Date.now()}`, cv_folds: this.cvFolds, test_split: this.testSplit / 100, task: this.task, _smiles: this.datasetProcessed._smiles || [] }); if (r.error) { this.error = r.error; } else { this.trainingJobId = r.job_id; this.trainingStatus = "pending"; this.trainedModelId = null; this.pollTraining(); } } catch (e) { this.error = e.message; } this.loading = false; },
      async pollTraining() { if (!this.trainingJobId) return; const r = await callJsonApi("qsar", { action: "training_status", job_id: this.trainingJobId }); this.trainingStatus = r.status; if (r.status === "completed") { this.trainedModelId = r.model_id; const mt = r.result?.metrics || {}; this.message = this.task === "classification" ? `CV Acc: ${(mt.cv_accuracy||0).toFixed(3)} · F1: ${(mt.train_f1||0).toFixed(3)}` : `CV R²: ${(mt.cv_r2||0).toFixed(3)} · RMSE: ${(mt.cv_rmse||0).toFixed(3)}`; await this.loadModels(); } else if (r.status === "failed") { this.error = r.error || "Training failed"; } else { setTimeout(() => this.pollTraining(), 2000); } },
      async loadModels() { try { this.savedModels = (await callJsonApi("qsar", { action: "models" })).models || []; } catch (e) {} },
      async runPrediction() { if (!this.predictSmiles || !this.selectedModelId) { this.error = "Enter SMILES and select a model"; return; } this.loading = true; this.error = ""; try { this.predictResult = await callJsonApi("qsar", { action: "predict", model_id: this.selectedModelId, smiles: this.predictSmiles }); } catch (e) { this.error = e.message; } this.loading = false; },
      async runBatchPredict() { if (!this.batchSmiles || !this.batchModelId) { this.error = "Enter SMILES and select a model"; return; } this.batchLoading = true; this.error = ""; try { const r = await callJsonApi("qsar", { action: "predict_batch", model_id: this.batchModelId, smiles_list: this.batchSmiles }); if (r.error) { this.error = r.error; } else { this.batchResults = r.predictions || []; this.message = `${r.n_predictions}/${r.total} predicted`; } } catch (e) { this.error = e.message; } this.batchLoading = false; },
      async runReadAcross() { if (!this.raSmiles || !this.raModelId) { this.error = "Enter SMILES and select a model"; return; } this.raLoading = true; this.error = ""; try { const r = await callJsonApi("qsar", { action: "read_across", model_id: this.raModelId, smiles: this.raSmiles }); if (r.error) { this.error = r.error; } else { this.raAnalogues = r.analogues || []; } } catch (e) { this.error = e.message; } this.raLoading = false; },
      async loadWilliamsPlot(id) { this.wpModelId = id; this.loading = true; try { const r = await callJsonApi("qsar", { action: "williams_plot", model_id: id }); if (r.error) { this.error = r.error; } else { this.williamsSvg = r.svg; this.activeTab = "williams"; } } catch (e) { this.error = e.message; } this.loading = false; },
      async deleteModel(id) { await callJsonApi("qsar", { action: "delete_model", model_id: id }); await this.loadModels(); },
      mDesc(m) { if (m.model_task === "classification") return `Acc:${(m.metrics?.cv_accuracy||0).toFixed(3)} F1:${(m.metrics?.train_f1||0).toFixed(3)}`; return `R²:${(m.metrics?.cv_r2||0).toFixed(3)} RMSE:${(m.metrics?.cv_rmse||0).toFixed(3)}`; },
      classCounts(y) { const c = {}; (y||[]).forEach(v => { c[v] = (c[v]||0)+1; }); return Object.entries(c).map(([k,v]) => `${k}:${v}`).join(' '); },
    });
  </script>
</head>
<body style="margin:0">
  <div x-data class="qs-panel">
    <div class="qs-header">
      <span class="material-symbols-outlined qs-icon">model_training</span>
      <div><h2>QSAR Modeler</h2><p class="qs-sub">Train · Predict · Batch · Read-Across</p></div>
    </div>

    <div x-show="$store.qsarModeler.error" class="nb-error" x-text="$store.qsarModeler.error" @click="$store.qsarModeler.error=''"></div>
    <div x-show="$store.qsarModeler.message" class="nb-msg" x-text="$store.qsarModeler.message" @click="$store.qsarModeler.message=''"></div>
    <div x-show="$store.qsarModeler.loading" class="nb-loading"><div class="loading-spinner"></div><span>Working...</span></div>

    <div class="qs-tabs">
      <button class="qs-tab" :class="{active:$store.qsarModeler.activeTab=='train'}" @click="$store.qsarModeler.activeTab='train'"><span class="material-symbols-outlined">build</span> Train</button>
      <button class="qs-tab" :class="{active:$store.qsarModeler.activeTab=='predict'}" @click="$store.qsarModeler.activeTab='predict'"><span class="material-symbols-outlined">psychology</span> Predict</button>
      <button class="qs-tab" :class="{active:$store.qsarModeler.activeTab=='batch'}" @click="$store.qsarModeler.activeTab='batch'"><span class="material-symbols-outlined">view_list</span> Batch</button>
      <button class="qs-tab" :class="{active:$store.qsarModeler.activeTab=='readacross'}" @click="$store.qsarModeler.activeTab='readacross'"><span class="material-symbols-outlined">hub</span> Read-Across</button>
      <button class="qs-tab" :class="{active:$store.qsarModeler.activeTab=='models'}" @click="$store.qsarModeler.activeTab='models'"><span class="material-symbols-outlined">inventory_2</span> Models</button>
    </div>

    <div class="qs-body">
      <!-- TRAIN -->
      <div x-show="$store.qsarModeler.activeTab=='train'" class="qs-grid">
        <div class="qs-left">
          <div class="nb-box"><h4><span class="material-symbols-outlined">build</span> Train Model</h4>
            <div style="display:flex;gap:4px;margin-bottom:6px">
              <button class="nb-chip-btn" :class="{active:$store.qsarModeler.task=='regression'}" @click="$store.qsarModeler.task='regression';$store.qsarModeler.modelType='RandomForest'">Regression</button>
              <button class="nb-chip-btn" :class="{active:$store.qsarModeler.task=='classification'}" @click="$store.qsarModeler.task='classification';$store.qsarModeler.modelType='RandomForestClassifier'">Classification</button>
            </div>
            <div style="display:flex;gap:3px;margin-bottom:4px">
              <label class="nb-upload-label" style="flex:1"><span class="material-symbols-outlined" style="font-size:14px">upload_file</span> CSV<input type="file" accept=".csv" hidden @change="$store.qsarModeler.handleFileUpload($event)" /></label>
              <span class="nb-meta" style="align-self:center;flex:1" x-text="$store.qsarModeler.uploadedFileName || 'No file'"></span>
            </div>
            <div style="display:flex;gap:3px;margin-bottom:4px">
              <input type="text" x-model="$store.qsarModeler.smilesCol" placeholder="SMILES col" class="nb-input-sm" style="flex:1" />
              <input type="text" x-model="$store.qsarModeler.activityCol" placeholder="Activity col" class="nb-input-sm" style="flex:1" />
              <input type="text" x-model="$store.qsarModeler.modelName" placeholder="Name" class="nb-input-sm" style="flex:1" />
            </div>
            <div style="display:flex;gap:3px;align-items:center;margin-bottom:4px">
              <select x-model="$store.qsarModeler.modelType" class="nb-input-sm" style="flex:1"><template x-for="mt in $store.qsarModeler.modelTypes"><option :value="mt" x-text="mt"></option></template></select>
              <span style="font-size:0.52rem;color:var(--color-text-muted);white-space:nowrap">CV:</span>
              <input type="number" x-model="$store.qsarModeler.cvFolds" min="2" max="10" class="nb-input-sm" style="width:40px;flex:none" />
              <span style="font-size:0.52rem;color:var(--color-text-muted);white-space:nowrap">Test:</span>
              <input type="range" x-model="$store.qsarModeler.testSplit" min="0" max="50" step="5" style="width:55px;flex:none" />
              <span class="nb-meta" style="width:24px" x-text="$store.qsarModeler.testSplit + '%'"></span>
            </div>
            <div x-show="$store.qsarModeler.datasetProcessed" class="nb-msg"><span x-text="$store.qsarModeler.datasetProcessed.n_compounds + ' cpds · ' + $store.qsarModeler.datasetProcessed.n_features + ' descriptors'"></span></div>
            <button class="nb-btn-primary" @click="$store.qsarModeler.processDataset()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.uploadedContent">1. Process Dataset</button>
            <div style="display:flex;gap:4px;margin-top:4px">
              <button class="nb-btn-secondary" @click="$store.qsarModeler.runFeatureSelection()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.datasetProcessed" style="flex:1">Feature Select</button>
              <input type="number" x-model="$store.qsarModeler.featureSelectionK" min="5" max="50" class="nb-input-sm" style="width:40px;flex:none" />
            </div>
            <button class="nb-btn-primary" @click="$store.qsarModeler.startTraining()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.datasetProcessed" style="background:#22c55e;margin-top:4px">2. Start Training</button>
            <div x-show="$store.qsarModeler.trainingJobId" class="nb-msg" style="margin-top:4px"><span style="text-transform:uppercase;font-weight:600" x-text="'Status: ' + $store.qsarModeler.trainingStatus"></span></div>
          </div>
        </div>
        <div class="qs-right">
          <template x-if="$store.qsarModeler.featureSelection">
            <div class="nb-box"><h4>Top Features</h4>
              <div style="display:flex;gap:3px;flex-wrap:wrap">
                <template x-for="f in $store.qsarModeler.featureSelection.slice(0,12)"><span class="qs-chip" x-text="f.feature + ':' + f.score.toFixed(3)"></span></template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- PREDICT -->
      <div x-show="$store.qsarModeler.activeTab=='predict'" class="qs-grid">
        <div class="qs-left">
          <div class="nb-box"><h4><span class="material-symbols-outlined">psychology</span> Single Prediction</h4>
            <select x-model="$store.qsarModeler.selectedModelId" class="nb-input" style="margin-bottom:4px"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
            <input type="text" x-model="$store.qsarModeler.predictSmiles" placeholder="SMILES string" class="nb-input" style="font-family:monospace;margin-bottom:4px" @keyup.enter="$store.qsarModeler.runPrediction()" />
            <button class="nb-btn-primary" @click="$store.qsarModeler.runPrediction()" :disabled="$store.qsarModeler.loading || !$store.qsarModeler.predictSmiles">Predict</button>
          </div>
        </div>
        <div class="qs-right">
          <template x-if="$store.qsarModeler.predictResult">
            <div class="nb-box"><h4>Prediction</h4>
              <div class="nb-meta" x-text="$store.qsarModeler.predictResult.smiles" style="font-family:monospace"></div>
              <div style="font-size:0.9rem;font-weight:700;color:var(--color-primary);margin:4px 0" x-text="'Predicted: ' + ($store.qsarModeler.predictResult.predicted_activity?.toFixed(4)||'N/A')"></div>
              <span class="qs-chip" :class="$store.qsarModeler.predictResult.ad_status=='in_domain'?'qs-chip-green':'qs-chip-red'" x-text="'AD: ' + $store.qsarModeler.predictResult.ad_status"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- BATCH -->
      <div x-show="$store.qsarModeler.activeTab=='batch'" class="qs-grid">
        <div class="qs-left">
          <div class="nb-box"><h4><span class="material-symbols-outlined">view_list</span> Batch Prediction</h4>
            <select x-model="$store.qsarModeler.batchModelId" class="nb-input" style="margin-bottom:4px"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
            <textarea x-model="$store.qsarModeler.batchSmiles" placeholder="SMILES (one per line)..." class="nb-textarea" style="min-height:80px;font-family:monospace"></textarea>
            <button class="nb-btn-primary" @click="$store.qsarModeler.runBatchPredict()" :disabled="$store.qsarModeler.batchLoading || !$store.qsarModeler.batchSmiles" style="margin-top:4px">Batch Predict</button>
          </div>
        </div>
        <div class="qs-right">
          <template x-if="$store.qsarModeler.batchResults.length">
            <div class="nb-box"><h4 x-text="$store.qsarModeler.batchResults.length + ' Predictions'"></h4>
              <template x-for="p in $store.qsarModeler.batchResults">
                <div class="qs-row"><span class="qs-row-smi" x-text="p.smiles"></span><span class="qs-row-val" x-text="p.predicted.toFixed(4)"></span><span class="qs-chip" :class="p.ad_status=='in_domain'?'qs-chip-green':'qs-chip-yellow'" x-text="p.ad_status||''" x-show="p.ad_status"></span></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- READ-ACROSS -->
      <div x-show="$store.qsarModeler.activeTab=='readacross'" class="qs-grid">
        <div class="qs-left">
          <div class="nb-box"><h4><span class="material-symbols-outlined">hub</span> Read-Across</h4>
            <select x-model="$store.qsarModeler.raModelId" class="nb-input" style="margin-bottom:4px"><option value="">-- Select Model --</option><template x-for="m in $store.qsarModeler.savedModels"><option :value="m.model_id" x-text="m.name + ' (' + m.model_type + ')'"></option></template></select>
            <input type="text" x-model="$store.qsarModeler.raSmiles" placeholder="Query SMILES" class="nb-input" style="font-family:monospace;margin-bottom:4px" @keyup.enter="$store.qsarModeler.runReadAcross()" />
            <button class="nb-btn-primary" @click="$store.qsarModeler.runReadAcross()" :disabled="$store.qsarModeler.raLoading || !$store.qsarModeler.raSmiles">Find Analogues</button>
          </div>
        </div>
        <div class="qs-right">
          <template x-if="$store.qsarModeler.raAnalogues.length">
            <div class="nb-box"><h4 x-text="$store.qsarModeler.raAnalogues.length + ' Analogues (ECFP4)'"></h4>
              <template x-for="a in $store.qsarModeler.raAnalogues">
                <div class="qs-row"><span class="qs-row-smi" x-text="a.smiles"></span><span class="qs-row-val" x-text="(a.activity||0).toFixed(3)"></span><span class="nb-meta" x-text="Math.round(a.similarity*100)+'%'"></span></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- MODELS -->
      <div x-show="$store.qsarModeler.activeTab=='models'">
        <template x-if="!$store.qsarModeler.savedModels.length">
          <div class="nb-empty"><span class="material-symbols-outlined" style="font-size:32px;opacity:0.2">inventory_2</span><p style="font-size:0.64rem;color:var(--color-text-muted)">No models trained yet</p></div>
        </template>
        <template x-for="m in $store.qsarModeler.savedModels">
          <div class="nb-box" style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <h4 x-text="m.name"></h4>
              <div class="nb-meta" x-text="m.model_type + ' · ' + $store.qsarModeler.mDesc(m) + ' · ' + m.n_features + ' feats'"></div>
              <div class="nb-meta">
                <span class="qs-chip" :class="m.model_task=='classification'?'qs-chip-green':'qs-chip-blue'" x-text="m.model_task=='classification'?'CLASS':'REG'"></span>
                <span x-text="' · test: ' + (m.metrics?.test_n ? m.metrics.test_n+' cpds' : 'none')"></span>
              </div>
              <div x-show="m.metrics?.test_accuracy != null" class="nb-meta" style="color:#22c55e" x-text="'Ext: Acc='+(m.metrics.test_accuracy||0).toFixed(3)+' F1='+(m.metrics.test_f1||0).toFixed(3)"></div>
              <button class="nb-btn-secondary" @click="$store.qsarModeler.loadWilliamsPlot(m.model_id)" style="margin-top:3px">Williams Plot</button>
            </div>
            <button class="qs-del" @click="$store.qsarModeler.deleteModel(m.model_id)"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button>
          </div>
        </template>
      </div>
    </div>

    <!-- Williams Plot overlay -->
    <div x-show="$store.qsarModeler.activeTab=='williams'" style="position:absolute;top:0;left:0;right:0;bottom:0;background:var(--color-background);z-index:10;display:flex;flex-direction:column;padding:10px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:0.7rem">Williams Plot</span>
        <button @click="$store.qsarModeler.activeTab='models'" style="background:none;border:1px solid var(--color-border);border-radius:4px;color:var(--color-text-muted);cursor:pointer;font-size:0.6rem;padding:2px 8px">← Back</button>
      </div>
      <div x-show="$store.qsarModeler.williamsSvg" style="flex:1;overflow:auto;display:flex;justify-content:center" x-html="$store.qsarModeler.williamsSvg"></div>
    </div>

    <style>
      .qs-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 14px;background:var(--color-background);position:relative }
      .qs-header { display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-shrink:0 }
      .qs-icon { font-size:24px;color:var(--color-primary) }
      .qs-header h2 { color:var(--color-primary);font-size:0.95rem;margin:0;font-weight:700 }
      .qs-sub { color:var(--color-text-muted);font-size:0.54rem;margin:0 }
      .qs-tabs { display:flex;gap:1px;margin-bottom:8px;flex-shrink:0;border-bottom:1px solid var(--color-border);padding-bottom:4px }
      .qs-tab { display:flex;align-items:center;gap:3px;padding:5px 10px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--color-text-muted);cursor:pointer;font-size:0.62rem;font-weight:500 }
      .qs-tab:hover { color:var(--color-text) }
      .qs-tab.active { color:var(--color-primary);border-bottom-color:var(--color-primary) }
      .qs-tab .material-symbols-outlined { font-size:14px }
      .qs-body { flex:1;overflow-y:auto }
      .qs-grid { display:grid;grid-template-columns:300px 1fr;gap:10px;min-height:0 }
      .qs-left { display:flex;flex-direction:column;gap:6px }
      .qs-right { display:flex;flex-direction:column;gap:6px }
      .qs-chip { display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:0.48rem;font-weight:600;background:var(--color-panel);border:1px solid var(--color-border);color:var(--color-text-muted) }
      .qs-chip-green { background:rgba(34,197,94,0.12);color:#22c55e;border-color:rgba(34,197,94,0.25) }
      .qs-chip-red { background:rgba(239,68,68,0.1);color:#ef4444;border-color:rgba(239,68,68,0.2) }
      .qs-chip-yellow { background:rgba(234,179,8,0.1);color:#ca8a04;border-color:rgba(234,179,8,0.2) }
      .qs-chip-blue { background:rgba(59,130,246,0.1);color:#3b82f6;border-color:rgba(59,130,246,0.2) }
      .qs-row { display:flex;align-items:center;gap:6px;padding:3px 6px;background:var(--color-background);border:1px solid var(--color-border);border-radius:4px;margin-bottom:2px }
      .qs-row-smi { font-family:monospace;font-size:0.54rem;color:var(--color-text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
      .qs-row-val { font-weight:700;color:var(--color-primary);font-size:0.56rem;min-width:50px;text-align:center }
      .qs-del { padding:2px;background:transparent;border:none;color:var(--color-text-muted);cursor:pointer }
      .qs-del:hover { color:#ef4444 }
      @media (max-width:650px) { .qs-grid { grid-template-columns:1fr } }

      .nb-box { padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:6px }
      .nb-box h4 { font-size:0.64rem;font-weight:600;color:var(--color-primary);margin:0 0 6px;display:flex;align-items:center;gap:4px }
      .nb-box h4 .material-symbols-outlined { font-size:16px }
      .nb-input { width:100%;padding:6px 10px;margin-bottom:4px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-background);color:var(--color-text);font-size:0.66rem;box-sizing:border-box }
      .nb-input:focus { outline:none;border-color:var(--color-primary) }
      .nb-input::placeholder { color:var(--color-text-muted);font-size:0.58rem }
      .nb-input-sm { padding:5px 8px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.62rem;box-sizing:border-box }
      .nb-input-sm:focus { outline:none;border-color:var(--color-primary) }
