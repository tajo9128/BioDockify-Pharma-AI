<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";
    export const store = createStore("molOptimizer", {
      smiles: "", strategy: "bioisostere_carboxyl_tetrazole", strategies: [], mutants: [], loading: false, error: "",
      async onOpen() { try { this.strategies = ((await callJsonApi("mol_optimizer", { action: "strategies" })).strategies || []); } catch (e) {} },
      async mutate() {
        if (!this.smiles) { this.error = "Enter a SMILES string"; return; }
        this.loading = true; this.error = "";
        try { const r = await callJsonApi("mol_optimizer", { action: "mutate", smiles: this.smiles, strategy: this.strategy }); if (!r.success) { this.error = r.error; } else { this.mutants = r.mutants; } } catch (e) { this.error = e.message; }
        this.loading = false;
      },
      sendToDocking(smiles) { const t = document.querySelector("#chat-input"); if (t) { t.focus(); t.value = "Dock this molecule: " + smiles; t.dispatchEvent(new Event("input", { bubbles: true })); } },
    });
  </script>
</head>
<body>
  <div x-data class="nb-panel">
    <div class="nb-header"><span class="material-symbols-outlined nb-icon">auto_fix_high</span><div><h2>Molecular Optimizer</h2><p class="nb-sub">AI-driven lead optimization</p></div></div>
    <div x-show="$store.molOptimizer.error" class="nb-error" x-text="$store.molOptimizer.error"></div>
    <div class="nb-content">
      <div class="nb-form"><h4>Source Molecule</h4>
        <input type="text" x-model="$store.molOptimizer.smiles" placeholder="SMILES string" class="nb-input" style="font-family:monospace;margin-bottom:4px" />
        <select x-model="$store.molOptimizer.strategy" class="nb-select" style="width:100%;margin-bottom:4px"><template x-for="s in $store.molOptimizer.strategies"><option :value="s.id" x-text="s.desc"></option></template></select>
        <button class="nb-btn-primary" @click="$store.molOptimizer.mutate()" :disabled="$store.molOptimizer.loading || !$store.molOptimizer.smiles">Generate Mutants</button>
      </div>
      <div x-show="$store.molOptimizer.loading" class="nb-loading"><div class="loading-spinner"></div><span>Optimizing...</span></div>
      <template x-if="$store.molOptimizer.mutants.length">
        <div><div class="nb-entry-meta" style="margin-bottom:4px" x-text="$store.molOptimizer.mutants.length + ' mutant(s)'"></div>
          <template x-for="m in $store.molOptimizer.mutants">
            <div class="nb-entry-card">
              <div class="nb-entry-header"><span class="nb-entry-title" style="font-family:monospace;word-break:break-all" x-text="m.smiles"></span></div>
              <div class="nb-entry-meta" style="gap:8px"><span x-text="'MW: ' + m.mw"></span><span x-text="'LogP: ' + m.logp"></span><span x-text="'HBD: ' + m.hbd"></span><span x-text="'HBA: ' + m.hba"></span></div>
              <button @click="$store.molOptimizer.sendToDocking(m.smiles)" class="nb-btn-primary" style="margin-top:4px;background:#22c55e">Dock This</button>
            </div>
          </template>
        </div>
      </template>
    </div>
    <style>
      .nb-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 14px;background:var(--color-background) }
      .nb-header { display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0 }
      .nb-icon { font-size:22px;color:var(--color-primary) }
      .nb-header h2 { color:var(--color-primary);font-size:0.9rem;margin:0;font-weight:700 }
      .nb-sub { color:var(--color-text-muted);font-size:0.58rem;margin:0 }
      .nb-content { flex:1;overflow-y:auto;min-width:0;min-height:0 }
      .nb-error { padding:4px 8px;background:rgba(255,107,107,0.1);border-radius:4px;color:var(--color-error-text);font-size:0.6rem;margin-bottom:4px }
      .nb-loading { display:flex;align-items:center;gap:5px;font-size:0.62rem;color:var(--color-text-muted);margin-bottom:4px }
      .loading-spinner { width:12px;height:12px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .nb-form { padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:8px }
      .nb-form h4 { font-size:0.64rem;font-weight:600;color:var(--color-primary);margin:0 0 6px 0 }
      .nb-input { width:100%;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-background);color:var(--color-text);font-size:0.68rem;box-sizing:border-box }
      .nb-input:focus { outline:none;border-color:var(--color-primary) }
      .nb-input::placeholder { color:var(--color-text-muted);font-size:0.62rem }
      .nb-select { width:100%;padding:5px 8px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.62rem;box-sizing:border-box }
      .nb-btn-primary { display:flex;align-items:center;justify-content:center;gap:3px;width:100%;padding:6px 10px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.66rem;font-weight:600;box-sizing:border-box }
      .nb-btn-primary:disabled { opacity:0.5;cursor:not-allowed }
      .nb-entry-card { padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:7px;margin-bottom:4px }
      .nb-entry-header { display:flex;align-items:center;gap:6px }
      .nb-entry-title { flex:1;font-size:0.66rem;font-weight:600;color:var(--color-text) }
      .nb-entry-meta { display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:0.55rem;color:var(--color-text-muted) }
    </style>
  </div>
</body>
</html>
