<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("rnaTherapy", {
      activeTab: "sirna",
      loading: false,
      error: "",
      message: "",

      // siRNA
      mrna: "",
      sirnaResult: null,
      otGuide: "",
      otTranscripts: "",
      otResult: null,

      // codon
      protein: "MKTAYIAKQRQISFVKSHFSRQ",
      host: "human",
      codonResult: null,

      // folding
      foldSeq: "",
      foldResult: null,

      // mrna props
      mrnaSeq: "",
      mrnaResult: null,

      // crispr
      crisprDna: "",
      nuclease: "spcas9",
      crisprResult: null,

      flash(msg) { this.message = msg; setTimeout(() => this.message = "", 2500); },

      async designSirna() {
        if (!this.mrna.trim()) { this.error = "Paste a target mRNA sequence"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "sirna_design", mrna: this.mrna.trim(), top: 10 });
          if (r.error) { this.error = r.error; return; }
          this.sirnaResult = r;
          this.flash(`${r.passing} of ${r.total_candidates} candidates pass filters`);
        } finally { this.loading = false; }
      },

      async sirnaOfftarget(row) {
        this.otGuide = row.guide_19;
        const transcripts = {};
        transcripts["target_mRNA"] = this.mrna.trim();
        if (this.otTranscripts.trim()) {
          for (const line of this.otTranscripts.split("\n")) {
            const [name, ...rest] = line.split(/\s+/, 2);
            if (name && rest.length) transcripts[name] = rest.join("");
          }
        }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "sirna_offtarget", guide: row.guide_19, transcripts });
          this.otResult = r.error ? null : r;
          if (r.error) this.error = r.error;
          else this.flash(`${r.num_offtargets} off-targets (≤3 mismatches)`);
        } finally { this.loading = false; }
      },

      async optimizeCodon() {
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "codon_optimize", protein: this.protein.replace(/\s+/g, ""), host: this.host });
          if (r.error) { this.error = r.error; return; }
          this.codonResult = r;
          this.flash(`CAI ${r.cai} · GC ${r.gc_percent}% · translation verified`);
        } finally { this.loading = false; }
      },

      async fold() {
        if (!this.foldSeq.trim()) { this.error = "Paste an RNA sequence"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "fold", sequence: this.foldSeq.trim() });
          if (r.error) { this.error = r.error; return; }
          this.foldResult = r;
          this.flash(`MFE ${r.mfe} kcal/mol (${r.engine})`);
        } finally { this.loading = false; }
      },

      async mrnaProps() {
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "mrna_properties", sequence: this.mrnaSeq.trim() });
          if (r.error) { this.error = r.error; return; }
          this.mrnaResult = r;
        } finally { this.loading = false; }
      },

      async designCrispr() {
        if (!this.crisprDna.trim()) { this.error = "Paste target DNA"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("rna_design", { action: "crispr_guides", target_dna: this.crisprDna.trim(), nuclease: this.nuclease, top: 10 });
          if (r.error) { this.error = r.error; return; }
          this.crisprResult = r;
          this.flash(`${r.total_guides} guides found — top score ${r.recommended[0]?.on_target_score ?? '—'}`);
        } finally { this.loading = false; }
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel">

    <!-- Header -->
    <div class="panel-header">
      <div class="header-left">
        <span class="material-symbols-outlined header-icon">genetics</span>
        <div>
          <h2>RNA Therapeutics</h2>
          <p class="header-subtitle">siRNA design · Codon optimization · RNA folding · CRISPR guides</p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="dock-tabs">
      <button class="dock-tab" :class="{active: $store.rnaTherapy.activeTab==='sirna'}" @click="$store.rnaTherapy.activeTab='sirna'">
        <span class="material-symbols-outlined">content_cut</span> siRNA</button>
      <button class="dock-tab" :class="{active: $store.rnaTherapy.activeTab==='codon'}" @click="$store.rnaTherapy.activeTab='codon'">
        <span class="material-symbols-outlined">translate</span> Codon</button>
      <button class="dock-tab" :class="{active: $store.rnaTherapy.activeTab==='fold'}" @click="$store.rnaTherapy.activeTab='fold'">
        <span class="material-symbols-outlined">gesture</span> Folding</button>
      <button class="dock-tab" :class="{active: $store.rnaTherapy.activeTab==='mrna'}" @click="$store.rnaTherapy.activeTab='mrna'">
        <span class="material-symbols-outlined">description</span> mRNA Props</button>
      <button class="dock-tab" :class="{active: $store.rnaTherapy.activeTab==='crispr'}" @click="$store.rnaTherapy.activeTab='crispr'">
        <span class="material-symbols-outlined">edit_note</span> CRISPR</button>
    </div>

    <!-- Body -->
    <div class="panel-body">
      <div x-show="$store.rnaTherapy.error" class="dock-error" x-text="$store.rnaTherapy.error"></div>
      <div x-show="$store.rnaTherapy.message" class="dock-msg" x-text="$store.rnaTherapy.message"></div>
      <div x-show="$store.rnaTherapy.loading" class="dock-loading"><div class="loading-spinner"></div><span>Computing...</span></div>

      <!-- siRNA -->
      <div class="tab-content" x-show="$store.rnaTherapy.activeTab==='sirna'">
        <h3 class="section-title">siRNA Design</h3>
        <div class="dock-card">
          <textarea x-model="$store.rnaTherapy.mrna" rows="4" class="mt-textarea" placeholder="Paste target mRNA (min 40 nt, ACGU/ACGT)"></textarea>
          <textarea x-model="$store.rnaTherapy.otTranscripts" rows="2" class="mt-textarea" placeholder="Optional off-target transcripts: NAME SEQUENCE (one per line)"></textarea>
        </div>
        <button class="btn-run" @click="$store.rnaTherapy.designSirna()" :disabled="$store.rnaTherapy.loading || !$store.rnaTherapy.mrna.trim()">
          <span class="material-symbols-outlined">play_arrow</span>
          <span x-text="$store.rnaTherapy.loading ? 'Designing...' : 'Design siRNAs'"></span>
        </button>
        <template x-if="$store.rnaTherapy.sirnaResult">
          <div class="rt-block">
            <div class="rt-note" x-text="$store.rnaTherapy.sirnaResult.note"></div>
            <table class="rt-table">
              <thead><tr><th>Pos</th><th>Sense 21</th><th>Antisense 21</th><th>GC%</th><th>Reynolds</th><th>Flags</th><th></th></tr></thead>
              <tbody>
                <template x-for="c in $store.rnaTherapy.sirnaResult.recommended" :key="c.position">
                  <tr :class="{ok: c.passes}">
                    <td x-text="c.position"></td>
                    <td><code x-text="c.sense_21"></code></td>
                    <td><code x-text="c.antisense_21"></code></td>
                    <td x-text="c.gc_percent"></td>
                    <td><b x-text="c.reynolds_score"></b></td>
                    <td class="rt-warn" x-text="c.warnings.join('; ')"></td>
                    <td><button class="rt-mini" @click="$store.rnaTherapy.sirnaOfftarget(c)">Off-target</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="$store.rnaTherapy.otResult">
              <div class="rt-subblock">
                <b>Off-target screen:</b> <span x-text="$store.rnaTherapy.otResult.num_offtargets"></span> hits ·
                perfect matches: <span x-text="$store.rnaTherapy.otResult.num_perfect_matches"></span>
                <table class="rt-table" x-show="$store.rnaTherapy.otResult.off_targets.length">
                  <thead><tr><th>Transcript</th><th>Pos</th><th>MM</th><th>Seed MM</th><th>Aligned</th></tr></thead>
                  <tbody>
                    <template x-for="(h, i) in $store.rnaTherapy.otResult.off_targets.slice(0,8)" :key="i">
                      <tr><td x-text="h.transcript"></td><td x-text="h.position"></td><td x-text="h.mismatches"></td>
                          <td x-text="h.seed_mismatches" :class="{'rt-warn': h.seed_mismatches===0}"></td><td><code x-text="h.aligned"></code></td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Codon -->
      <div class="tab-content" x-show="$store.rnaTherapy.activeTab==='codon'">
        <h3 class="section-title">Codon Optimizer</h3>
        <div class="dock-card">
          <div class="dock-card-header">
            <span class="material-symbols-outlined dock-card-icon">translate</span>
            <h4>Protein Sequence</h4>
          </div>
          <textarea x-model="$store.rnaTherapy.protein" rows="3" class="mt-textarea" placeholder="Protein sequence (single-letter AA)"></textarea>
          <div class="rt-row">
            <label class="param-label">Host</label>
            <select x-model="$store.rnaTherapy.host" class="rt-select">
              <option value="human">Human</option><option value="ecoli">E. coli</option>
              <option value="yeast">Yeast</option><option value="cho">CHO</option>
            </select>
          </div>
        </div>
        <button class="btn-run" @click="$store.rnaTherapy.optimizeCodon()" :disabled="$store.rnaTherapy.loading">
          <span class="material-symbols-outlined">play_arrow</span>
          <span x-text="$store.rnaTherapy.loading ? 'Optimizing...' : 'Optimize'"></span>
        </button>
        <template x-if="$store.rnaTherapy.codonResult">
          <div class="rt-block">
            <div class="data-info-bar">
              <span class="material-symbols-outlined success-icon">check_circle</span>
              <span class="rt-stat">CAI: <b x-text="$store.rnaTherapy.codonResult.cai"></b></span>
              <span class="rt-stat">GC: <b x-text="$store.rnaTherapy.codonResult.gc_percent + '%'"></b></span>
              <span class="rt-stat">Length: <b x-text="$store.rnaTherapy.codonResult.length_aa + ' aa'"></b></span>
              <span class="rt-stat rt-okk" x-show="$store.rnaTherapy.codonResult.translation_ok">✓ translation verified</span>
            </div>
            <label class="rt-lbl">CDS (DNA)</label><textarea readonly rows="3" class="mt-textarea" x-text="$store.rnaTherapy.codonResult.cds_dna"></textarea>
            <label class="rt-lbl">mRNA (U)</label><textarea readonly rows="3" class="mt-textarea" x-text="$store.rnaTherapy.codonResult.mrna"></textarea>
          </div>
        </template>
      </div>

      <!-- Folding -->
      <div class="tab-content" x-show="$store.rnaTherapy.activeTab==='fold'">
        <h3 class="section-title">RNA Folding</h3>
        <div class="dock-card">
          <textarea x-model="$store.rnaTherapy.foldSeq" rows="3" class="mt-textarea" placeholder="RNA sequence (≤400 nt)"></textarea>
        </div>
        <button class="btn-run" @click="$store.rnaTherapy.fold()" :disabled="$store.rnaTherapy.loading || !$store.rnaTherapy.foldSeq.trim()">
          <span class="material-symbols-outlined">gesture</span>
          <span x-text="$store.rnaTherapy.loading ? 'Folding...' : 'Fold'"></span>
        </button>
        <template x-if="$store.rnaTherapy.foldResult">
          <div class="rt-block">
            <div class="data-info-bar">
              <span class="material-symbols-outlined success-icon">check_circle</span>
              <span class="rt-stat">MFE: <b x-text="$store.rnaTherapy.foldResult.mfe + ' kcal/mol'"></b></span>
              <span class="rt-stat">GC: <b x-text="$store.rnaTherapy.foldResult.gc_percent + '%'"></b></span>
              <span class="rt-stat">Paired: <b x-text="($store.rnaTherapy.foldResult.paired_fraction*100).toFixed(0) + '%'"></b></span>
              <span class="rt-stat">Engine: <b x-text="$store.rnaTherapy.foldResult.engine"></b></span>
            </div>
            <pre class="rt-fold" x-text="$store.rnaTherapy.foldResult.sequence + '\n' + $store.rnaTherapy.foldResult.structure"></pre>
          </div>
        </template>
      </div>

      <!-- mRNA props -->
      <div class="tab-content" x-show="$store.rnaTherapy.activeTab==='mrna'">
        <h3 class="section-title">mRNA Properties</h3>
        <div class="dock-card">
          <textarea x-model="$store.rnaTherapy.mrnaSeq" rows="4" class="mt-textarea" placeholder="mRNA / CDS sequence"></textarea>
        </div>
        <button class="btn-run" @click="$store.rnaTherapy.mrnaProps()" :disabled="$store.rnaTherapy.loading || !$store.rnaTherapy.mrnaSeq.trim()">
          <span class="material-symbols-outlined">analytics</span>
          <span x-text="$store.rnaTherapy.loading ? 'Analyzing...' : 'Analyze'"></span>
        </button>
        <template x-if="$store.rnaTherapy.mrnaResult">
          <div class="rt-block">
            <table class="rt-table kv">
              <template x-for="[k, v] of Object.entries($store.rnaTherapy.mrnaResult).filter(([k]) => k !== 'note')">
                <tr><td x-text="k"></td><td x-text="v"></td></tr>
              </template>
              <tr><td colspan="2" class="rt-note" x-text="$store.rnaTherapy.mrnaResult.note"></td></tr>
            </table>
          </div>
        </template>
      </div>

      <!-- CRISPR -->
      <div class="tab-content" x-show="$store.rnaTherapy.activeTab==='crispr'">
        <h3 class="section-title">CRISPR Guide Design</h3>
        <div class="dock-card">
          <textarea x-model="$store.rnaTherapy.crisprDna" rows="4" class="mt-textarea" placeholder="Target DNA (ACGT, min 40 bp)"></textarea>
          <div class="rt-row">
            <label class="param-label">Nuclease</label>
            <select x-model="$store.rnaTherapy.nuclease" class="rt-select">
              <option value="spcas9">SpCas9 (NGG)</option>
              <option value="cas12a">Cas12a (TTTV)</option>
            </select>
          </div>
        </div>
        <button class="btn-run" @click="$store.rnaTherapy.designCrispr()" :disabled="$store.rnaTherapy.loading || !$store.rnaTherapy.crisprDna.trim()">
          <span class="material-symbols-outlined">design_services</span>
          <span x-text="$store.rnaTherapy.loading ? 'Designing...' : 'Design Guides'"></span>
        </button>
        <template x-if="$store.rnaTherapy.crisprResult">
          <div class="rt-block">
            <div class="rt-note" x-text="$store.rnaTherapy.crisprResult.note"></div>
            <table class="rt-table">
              <thead><tr><th>#</th><th>Guide (DNA)</th><th>PAM</th><th>Strand</th><th>GC%</th><th>Score</th><th>Penalties</th></tr></thead>
              <tbody>
                <template x-for="(g, i) in $store.rnaTherapy.crisprResult.recommended" :key="i">
                  <tr>
                    <td x-text="i+1"></td>
                    <td><code x-text="g.guide_rna"></code></td>
                    <td x-text="g.pam"></td><td x-text="g.strand"></td>
                    <td x-text="g.gc_percent"></td>
                    <td><b x-text="g.on_target_score"></b></td>
                    <td class="rt-warn" x-text="g.penalties.join('; ')"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </div>

    <style>
      .dock-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--color-background); }
      .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--color-border); background: var(--color-panel); flex-shrink: 0; }
      .header-left { display: flex; align-items: center; gap: 12px; }
      .header-icon { font-size: 28px; color: var(--color-primary); }
      .panel-header h2 { color: var(--color-text); font-size: 1.05rem; margin: 0; font-weight: 700; }
      .header-subtitle { color: var(--color-text-muted); font-size: 0.7rem; margin: 2px 0 0 0; }

      .dock-tabs { display: flex; gap: 2px; padding: 6px 20px; border-bottom: 1px solid var(--color-border); background: var(--color-panel); flex-shrink: 0; overflow-x: auto; }
      .dock-tab { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--color-text-muted); cursor: pointer; font-size: 0.68rem; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
      .dock-tab:hover { color: var(--color-text); }
      .dock-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
      .dock-tab .material-symbols-outlined { font-size: 15px; }

      .panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
      .tab-content { min-height: 120px; }

      .dock-error { padding: 8px 10px; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); border-radius: 6px; color: var(--color-error-text, #ff6b6b); font-size: 0.68rem; margin-bottom: 10px; }
      .dock-msg { padding: 8px 10px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 6px; color: #22c55e; font-size: 0.68rem; margin-bottom: 10px; }
      .dock-loading { display: flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 0.7rem; color: var(--color-text-muted); }
      .loading-spinner { width: 15px; height: 15px; border: 2px solid var(--color-border); border-top: 2px solid var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .section-title { font-size: 0.78rem; font-weight: 700; color: var(--color-text); margin: 0 0 8px 0; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }

      .dock-card { padding: 14px; background: var(--color-panel); border: 1px solid var(--color-border); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
      .dock-card-header { display: flex; align-items: center; gap: 8px; }
      .dock-card-icon { font-size: 20px; color: var(--color-primary); }
      .dock-card h4 { color: var(--color-text); font-size: 0.78rem; font-weight: 600; margin: 0; }

      .mt-textarea { width: 100%; min-height: 54px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 7px; background: var(--color-background); color: var(--color-text); font-size: 0.68rem; font-family: var(--font-mono, monospace); resize: vertical; }
      .mt-textarea:focus { outline: none; border-color: var(--color-primary); }

      .rt-row { display: flex; gap: 8px; align-items: center; }
      .param-label { font-size: 0.62rem; color: var(--color-text-muted); font-weight: 600; white-space: nowrap; }
      .rt-select { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text); font-size: 0.68rem; }

      .btn-run { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 6px; padding: 10px; background: var(--color-primary); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; }
      .btn-run:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
      .btn-run:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .data-info-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--color-background); border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 8px; font-size: 0.68rem; flex-wrap: wrap; }
      .success-icon { font-size: 16px; color: #22c55e; }
      .rt-stat { color: var(--color-text); }
      .rt-okk { color: #22c55e; font-weight: 600; }

      .rt-block { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; background: var(--color-panel); }
      .rt-subblock { border: 1px solid var(--color-border); border-radius: 8px; padding: 8px; font-size: 0.66rem; color: var(--color-text); }
      .rt-table { border-collapse: collapse; font-size: 0.64rem; width: 100%; }
      .rt-table th { text-align: left; color: var(--color-text-muted); padding: 4px 8px; border-bottom: 1px solid var(--color-border); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .rt-table td { padding: 4px 8px; border-bottom: 1px dotted var(--color-border); color: var(--color-text); }
      .rt-table tr.ok td { background: rgba(34,197,94,0.06); }
      .rt-table code { font-size: 0.6rem; font-family: var(--font-mono, monospace); color: var(--color-primary); word-break: break-all; }
      .rt-warn { color: #ff6b6b; font-size: 0.58rem; }
      .rt-note { color: var(--color-text-muted); font-size: 0.62rem; font-style: italic; }
      .rt-lbl { font-size: 0.56rem; text-transform: uppercase; color: var(--color-text-muted); letter-spacing: 0.04em; }
      .rt-fold { font-family: var(--font-mono, monospace); font-size: 0.64rem; letter-spacing: 1px; background: var(--color-background); padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); overflow-x: auto; white-space: pre; color: var(--color-text); margin: 0; }
      .rt-mini { font-size: 0.58rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: none; color: var(--color-primary); cursor: pointer; }
      .rt-mini:hover { border-color: var(--color-primary); }
      .kv td:first-child { color: var(--color-text-muted); width: 160px; }
    </style>
  </div>
</body>
</html>
