<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("dockingAnalysis", {
      jobId: "", activeTab: "3dview", loading: false, error: "", message: "",
      deepData: null, poseIndex: 0, energies: [],
      viewerReady: false, viewerRef: null,
      proteinStyle: "cartoon", proteinColor: "spectrum", proteinShow: true, proteinOpacity: 1.0,
      ligandStyle: "stick", ligandColor: "greenCarbon", ligandShow: true,
      showSurface: false, showHBonds: true, showLabels: false, bgColor: "#ffffff",
      spinning: false, zoomLevel: 100,
      uploadMode: false, receptorFile: null, ligandFile: null,
      receptorName: "", ligandName: "", uploadLoading: false,

      async analyze() {
        if (!this.jobId) { this.error = "Enter a docking job ID"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("docking_analysis", { action: "deep_analysis", job_id: this.jobId });
          if (!r.success) { this.error = r.error; } else { this.deepData = r; this.energies = r.energies || []; setTimeout(() => this.init3DView(), 200); }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      async uploadAndAnalyze() {
        if (!this.receptorFile || !this.ligandFile) { this.error = "Upload both receptor and ligand files"; return; }
        this.uploadLoading = true; this.error = "";
        try {
          const receptorContent = await this._readFile(this.receptorFile);
          const ligandContent = await this._readFile(this.ligandFile);
          const r = await callJsonApi("docking_upload", {
            receptor_content: receptorContent,
            receptor_filename: this.receptorFile.name,
            ligand_content: ligandContent,
            ligand_filename: this.ligandFile.name,
          });
          if (r.error) { this.error = r.error; }
          else {
            this.jobId = r.job_id;
            this.message = `Uploaded ${r.num_poses} poses. Job: ${r.job_id}`;
            setTimeout(() => this.message = "", 5000);
            await this.analyze();
          }
        } catch (e) { this.error = "Upload failed: " + e.message; }
        this.uploadLoading = false;
      },

      _readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Failed to read file"));
          reader.readAsText(file);
        });
      },

      handleReceptorUpload(event) {
        const f = event.target.files[0];
        if (!f) return;
        this.receptorFile = f;
        this.receptorName = f.name;
      },

      handleLigandUpload(event) {
        const f = event.target.files[0];
        if (!f) return;
        this.ligandFile = f;
        this.ligandName = f.name;
      },

      clearUpload() {
        this.receptorFile = null; this.ligandFile = null;
        this.receptorName = ""; this.ligandName = "";
      },
      async analyzeJobId(id) { this.jobId = id; await this.analyze(); },
      get3DViewer() { return this.viewerRef || window._dockingViewer; },
      init3DView() {
        if (!window.$3Dmol || this.viewerRef) return;
        const el = document.getElementById("da-3d-canvas");
        if (!el || el.clientWidth === 0) { setTimeout(() => this.init3DView(), 200); return; }
        const v = window.$3Dmol.createViewer(el, { backgroundColor: this.bgColor, antialias: true, cartoonQuality: 10 });
        this.viewerRef = v; window._dockingViewer = v; this.viewerReady = true; this.renderScene();
      },
      renderScene() {
        const v = this.get3DViewer(); if (!v || !this.deepData) return;
        v.removeAllModels(); v.removeAllLabels(); v.removeAllSurfaces();
        const pdb = (s) => s && (s.includes("ATOM") || s.includes("HETATM"));
        const ov = this.deepData.overlay;
        if (ov?.receptor_pdb && pdb(ov.receptor_pdb) && this.proteinShow) {
          v.addModel(ov.receptor_pdb, "pdb");
          const sc = this.proteinColor === "ss" ? "rasmol" : this.proteinColor;
          const so = { cartoon:{}, stick:{radius:0.15}, sphere:{radius:0.5}, line:{linewidth:1.5}, cross:{radius:0.1} };
          so[this.proteinStyle] = so[this.proteinStyle] || {};
          Object.assign(so[this.proteinStyle], { colorscheme: sc, opacity: this.proteinOpacity });
          v.setStyle({}, so);
        }
        if (ov?.poses && this.poseIndex < ov.poses.length && this.ligandShow) {
          const pp = ov.poses[this.poseIndex].pdb;
          if (pdb(pp)) { v.addModel(pp, "pdb"); const lm = v.getModel(-1); if (this.ligandStyle === "ballstick") lm.setStyle({}, { stick: { colorscheme: this.ligandColor, radius: 0.15 }, sphere: { colorscheme: this.ligandColor, scale: 0.35 } }); else if (this.ligandStyle === "stick") lm.setStyle({}, { stick: { colorscheme: this.ligandColor, radius: 0.22 } }); else if (this.ligandStyle === "sphere") lm.setStyle({}, { sphere: { colorscheme: this.ligandColor, radius: 0.4 } }); else if (this.ligandStyle === "line") lm.setStyle({}, { line: { colorscheme: this.ligandColor, linewidth: 2.5 } }); }
        }
        if (this.showSurface) try { v.addSurface(window.$3Dmol.SurfaceType.VDW, { opacity: 0.5, colorscheme: "whiteCarbon" }, { hetflag: false }); } catch (e) {}
        if (this.showHBonds && this.deepData?.interactions?.hydrogen_bonds) {
          this.deepData.interactions.hydrogen_bonds.forEach(hb => { try { const pA = v.selectedAtoms({ resi: hb.resseq, chain: hb.chain }); const lA = v.selectedAtoms({ hetflag: true }); if (pA.length && lA.length) { v.addCylinder({ start: pA[0], end: lA[0], radius: 0.08, color: "#facc15", dashed: true }); if (this.showLabels) v.addLabel(`${hb.distance}Å`, { position: { x: (pA[0].x + lA[0].x) / 2, y: (pA[0].y + lA[0].y) / 2, z: (pA[0].z + lA[0].z) / 2 }, backgroundColor: "black", fontColor: "white", fontSize: 10 }); } } catch (e) {} });
        }
        if (this.showLabels && this.ligandShow) try { v.addPropertyLabels("resn", { hetflag: true }, { fontColor: this.bgColor === "#ffffff" ? "black" : "white", fontSize: 10, showBackground: false }); } catch (e) {}
        v.zoomTo(this.ligandShow ? { hetflag: true } : undefined); v.render();
      },
      zoomIn() { const v = this.get3DViewer(); if (v) { v.zoom(0.8, 500); this.zoomLevel = Math.min(this.zoomLevel + 20, 200); } },
      zoomOut() { const v = this.get3DViewer(); if (v) { v.zoom(1.25, 500); this.zoomLevel = Math.max(this.zoomLevel - 20, 20); } },
      resetView() { const v = this.get3DViewer(); if (v) { v.zoomTo(); this.zoomLevel = 100; v.render(); } },
      toggleSpin() { this.spinning = !this.spinning; const v = this.get3DViewer(); if (v) v.spin(this.spinning ? 0.5 : 0); },
      takeSnapshot() { const v = this.get3DViewer(); if (!v) return; try { const u = v.pngURI(); const a = document.createElement("a"); a.href = u; a.download = `docking_${this.jobId}.png`; a.click(); } catch (e) {} },
      setBg(c) { this.bgColor = c; const v = this.get3DViewer(); if (v) { v.setBackgroundColor(c); v.render(); } },
      applyPreset(n) {
        if (n === "default") { this.proteinStyle = "cartoon"; this.proteinColor = "ss"; this.ligandStyle = "stick"; this.ligandColor = "greenCarbon"; this.bgColor = "#ffffff"; }
        else if (n === "dark") { this.proteinStyle = "cartoon"; this.proteinColor = "spectrum"; this.ligandStyle = "stick"; this.ligandColor = "orangeCarbon"; this.bgColor = "#1a1a2e"; }
        else if (n === "surface") { this.proteinOpacity = 0.6; this.showSurface = true; this.ligandStyle = "ballstick"; this.ligandColor = "magentaCarbon"; }
        else if (n === "analysis") { this.proteinStyle = "stick"; this.proteinColor = "rasmol"; this.ligandStyle = "ballstick"; this.ligandColor = "cyanCarbon"; this.bgColor = "#f0f4f8"; }
        setTimeout(() => this.renderScene(), 100);
      },
      energyColor(v) { return v < 0 ? "#22c55e" : "#ff6b6b"; },
    });

    if (typeof window.$3Dmol === "undefined") { const s = document.createElement("script"); s.src = "https://3Dmol.org/build/3Dmol-min.js"; s.onload = () => { if (window._dockingViewer) window._dockingViewer.render(); }; document.head.appendChild(s); }
  </script>
</head>
<body>
  <div x-data class="da-panel">
    <!-- Compact Header -->
    <div class="da-header">
      <div class="da-header-left">
        <span class="material-symbols-outlined da-icon">biotech</span>
        <h2>Docking Analysis</h2>
      </div>
      <div class="da-header-right">
        <!-- Toggle -->
        <div class="da-toggle">
          <button class="da-toggle-btn" :class="{active: !$store.dockingAnalysis.uploadMode}" @click="$store.dockingAnalysis.uploadMode = false">Job ID</button>
          <button class="da-toggle-btn" :class="{active: $store.dockingAnalysis.uploadMode}" @click="$store.dockingAnalysis.uploadMode = true">Upload</button>
        </div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="da-input-section">
      <!-- Job ID Mode -->
      <div x-show="!$store.dockingAnalysis.uploadMode" class="da-input-row">
        <input type="text" x-model="$store.dockingAnalysis.jobId" placeholder="Enter docking job ID..." class="da-input" @keyup.enter="$store.dockingAnalysis.analyze()" />
        <button class="da-btn" @click="$store.dockingAnalysis.analyze()" :disabled="$store.dockingAnalysis.loading || !$store.dockingAnalysis.jobId">
          <span class="material-symbols-outlined" style="font-size:16px">biotech</span> Analyze
        </button>
      </div>

      <!-- Upload Mode -->
      <div x-show="$store.dockingAnalysis.uploadMode" class="da-upload-section">
        <div class="da-upload-grid">
          <div class="da-upload-card">
            <span class="material-symbols-outlined da-upload-icon">biotech</span>
            <div class="da-upload-label">Receptor</div>
            <div class="da-upload-hint">PDB · PDBQT · CIF</div>
            <label class="da-upload-btn">
              <span x-text="$store.dockingAnalysis.receptorName || 'Choose file'"></span>
              <input type="file" accept=".pdb,.pdbqt,.ent,.cif,.mol2" hidden @change="$store.dockingAnalysis.handleReceptorUpload($event)" />
            </label>
          </div>
          <div class="da-upload-card">
            <span class="material-symbols-outlined da-upload-icon" style="color:#22c55e">science</span>
            <div class="da-upload-label">Ligand Poses</div>
            <div class="da-upload-hint">PDBQT · SDF</div>
            <label class="da-upload-btn">
              <span x-text="$store.dockingAnalysis.ligandName || 'Choose file'"></span>
              <input type="file" accept=".pdbqt,.sdf,.mol" hidden @change="$store.dockingAnalysis.handleLigandUpload($event)" />
            </label>
          </div>
        </div>
        <div class="da-upload-actions">
          <button class="da-btn" @click="$store.dockingAnalysis.uploadAndAnalyze()" :disabled="$store.dockingAnalysis.uploadLoading || !$store.dockingAnalysis.receptorFile || !$store.dockingAnalysis.ligandFile">
            <span class="material-symbols-outlined" style="font-size:16px">upload_file</span> Upload & Analyze
          </button>
          <button class="da-btn-outline" @click="$store.dockingAnalysis.clearUpload()" x-show="$store.dockingAnalysis.receptorFile || $store.dockingAnalysis.ligandFile">Clear</button>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div x-show="$store.dockingAnalysis.error" class="da-error" x-text="$store.dockingAnalysis.error" @click="$store.dockingAnalysis.error=''"></div>
    <div x-show="$store.dockingAnalysis.message" class="da-msg" x-text="$store.dockingAnalysis.message"></div>
    <div x-show="$store.dockingAnalysis.loading || $store.dockingAnalysis.uploadLoading" class="da-loading"><div class="loading-spinner"></div><span x-text="$store.dockingAnalysis.uploadLoading ? 'Uploading...' : 'Analyzing...'"></span></div>

    <!-- Tabs -->
    <div class="da-tabs" x-show="$store.dockingAnalysis.deepData">
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === '3dview'}" @click="$store.dockingAnalysis.activeTab = '3dview'; setTimeout(() => $store.dockingAnalysis.init3DView(), 200)">3D View</button>
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === '2d'}" @click="$store.dockingAnalysis.activeTab = '2d'">2D Diagram</button>
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === 'deep'}" @click="$store.dockingAnalysis.activeTab = 'deep'">Interactions</button>
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === 'energy'}" @click="$store.dockingAnalysis.activeTab = 'energy'">Energy</button>
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === 'clusters'}" @click="$store.dockingAnalysis.activeTab = 'clusters'">Clusters</button>
      <button class="da-tab" :class="{active: $store.dockingAnalysis.activeTab === 'torsion'}" @click="$store.dockingAnalysis.activeTab = 'torsion'">Torsion</button>
    </div>

    <!-- Analysis Content -->
    <div class="da-content" x-show="$store.dockingAnalysis.deepData">
      <!-- Pose Selector -->
      <div class="da-poses" x-show="$store.dockingAnalysis.energies?.length">
        <span class="da-pose-label" x-text="'Pose ' + ($store.dockingAnalysis.poseIndex + 1) + '/' + $store.dockingAnalysis.energies.length"></span>
        <template x-for="(e, i) in $store.dockingAnalysis.energies" :key="i">
          <button @click="$store.dockingAnalysis.poseIndex = i; $store.dockingAnalysis.renderScene()" class="da-pose-btn" :class="{active: $store.dockingAnalysis.poseIndex === i}" x-text="'#'+(i+1)+' '+e.toFixed(1)"></button>
        </template>
      </div>

      <!-- 3D View -->
      <div x-show="$store.dockingAnalysis.activeTab === '3dview'" class="da-3d-section">
        <div class="da-3d-controls">
          <div class="da-presets">
            <button @click="$store.dockingAnalysis.applyPreset('default')" class="da-preset-btn">Default</button>
            <button @click="$store.dockingAnalysis.applyPreset('dark')" class="da-preset-btn">Dark</button>
            <button @click="$store.dockingAnalysis.applyPreset('surface')" class="da-preset-btn">Surface</button>
            <button @click="$store.dockingAnalysis.applyPreset('analysis')" class="da-preset-btn">Analysis</button>
          </div>
          <div class="da-style-controls">
            <select x-model="$store.dockingAnalysis.proteinStyle" @change="$store.dockingAnalysis.renderScene()" class="da-select"><option value="cartoon">Cartoon</option><option value="stick">Stick</option><option value="sphere">Sphere</option></select>
            <select x-model="$store.dockingAnalysis.proteinColor" @change="$store.dockingAnalysis.renderScene()" class="da-select"><option value="ss">SS</option><option value="spectrum">Spectrum</option><option value="chain">Chain</option></select>
            <select x-model="$store.dockingAnalysis.ligandStyle" @change="$store.dockingAnalysis.renderScene()" class="da-select"><option value="stick">Stick</option><option value="ballstick">Ball+Stick</option><option value="sphere">Sphere</option></select>
            <select x-model="$store.dockingAnalysis.ligandColor" @change="$store.dockingAnalysis.renderScene()" class="da-select"><option value="greenCarbon">Green</option><option value="cyanCarbon">Cyan</option><option value="orangeCarbon">Orange</option><option value="magentaCarbon">Magenta</option></select>
            <label class="da-check"><input type="checkbox" x-model="$store.dockingAnalysis.showSurface" @change="$store.dockingAnalysis.renderScene()" /> Surface</label>
            <label class="da-check"><input type="checkbox" x-model="$store.dockingAnalysis.showHBonds" @change="$store.dockingAnalysis.renderScene()" /> H-Bonds</label>
          </div>
        </div>
        <div id="da-3d-canvas" class="da-3d-canvas">
          <div x-show="$store.dockingAnalysis.energies?.length" class="da-energy-badge" x-text="(($store.dockingAnalysis.energies[$store.dockingAnalysis.poseIndex] || 0).toFixed(1)) + ' kcal/mol'"></div>
        </div>
        <div class="da-3d-actions">
          <div class="da-zoom">
            <button @click="$store.dockingAnalysis.zoomOut()" class="da-action-btn">−</button>
            <span class="da-zoom-label" x-text="$store.dockingAnalysis.zoomLevel + '%'"></span>
            <button @click="$store.dockingAnalysis.zoomIn()" class="da-action-btn">+</button>
          </div>
          <button @click="$store.dockingAnalysis.toggleSpin()" class="da-action-btn" :class="{active: $store.dockingAnalysis.spinning}">Spin</button>
          <button @click="$store.dockingAnalysis.resetView()" class="da-action-btn">Reset</button>
          <button @click="$store.dockingAnalysis.takeSnapshot()" class="da-action-btn da-snapshot">Snap</button>
        </div>
      </div>

      <!-- 2D Diagram -->
      <div x-show="$store.dockingAnalysis.activeTab === '2d'" class="da-2d-section">
        <div x-show="$store.dockingAnalysis.deepData.svg" class="da-2d-view" x-html="$store.dockingAnalysis.deepData.svg?.replace('<svg', '<svg style=\"max-width:100%;height:auto\"')"></div>
        <div x-show="!$store.dockingAnalysis.deepData.svg" class="da-empty"><span class="material-symbols-outlined">draw</span><p>SVG diagram not available</p></div>
      </div>

      <!-- Interactions -->
      <div x-show="$store.dockingAnalysis.activeTab === 'deep'" class="da-interactions">
        <div class="da-stats-grid">
          <div class="da-stat-card da-green"><div class="da-stat-num" x-text="$store.dockingAnalysis.deepData.interactions?.summary?.total_hbonds || 0"></div><div class="da-stat-label">H-Bonds</div></div>
          <div class="da-stat-card da-amber"><div class="da-stat-num" x-text="$store.dockingAnalysis.deepData.interactions?.summary?.total_hydrophobic || 0"></div><div class="da-stat-label">Hydrophobic</div></div>
          <div class="da-stat-card da-violet"><div class="da-stat-num" x-text="$store.dockingAnalysis.deepData.interactions?.summary?.total_pi_stacking || 0"></div><div class="da-stat-label">Pi-Stacking</div></div>
          <div class="da-stat-card da-orange"><div class="da-stat-num" x-text="$store.dockingAnalysis.deepData.interactions?.summary?.total_salt_bridges || 0"></div><div class="da-stat-label">Salt Bridges</div></div>
        </div>
        <div class="da-residues" x-show="$store.dockingAnalysis.deepData.interactions?.binding_site_residues?.length">
          <div class="da-residues-label">Binding Site Residues</div>
          <div class="da-residues-list">
            <template x-for="r in $store.dockingAnalysis.deepData.interactions.binding_site_residues" :key="r.resname+r.resseq">
              <span class="da-residue-chip" x-text="r.resname + r.resseq"></span>
            </template>
          </div>
        </div>
      </div>

      <!-- Energy -->
      <div x-show="$store.dockingAnalysis.activeTab === 'energy'" class="da-energy-section">
        <div class="da-energy-label" x-text="($store.dockingAnalysis.deepData.residue_energy?.length || 0) + ' residues contributing'"></div>
        <template x-for="r in ($store.dockingAnalysis.deepData.residue_energy || []).slice(0,20)" :key="r.residue_label">
          <div class="da-energy-row">
            <span class="da-energy-name" x-text="r.residue_label"></span>
            <div class="da-energy-bar"><div class="da-energy-fill" :style="'width:' + Math.min(100, Math.abs(r.energy) * 40) + '%;background:' + $store.dockingAnalysis.energyColor(r.energy)"></div></div>
            <span class="da-energy-val" :style="'color:' + $store.dockingAnalysis.energyColor(r.energy)" x-text="r.energy.toFixed(2)"></span>
          </div>
        </template>
      </div>

      <!-- Clusters -->
      <div x-show="$store.dockingAnalysis.activeTab === 'clusters'" class="da-clusters-section">
        <div class="da-clusters-label" x-text="($store.dockingAnalysis.deepData.clusters?.length || 0) + ' clusters (RMSD 2.0Å)'"></div>
        <template x-for="c in $store.dockingAnalysis.deepData.clusters" :key="c.cluster_id">
          <div class="da-cluster-card">
            <div><div class="da-cluster-title" x-text="'Cluster ' + c.cluster_id + ' (' + c.size + ' poses)'"></div><div class="da-cluster-meta" x-text="'Rep: #' + (c.representative + 1) + (c.avg_energy != null ? ' · ' + c.avg_energy.toFixed(1) + ' kcal/mol' : '')"></div></div>
            <button @click="$store.dockingAnalysis.poseIndex = c.representative; $store.dockingAnalysis.activeTab = '3dview'; setTimeout(() => { $store.dockingAnalysis.init3DView(); $store.dockingAnalysis.renderScene(); }, 200)" class="da-view-btn">View</button>
          </div>
        </template>
      </div>

      <!-- Torsion -->
      <div x-show="$store.dockingAnalysis.activeTab === 'torsion'" class="da-torsion-section">
        <div class="da-torsion-label" x-text="($store.dockingAnalysis.deepData.torsions?.length || 0) + ' dihedral angles'"></div>
        <template x-for="t in $store.dockingAnalysis.deepData.torsions" :key="t.atoms.join('')">
          <div class="da-torsion-card">
            <span class="da-torsion-atoms" x-text="t.atoms.join(' - ')"></span>
            <span class="da-torsion-angle" x-text="t.angle + '°'"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Empty State -->
    <div x-show="!$store.dockingAnalysis.deepData && !$store.dockingAnalysis.loading" class="da-empty">
      <span class="material-symbols-outlined da-empty-icon">biotech</span>
      <p>Enter a Job ID or upload docking files</p>
      <p class="da-empty-hint">Supports Vina, Glide, GOLD, AutoDock-GPU, rDock, PLANTS</p>
    </div>

    <style>
      .da-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .da-header { display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--color-border);flex-shrink:0 }
      .da-header-left { display:flex;align-items:center;gap:8px }
      .da-icon { font-size:22px;color:var(--color-primary) }
      .da-header h2 { font-size:0.85rem;margin:0;font-weight:700;color:var(--color-primary) }
      .da-toggle { display:flex;gap:2px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:6px;padding:2px }
      .da-toggle-btn { padding:4px 12px;background:transparent;border:none;border-radius:4px;color:var(--color-text-muted);cursor:pointer;font-size:0.6rem;font-weight:500;transition:all 0.15s }
      .da-toggle-btn.active { background:var(--color-primary);color:white }
      .da-input-section { padding:10px 16px;border-bottom:1px solid var(--color-border);flex-shrink:0 }
      .da-input-row { display:flex;gap:6px }
      .da-input { flex:1;padding:7px 12px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-panel);color:var(--color-text);font-size:0.7rem;font-family:monospace }
      .da-input:focus { outline:none;border-color:var(--color-primary) }
      .da-btn { display:flex;align-items:center;gap:4px;padding:7px 16px;background:var(--color-primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.66rem;font-weight:600;white-space:nowrap }
      .da-btn:disabled { opacity:0.5;cursor:not-allowed }
      .da-btn-outline { padding:6px 12px;background:transparent;border:1px solid var(--color-border);border-radius:6px;color:var(--color-text-muted);cursor:pointer;font-size:0.6rem }
      .da-upload-section { display:flex;flex-direction:column;gap:8px }
      .da-upload-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px }
      .da-upload-card { display:flex;flex-direction:column;align-items:center;padding:12px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;text-align:center }
      .da-upload-icon { font-size:24px;color:var(--color-primary);margin-bottom:4px }
      .da-upload-label { font-size:0.64rem;font-weight:600;color:var(--color-text);margin-bottom:2px }
      .da-upload-hint { font-size:0.5rem;color:var(--color-text-muted);margin-bottom:6px }
