<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("notebook", {
      activeTab: "search",
      message: "",
      error: "",
      loading: false,
      // Search
      searchQuery: "",
      searchResults: [],
      searchLoading: false,
      // Podcast
      podcastText: "",
      podcastVoice: "alloy",
      podcastUrl: "",
      podcastLoading: false,

      async init() { },

      async search() {
        if (!this.searchQuery.trim()) return;
        this.searchLoading = true; this.searchResults = [];
        try {
          const r = await callJsonApi("knowledge", {
            action: "query",
            query: this.searchQuery,
            top_k: 10,
          });
          this.searchResults = r.results || [];
          if (!this.searchResults.length) this.message = "No results found";
        } catch (e) {
          this.error = "Search failed: " + e.message;
        }
        this.searchLoading = false;
      },

      async generatePodcast() {
        if (!this.podcastText.trim()) return;
        this.podcastLoading = true; this.podcastUrl = ""; this.error = "";
        try {
          const r = await callJsonApi("knowledge", {
            action: "podcast",
            text: this.podcastText,
            voice: this.podcastVoice,
          });
          if (r.audio_url) {
            this.podcastUrl = "/api/files/" + r.audio_url;
            this.message = "Podcast generated";
          } else if (r.audio_base64) {
            const byteStr = atob(r.audio_base64);
            const bytes = new Uint8Array(byteStr.length);
            for (let i = 0; i < byteStr.length; i++) bytes[i] = byteStr.charCodeAt(i);
            const blob = new Blob([bytes], { type: "audio/mp3" });
            this.podcastUrl = URL.createObjectURL(blob);
            this.message = "Podcast generated";
          } else if (r.error) {
            this.error = r.error;
          } else {
            this.message = "Podcast request sent";
          }
        } catch (e) { this.error = "Podcast error: " + e.message; }
        this.podcastLoading = false;
      },

      async addNote(title, content) {
        try {
          await callJsonApi("knowledge", {
            action: "store",
            category: "notes",
            title: title,
            content: content,
            tags: "notes,notebook",
            source: "Notebook",
          });
          this.message = "Saved to notebook";
          setTimeout(() => { this.message = ""; }, 2000);
        } catch (e) { this.error = e.message; }
      },
    });
  </script>
</head>
<body>
  <div x-data class="ss-panel" x-init="$store.notebook.init()">
    <!-- Header -->
    <div class="ss-header">
      <span class="material-symbols-outlined ss-icon">menu_book</span>
      <div>
        <h2>Notebook</h2>
        <p class="ss-sub">Semantic Search · Podcast · Notes</p>
      </div>
    </div>

    <!-- Messages -->
    <div x-show="$store.notebook.error" class="ss-error" x-text="$store.notebook.error" @click="$store.notebook.error = ''"></div>
    <div x-show="$store.notebook.message" class="ss-msg" x-text="$store.notebook.message"></div>

    <!-- Tabs -->
    <div class="ss-tabs">
      <button class="ss-tab" :class="{active: $store.notebook.activeTab === 'search'}" @click="$store.notebook.activeTab = 'search'">
        <span class="material-symbols-outlined" style="font-size:14px">search</span> Search
      </button>
      <button class="ss-tab" :class="{active: $store.notebook.activeTab === 'podcast'}" @click="$store.notebook.activeTab = 'podcast'">
        <span class="material-symbols-outlined" style="font-size:14px">podcasts</span> Podcast
      </button>
      <button class="ss-tab" :class="{active: $store.notebook.activeTab === 'notes'}" @click="$store.notebook.activeTab = 'notes'">
        <span class="material-symbols-outlined" style="font-size:14px">edit_note</span> Quick Note
      </button>
    </div>

    <!-- Search Tab -->
    <div x-show="$store.notebook.activeTab === 'search'" class="ss-content">
      <div class="ss-search-row">
        <input type="text" x-model="$store.notebook.searchQuery" placeholder="Search your knowledge base (ChromaDB)..." class="ss-input"
          @keyup.enter="$store.notebook.search()" />
        <button class="ss-btn-primary" @click="$store.notebook.search()" :disabled="$store.notebook.searchLoading">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>

      <div x-show="$store.notebook.searchLoading" class="ss-loading"><div class="loading-spinner"></div> Searching...</div>

      <template x-if="$store.notebook.searchResults.length">
        <div class="ss-results">
          <h4 x-text="'Results (' + $store.notebook.searchResults.length + ')'"></h4>
          <template x-for="r in $store.notebook.searchResults" :key="r.id || r.title">
            <div class="ss-result-card">
              <div class="ss-result-title" x-text="r.title || r.source || 'Untitled'"></div>
              <div class="ss-result-snippet" x-text="(r.content || r.text || '').substring(0, 300)"></div>
              <div class="ss-result-meta">
                <span x-show="r.score" class="ss-result-score" x-text="'Relevance: ' + Math.round(r.score * 100) + '%'"></span>
                <span x-show="r.source" x-text="'Source: ' + r.source"></span>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Podcast Tab -->
    <div x-show="$store.notebook.activeTab === 'podcast'" class="ss-content">
      <div class="ss-card">
        <h4>Generate Research Podcast</h4>
        <p class="ss-card-text">Convert text into spoken audio using neural TTS (edge-tts, free).</p>
        <textarea x-model="$store.notebook.podcastText" placeholder="Paste research text, summary, or notes here..." class="ss-textarea" rows="6"></textarea>
        <div class="ss-podcast-row">
          <select x-model="$store.notebook.podcastVoice" class="ss-select">
            <option value="alloy">Alloy (Neutral)</option>
            <option value="echo">Echo (Warm)</option>
            <option value="fable">Fable (British)</option>
            <option value="onyx">Onyx (Deep)</option>
            <option value="nova">Nova (Friendly)</option>
            <option value="shimmer">Shimmer (Clear)</option>
          </select>
          <button class="ss-btn-primary" @click="$store.notebook.generatePodcast()" :disabled="$store.notebook.podcastLoading || !$store.notebook.podcastText">
            <span class="material-symbols-outlined">podcasts</span> Generate
          </button>
        </div>
        <div x-show="$store.notebook.podcastLoading" class="ss-loading"><div class="loading-spinner"></div> Generating audio...</div>
        <div x-show="$store.notebook.podcastUrl" style="margin-top:10px">
          <audio :src="$store.notebook.podcastUrl" controls style="width:100%;border-radius:6px"></audio>
        </div>
      </div>
    </div>

    <!-- Notes Tab -->
    <div x-show="$store.notebook.activeTab === 'notes'" class="ss-content">
      <div class="ss-card">
        <h4>Quick Note</h4>
        <p class="ss-card-text">Save a quick research note to your knowledge base.</p>
        <input type="text" id="nb-note-title" placeholder="Note title..." class="ss-input" style="margin-bottom:6px" />
        <textarea id="nb-note-content" placeholder="Your note..." class="ss-textarea" rows="4"></textarea>
        <button class="ss-btn-primary" @click="$store.notebook.addNote(document.getElementById('nb-note-title').value, document.getElementById('nb-note-content').value); document.getElementById('nb-note-title').value=''; document.getElementById('nb-note-content').value=''">
          <span class="material-symbols-outlined">save</span> Save to Notebook
        </button>
      </div>
    </div>

    <style>
      .ss-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; padding: 10px 14px; background: var(--color-background); }
      .ss-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-shrink: 0; }
      .ss-icon { font-size: 22px; color: #6366f1; }
      .ss-header h2 { color: var(--color-text); font-size: 0.9rem; margin: 0; font-weight: 700; }
      .ss-sub { color: var(--color-text-muted); font-size: 0.55rem; margin: 0; }
      .ss-error { padding: 4px 8px; background: rgba(255,107,107,0.1); border-radius: 4px; color: var(--color-error-text); font-size: 0.58rem; margin-bottom: 4px; cursor: pointer; }
      .ss-msg { padding: 4px 8px; background: rgba(99,102,241,0.08); border-radius: 4px; color: #6366f1; font-size: 0.58rem; margin-bottom: 4px; }

      .ss-tabs { display: flex; gap: 1px; margin-bottom: 6px; flex-shrink: 0; border-bottom: 1px solid var(--color-border); padding-bottom: 3px; }
      .ss-tab { display: flex; align-items: center; gap: 3px; padding: 4px 10px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--color-text-muted); cursor: pointer; font-size: 0.6rem; font-weight: 500; }
      .ss-tab:hover { color: var(--color-text); }
      .ss-tab.active { color: #6366f1; border-bottom-color: #6366f1; }

      .ss-content { flex: 1; overflow-y: auto; min-height: 0; }
      .ss-card { padding: 10px 12px; background: var(--color-panel); border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 6px; }
      .ss-card h4 { font-size: 0.66rem; font-weight: 600; color: var(--color-text); margin: 0 0 6px 0; }
      .ss-card-text { font-size: 0.58rem; color: var(--color-text-muted); line-height: 1.5; margin: 0 0 8px 0; }

      .ss-search-row { display: flex; gap: 5px; margin-bottom: 8px; }
      .ss-input { flex: 1; padding: 6px 10px; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-panel); color: var(--color-text); font-size: 0.66rem; box-sizing: border-box; }
      .ss-input:focus { outline: none; border-color: #6366f1; }
      .ss-input::placeholder { color: var(--color-text-muted); font-size: 0.6rem; }
      .ss-btn-primary { display: flex; align-items: center; gap: 3px; padding: 6px 10px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.64rem; font-weight: 600; white-space: nowrap; }
      .ss-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .ss-btn-primary .material-symbols-outlined { font-size: 16px; }

      .ss-loading { display: flex; align-items: center; gap: 5px; font-size: 0.6rem; color: var(--color-text-muted); margin: 8px 0; }
      .loading-spinner { width: 12px; height: 12px; border: 2px solid var(--color-border); border-top: 2px solid #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .ss-results h4 { font-size: 0.62rem; font-weight: 600; color: var(--color-text); margin: 0 0 4px 0; }
      .ss-result-card { padding: 8px 10px; background: var(--color-panel); border: 1px solid var(--color-border); border-left: 3px solid #6366f1; border-radius: 6px; margin-bottom: 4px; }
      .ss-result-title { font-size: 0.64rem; font-weight: 600; color: var(--color-text); margin-bottom: 3px; }
      .ss-result-snippet { font-size: 0.58rem; color: var(--color-text-muted); line-height: 1.4; }
      .ss-result-meta { display: flex; gap: 8px; margin-top: 4px; font-size: 0.52rem; color: var(--color-text-muted); }
      .ss-result-score { color: #6366f1; font-weight: 600; }

      .ss-textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-background); color: var(--color-text); font-size: 0.62rem; resize: vertical; min-height: 60px; box-sizing: border-box; font-family: inherit; }
      .ss-textarea:focus { outline: none; border-color: #6366f1; }
      .ss-podcast-row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .ss-select { padding: 5px 8px; border: 1px solid var(--color-border); border-radius: 5px; background: var(--color-panel); color: var(--color-text); font-size: 0.6rem; }
    </style>
  </div>
</body>
</html>
