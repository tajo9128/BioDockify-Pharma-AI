<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("qsar3dModal", {
      activeTab: "build",
      mode: "3d",
      smiles: "",
      activity: "",
      name: "3D-QSAR Model",
      gridSpacing: 2.0,
      gridMargin: 5.0,
      fieldTypes: ["steric", "electrostatic"],
      testFraction: 0.2,
      result: null,
      models: [],
      loading: false,
      error: "",
      predictModelId: "",
      predictSmiles: "",
      predictResult: null,

      // ML Compare
      mlSmiles: "",
      mlActivity: "",
      mlFeatureType: "fingerprint",
      mlTestFraction: 0.2,
      mlResult: null,

      async build() {
        if (!this.smiles || !this.activity) return;
        this.loading = true;
        this.error = "";
        try {
          const smilesList = this.smiles.split("\n").map(s => s.trim()).filter(s => s);
          const activityList = this.activity.split("\n").map(a => parseFloat(a.trim())).filter(a => !isNaN(a));
          
          if (smilesList.length !== activityList.length) {
            this.error = "SMILES and activity lists must have equal length";
            return;
          }
          
          const r = await callJsonApi("qsar3d", {
            action: "build",
            smiles: smilesList,
            activity: activityList,
            name: this.name,
            mode: this.mode,
            grid_spacing: this.gridSpacing,
            grid_margin: this.gridMargin,
            field_types: this.fieldTypes,
            test_fraction: this.testFraction,
          });
          
          if (!r.status || r.status !== "ok") {
            this.error = r.error || "Build failed";
          } else {
            this.result = r;
            await this.loadModels();
          }
        } catch (e) {
          this.error = e.message;
        }
        this.loading = false;
      },

      async predict() {
        if (!this.predictModelId || !this.predictSmiles) return;
        this.loading = true;
        this.error = "";
        try {
          const smilesList = this.predictSmiles.split("\n").map(s => s.trim()).filter(s => s);
          const r = await callJsonApi("qsar3d", {
            action: "predict",
            model_id: this.predictModelId,
            smiles: smilesList,
          });
          
          if (!r.status || r.status !== "ok") {
            this.error = r.error || "Prediction failed";
          } else {
            this.predictResult = r;
          }
        } catch (e) {
          this.error = e.message;
        }
        this.loading = false;
      },

      async loadModels() {
        try {
          const r = await callJsonApi("qsar3d", { action: "models" });
          if (r.status === "ok") {
            this.models = r.models || [];
          }
        } catch (e) {
          console.error("Failed to load models:", e);
        }
      },

      async deleteModel(modelId) {
        try {
          await callJsonApi("qsar3d", { action: "delete", model_id: modelId });
          await this.loadModels();
        } catch (e) {
          this.error = e.message;
        }
      },

      async info() {
        try {
          const r = await callJsonApi("qsar3d", { action: "info" });
          return r;
        } catch (e) {
          return null;
        }
      },

      async mlCompare() {
        if (!this.mlSmiles || !this.mlActivity) return;
        this.loading = true; this.error = ""; this.mlResult = null;
        try {
          const smilesList = this.mlSmiles.split("\n").map(s => s.trim()).filter(s => s);
          const activityList = this.mlActivity.split("\n").map(a => parseFloat(a.trim())).filter(a => !isNaN(a));
          if (smilesList.length !== activityList.length) {
            this.error = "SMILES and activity lists must have equal length"; this.loading = false; return;
          }
          const r = await callJsonApi("qsar3d", {
            action: "ml_compare",
            smiles: smilesList, activity: activityList,
            feature_type: this.mlFeatureType,
            test_fraction: this.mlTestFraction,
          });
          if (!r.status || r.status !== "ok") { this.error = r.error || "ML comparison failed"; }
          else { this.mlResult = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },

      init() {
        this.loadModels();
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel" x-init="$store.qsar3dModal.init()">
    <div class="panel-header">
      <div class="header-left">
        <span class="material-symbols-outlined header-icon">science</span>
        <div>
          <h2>3D-QSAR Modeler</h2>
          <p class="header-subtitle">Open3DQSAR + Py-CoMFA engine</p>
        </div>
      </div>
    </div>
    <div class="panel-body">
      <!-- Error display -->
      <div x-show="$store.qsar3dModal.error" class="dock-error" x-text="$store.qsar3dModal.error"></div>
      
      <!-- Tabs -->
      <div class="tabs">
        <button :class="{'active': $store.qsar3dModal.activeTab === 'build'}" @click="$store.qsar3dModal.activeTab = 'build'">Build Model</button>
        <button :class="{'active': $store.qsar3dModal.activeTab === 'ml_compare'}" @click="$store.qsar3dModal.activeTab = 'ml_compare'">ML Compare</button>
        <button :class="{'active': $store.qsar3dModal.activeTab === 'predict'}" @click="$store.qsar3dModal.activeTab = 'predict'">Predict</button>
        <button :class="{'active': $store.qsar3dModal.activeTab === 'models'}" @click="$store.qsar3dModal.activeTab = 'models'">Models</button>
      </div>
      
      <!-- Build Tab -->
      <div x-show="$store.qsar3dModal.activeTab === 'build'">
        <div class="input-group">
          <label>Mode:</label>
          <select x-model="$store.qsar3dModal.mode" class="mt-input">
            <option value="3d">3D-QSAR (MIF-based)</option>
            <option value="2d">2D-QSAR (Descriptors)</option>
          </select>
        </div>
        
        <div class="input-group">
          <label>Model Name:</label>
          <input type="text" x-model="$store.qsar3dModal.name" class="mt-input" />
        </div>
        
        <div class="input-group">
          <label>SMILES (one per line):</label>
          <textarea x-model="$store.qsar3dModal.smiles" class="mt-input" rows="6" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O&#10;CC12CCC3C(CCC4CC(=O)CCC34C)C1CCC2O&#10;..."></textarea>
        </div>
        
        <div class="input-group">
          <label>Activity values (one per line):</label>
          <textarea x-model="$store.qsar3dModal.activity" class="mt-input" rows="6" placeholder="7.2&#10;8.5&#10;6.1&#10;..."></textarea>
        </div>
        
        <div class="input-row">
          <div class="input-group">
            <label>Test Fraction:</label>
            <input type="number" x-model.number="$store.qsar3dModal.testFraction" class="mt-input" step="0.1" min="0.1" max="0.5" />
          </div>
          <div class="input-group" x-show="$store.qsar3dModal.mode === '3d'">
            <label>Grid Spacing:</label>
            <input type="number" x-model.number="$store.qsar3dModal.gridSpacing" class="mt-input" step="0.5" min="1.0" max="4.0" />
          </div>
        </div>
        
        <button class="btn-run" @click="$store.qsar3dModal.build()" :disabled="$store.qsar3dModal.loading || !$store.qsar3dModal.smiles || !$store.qsar3dModal.activity">
          <span x-show="$store.qsar3dModal.loading" class="loading-spinner"></span>
          Build Model
        </button>
        
        <!-- Build Result -->
        <template x-if="$store.qsar3dModal.result">
          <div class="result-card">
            <h3>Model Built Successfully</h3>
            <div class="stats-grid">
              <div class="stat"><div class="stat-label">R²</div><div class="stat-value" x-text="$store.qsar3dModal.result.r2?.toFixed(4)"></div></div>
              <div class="stat"><div class="stat-label">Q²</div><div class="stat-value" x-text="$store.qsar3dModal.result.q2?.toFixed(4)"></div></div>
              <div class="stat"><div class="stat-label">R² Pred</div><div class="stat-value" x-text="$store.qsar3dModal.result.r2_pred?.toFixed(4)"></div></div>
              <div class="stat"><div class="stat-label">Components</div><div class="stat-value" x-text="$store.qsar3dModal.result.n_components"></div></div>
              <div class="stat"><div class="stat-label">Molecules</div><div class="stat-value" x-text="$store.qsar3dModal.result.n_molecules"></div></div>
              <div class="stat"><div class="stat-label">Model ID</div><div class="stat-value" x-text="$store.qsar3dModal.result.model_id"></div></div>
            </div>
          </div>
        </template>
      </div>

      <!-- ML Compare Tab -->
      <div x-show="$store.qsar3dModal.activeTab === 'ml_compare'">
        <div class="input-group">
          <label>SMILES (one per line, ≥20):</label>
          <textarea x-model="$store.qsar3dModal.mlSmiles" class="mt-input" rows="5" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O&#10;CC(C)Cc1ccc(cc1)C(C)C(=O)O&#10;..."></textarea>
        </div>
        <div class="input-group">
          <label>Activity values (one per line):</label>
          <textarea x-model="$store.qsar3dModal.mlActivity" class="mt-input" rows="5" placeholder="6.5&#10;5.2&#10;7.1&#10;..."></textarea>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Features:</label>
            <select x-model="$store.qsar3dModal.mlFeatureType" class="mt-input">
              <option value="fingerprint">Morgan Fingerprint</option>
              <option value="descriptors">RDKit Descriptors (50+)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Test Fraction:</label>
            <input type="number" x-model.number="$store.qsar3dModal.mlTestFraction" class="mt-input" step="0.1" min="0.1" max="0.5" />
          </div>
        </div>
        <button class="btn-run" @click="$store.qsar3dModal.mlCompare()" :disabled="$store.qsar3dModal.loading || !$store.qsar3dModal.mlSmiles">
          <span x-show="$store.qsar3dModal.loading" class="loading-spinner"></span>
          Compare 20+ ML Models
        </button>
        <template x-if="$store.qsar3dModal.mlResult?.status === 'ok'">
          <div class="result-card">
            <h3>ML Model Comparison — <span x-text="$store.qsar3dModal.mlResult.n_models_tested"></span> models</h3>
            <div style="font-size:0.56rem;color:var(--color-text-muted);margin-bottom:8px">
              <span x-text="$store.qsar3dModal.mlResult.n_molecules"></span> molecules ·
              <span x-text="$store.qsar3dModal.mlResult.n_features"></span> features ·
              Type: <b x-text="$store.qsar3dModal.mlResult.feature_type"></b>
            </div>
            <!-- Comparison table -->
            <div style="max-height:300px;overflow-y:auto;margin-bottom:10px">
              <table style="width:100%;font-size:0.54rem;border-collapse:collapse">
                <thead><tr style="border-bottom:1px solid var(--color-border);text-align:left">
                  <th style="padding:4px">Model</th><th style="padding:4px">R²</th><th style="padding:4px">RMSE</th><th style="padding:4px">MAE</th>
                </tr></thead>
                <tbody>
                  <template x-for="r in $store.qsar3dModal.mlResult.comparison" :key="r.model">
                    <tr style="border-bottom:1px solid var(--color-border)">
                      <td style="padding:4px" x-text="r.model"></td>
                      <td style="padding:4px" x-text="r.r2?.toFixed(4)"></td>
                      <td style="padding:4px" x-text="r.rmse?.toFixed(4)"></td>
                      <td style="padding:4px" x-text="r.mae?.toFixed(4)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <!-- Best model highlight -->
            <div x-show="$store.qsar3dModal.mlResult.message" style="padding:6px;background:rgba(34,197,94,0.1);border-radius:4px;font-size:0.56rem;color:#22c55e" x-text="$store.qsar3dModal.mlResult.message"></div>
            <!-- Feature importance -->
            <div x-show="$store.qsar3dModal.mlResult.feature_importance?.length" style="margin-top:10px">
              <h4>Top Feature Importance</h4>
              <template x-for="f in $store.qsar3dModal.mlResult.feature_importance" :key="f.feature">
                <div style="display:flex;justify-content:space-between;font-size:0.52rem;padding:2px 0;border-bottom:1px solid var(--color-border)">
                  <span x-text="f.feature"></span>
                  <span x-text="f.importance?.toFixed(4)"></span>
                </div>
              </template>
            </div>
            <!-- EDA / Actual vs Predicted plots -->
            <div x-show="$store.qsar3dModal.mlResult.model_comparison_chart" style="margin-top:10px;text-align:center">
              <img :src="'data:image/png;base64,' + $store.qsar3dModal.mlResult.model_comparison_chart" style="max-width:100%;border-radius:8px" />
            </div>
          </div>
        </template>
      </div>

      <!-- Predict Tab -->
      <div x-show="$store.qsar3dModal.activeTab === 'predict'">
        <div class="input-group">
          <label>Select Model:</label>
          <select x-model="$store.qsar3dModal.predictModelId" class="mt-input">
            <option value="">-- Select a model --</option>
            <template x-for="model in $store.qsar3dModal.models" :key="model.model_id">
              <option :value="model.model_id" x-text="model.name + ' (' + model.mode + ')'"></option>
            </template>
          </select>
        </div>
        
        <div class="input-group">
          <label>SMILES to predict (one per line):</label>
          <textarea x-model="$store.qsar3dModal.predictSmiles" class="mt-input" rows="6" placeholder="CC(=O)OC1=CC=CC=C1C(=O)O&#10;..."></textarea>
        </div>
        
        <button class="btn-run" @click="$store.qsar3dModal.predict()" :disabled="$store.qsar3dModal.loading || !$store.qsar3dModal.predictModelId || !$store.qsar3dModal.predictSmiles">
          <span x-show="$store.qsar3dModal.loading" class="loading-spinner"></span>
          Predict
        </button>
        
        <!-- Predict Result -->
        <template x-if="$store.qsar3dModal.predictResult">
          <div class="result-card">
            <h3>Predictions</h3>
            <div class="predictions-table">
              <table>
                <thead>
                  <tr>
                    <th>SMILES</th>
                    <th>Predicted Activity</th>
                    <th>Confidence</th>
                    <th>AD Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(pred, index) in $store.qsar3dModal.predictResult.predictions" :key="index">
                    <tr>
                      <td class="smiles-cell" x-text="$store.qsar3dModal.predictSmiles.split('\n')[index]?.trim()"></td>
                      <td x-text="pred?.toFixed(4)"></td>
                      <td x-text="$store.qsar3dModal.predictResult.confidence?.[index]?.toFixed(4)"></td>
                      <td :class="{'ad-in': $store.qsar3dModal.predictResult.applicability_domain?.[index] >= 0.5, 'ad-out': $store.qsar3dModal.predictResult.applicability_domain?.[index] < 0.5}" x-text="$store.qsar3dModal.predictResult.applicability_domain?.[index] >= 0.5 ? 'Inside AD' : 'Outside AD'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>
      
      <!-- Models Tab -->
      <div x-show="$store.qsar3dModal.activeTab === 'models'">
        <div x-show="$store.qsar3dModal.models.length === 0" class="empty-state">
          No models built yet. Go to the Build tab to create a model.
        </div>
        
        <div class="models-list">
          <template x-for="model in $store.qsar3dModal.models" :key="model.model_id">
            <div class="model-card">
              <div class="model-info">
                <div class="model-name" x-text="model.name"></div>
                <div class="model-details">
                  <span class="badge" x-text="model.mode"></span>
                  <span class="stat">R²: <strong x-text="model.r2?.toFixed(4)"></strong></span>
                  <span class="stat">Q²: <strong x-text="model.q2?.toFixed(4)"></strong></span>
                  <span class="stat">Molecules: <strong x-text="model.n_molecules"></strong></span>
                </div>
                <div class="model-date" x-text="new Date(model.created_at).toLocaleDateString()"></div>
              </div>
              <button class="btn-delete" @click="$store.qsar3dModal.deleteModel(model.model_id)">Delete</button>
            </div>
          </template>
        </div>
      </div>
    </div>
    
    <style>
      .dock-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .panel-header { padding:14px 20px;border-bottom:1px solid var(--color-border);background:var(--color-panel) }
      .header-left { display:flex;align-items:center;gap:12px }
      .header-icon { font-size:28px;color:var(--color-primary) }
      .panel-header h2 { color:var(--color-text);font-size:1.05rem;margin:0;font-weight:700 }
      .header-subtitle { color:var(--color-text-muted);font-size:0.7rem;margin:0 }
      .panel-body { flex:1;overflow-y:auto;padding:16px 20px }
      .dock-error { padding:8px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.68rem;margin-bottom:10px }
      .tabs { display:flex;gap:4px;margin-bottom:16px }
      .tabs button { flex:1;padding:8px 12px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);font-size:0.75rem;cursor:pointer;border-radius:6px }
      .tabs button.active { background:var(--color-primary);color:white;border-color:var(--color-primary) }
      .input-group { margin-bottom:12px }
      .input-group label { display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:4px }
      .mt-input { width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-panel);color:var(--color-text);font-size:0.7rem;font-family:monospace;box-sizing:border-box }
      .mt-input:focus { outline:none;border-color:var(--color-primary) }
      .input-row { display:flex;gap:12px }
      .input-row .input-group { flex:1 }
      .btn-run { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:10px;background:var(--color-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-size:0.8rem;font-weight:600 }
      .btn-run:disabled { opacity:0.5;cursor:not-allowed }
      .loading-spinner { width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top:2px solid white;border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .result-card { margin-top:16px;padding:16px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px }
      .result-card h3 { margin:0 0 12px 0;font-size:0.9rem;color:var(--color-text) }
      .stats-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:8px }
      .stat { text-align:center;padding:8px;background:rgba(34,197,94,0.05);border-radius:6px }
      .stat-label { font-size:0.65rem;color:var(--color-text-muted);font-weight:600 }
      .stat-value { font-size:0.85rem;font-weight:700;color:#22c55e;margin-top:2px }
      .predictions-table { overflow-x:auto }
      .predictions-table table { width:100%;border-collapse:collapse;font-size:0.7rem }
      .predictions-table th, .predictions-table td { padding:8px;text-align:left;border-bottom:1px solid var(--color-border) }
      .predictions-table th { background:var(--color-panel);font-weight:600 }
      .smiles-cell { font-family:monospace;font-size:0.65rem;max-width:200px;overflow:hidden;text-overflow:ellipsis }
      .ad-in { color:#22c55e;font-weight:600 }
      .ad-out { color:#ff6b6b;font-weight:600 }
      .empty-state { text-align:center;padding:40px;color:var(--color-text-muted);font-size:0.8rem }
      .models-list { display:flex;flex-direction:column;gap:8px }
      .model-card { display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px }
      .model-info { flex:1 }
      .model-name { font-weight:700;font-size:0.85rem;color:var(--color-text) }
      .model-details { display:flex;gap:12px;margin-top:4px;font-size:0.7rem;color:var(--color-text-muted) }
      .model-details .badge { background:var(--color-primary);color:white;padding:2px 8px;border-radius:4px;font-size:0.65rem }
      .model-details .stat { font-size:0.7rem }
      .model-date { font-size:0.65rem;color:var(--color-text-muted);margin-top:4px }
      .btn-delete { padding:6px 12px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;cursor:pointer;font-size:0.7rem }
      .btn-delete:hover { background:rgba(255,107,107,0.2) }
    </style>
  </div>
</body>
</html>
