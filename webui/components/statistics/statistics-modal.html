<html>
<head>
  <script type="module" src="/components/statistics/statistics-store.js"></script>
</head>
<body>
  <div x-data="statisticsModal" class="sp" x-init="restore">
    <!-- Header -->
    <div class="sh">
      <span class="material-symbols-outlined" style="font-size:22px;color:var(--color-primary)">analytics</span>
      <div><h2>Statistical Analysis</h2><p style="font-size:0.55rem;color:var(--color-text-muted);margin:0">Upload · AI Analyzes · AI Performs Test · Results</p></div>
      <div class="ss">
        <span class="sstep" :class="{on:step>=1}"><b>1</b><small>Upload</small></span>
        <span class="sbar" :class="{on:step>=2}"></span>
        <span class="sstep" :class="{on:step>=2}"><b>2</b><small>Choose Test</small></span>
        <span class="sbar" :class="{on:step>=3}"></span>
        <span class="sstep" :class="{on:step>=3}"><b>3</b><small>Results</small></span>
      </div>
    </div>

    <div x-show="errorMessage" class="se" x-text="errorMessage" @click="errorMessage=''" style="cursor:pointer"></div>

    <!-- ===== STEP 1: Upload ===== -->
    <div x-show="step === 1" class="sb">
      <div class="su" @click="openFilePicker()" @dragover.prevent @drop.prevent="handleDrop($event)">
        <span class="material-symbols-outlined" style="font-size:44px;color:var(--color-primary);opacity:0.7">cloud_upload</span>
        <p style="color:var(--color-text);font-weight:600;margin:10px 0 4px;font-size:0.95rem">Drop file or click to browse</p>
        <p style="color:var(--color-text-muted);font-size:0.72rem">CSV, Excel, JSON — AI will analyze and recommend tests</p>
        <div style="display:flex;gap:6px;margin-top:8px">
          <span class="sb">CSV</span><span class="sb">Excel</span><span class="sb">JSON</span>
        </div>
      </div>
      <div x-show="loading" style="text-align:center;padding:12px;color:var(--color-text-muted);font-size:0.64rem">
        <span class="spin"></span> Analyzing file...
      </div>
    </div>

    <!-- ===== STEP 2: Choose Test & AI Recommendation ===== -->
    <div x-show="step === 2" class="sb">
      <!-- Data summary from AI -->
      <div class="sc">
        <span class="material-symbols-outlined" style="font-size:16px;color:#22c55e">check_circle</span>
        <b x-text="fileName" style="font-size:0.72rem"></b>
        <span style="color:var(--color-text-muted);font-size:0.64rem" x-text="'(' + rowCount + ' rows, ' + columns.length + ' cols)'"></span>
        <button class="sl" @click="resetData()">Change</button>
      </div>

      <template x-if="summary">
        <div>
          <!-- AI Recommendations -->
          <div class="sr" x-show="summary?.recommended_test">
            <span class="material-symbols-outlined" style="font-size:16px;color:#6366f1">psychology</span>
            <div>
              <b style="font-size:0.62rem;color:#6366f1">AI Recommendation</b>
              <p style="font-size:0.56rem;color:var(--color-text-muted);margin:2px 0 0" x-text="summary.recommendation_text || 'Based on data structure'"></p>
            </div>
          </div>

          <!-- Column info -->
          <div style="font-size:0.54rem;color:var(--color-text-muted);margin:8px 0 6px">
            <span x-text="'Numeric: ' + (summary.data_summary?.numeric_columns || []).join(', ') || 'none'"></span>
            <span x-show="summary.data_summary?.group_columns?.length" style="margin-left:10px" x-text="' | Groups: ' + (summary.data_summary?.group_columns || []).join(', ')"></span>
            <span x-show="summary.data_summary?.categorical_columns?.length" style="margin-left:10px" x-text="' | Categorical: ' + (summary.data_summary?.categorical_columns || []).join(', ')"></span>
          </div>

          <!-- Test selector -->
          <h3 style="font-size:0.68rem;font-weight:700;color:var(--color-text);margin:0 0 6px">Select Statistical Test</h3>
          <div class="stg">
            <button class="stc" :class="{on:testType==='ttest'}" @click="testType='ttest'">
              <span class="material-symbols-outlined">compare_arrows</span>
              <span>T-Test</span><small>Compare 2 groups</small>
            </button>
            <button class="stc" :class="{on:testType==='anova'}" @click="testType='anova'">
              <span class="material-symbols-outlined">grid_view</span>
              <span>ANOVA</span><small>Compare 3+ groups</small>
            </button>
            <button class="stc" :class="{on:testType==='correlation'}" @click="testType='correlation'">
              <span class="material-symbols-outlined">show_chart</span>
              <span>Correlation</span><small>Relationships</small>
            </button>
            <button class="stc" :class="{on:testType==='descriptive'}" @click="testType='descriptive'">
              <span class="material-symbols-outlined">functions</span>
              <span>Descriptive</span><small>Summary stats</small>
            </button>
            <button class="stc" :class="{on:testType==='chisquare'}" @click="testType='chisquare'">
              <span class="material-symbols-outlined">table_chart</span>
              <span>Chi-Square</span><small>Categorical</small>
            </button>
            <button class="stc" :class="{on:testType==='mannwhitney'}" @click="testType='mannwhitney'">
              <span class="material-symbols-outlined">sort</span>
              <span>Mann-Whitney</span><small>Non-parametric</small>
            </button>
            <button class="stc" :class="{on:testType==='normality'}" @click="testType='normality'">
              <span class="material-symbols-outlined">bar_chart</span>
              <span>Normality</span><small>Distribution check</small>
            </button>
            <button class="stc" :class="{on:testType==='survival'}" @click="testType='survival'">
              <span class="material-symbols-outlined">timeline</span>
              <span>Survival</span><small>Time-to-event</small>
            </button>
            <button class="stc" :class="{on:testType==='regression'}" @click="testType='regression'">
              <span class="material-symbols-outlined">trending_up</span>
              <span>Regression</span><small>Prediction</small>
            </button>
            <button class="stc" :class="{on:testType==='roc'}" @click="testType='roc'">
              <span class="material-symbols-outlined">troubleshoot</span>
              <span>ROC/AUC</span><small>Diagnostic</small>
            </button>
            <button class="stc" :class="{on:testType==='factor'}" @click="testType='factor'">
              <span class="material-symbols-outlined">account_tree</span>
              <span>PCA</span><small>Dimension reduce</small>
            </button>
            <button class="stc" :class="{on:testType==='cluster'}" @click="testType='cluster'">
              <span class="material-symbols-outlined">bubble_chart</span>
              <span>Cluster</span><small>Grouping</small>
            </button>
          </div>

          <!-- Run button -->
          <button class="sr1" @click="runSelectedTest()" :disabled="loading || !testType" x-text="loading ? 'Running...' : 'Run Analysis'"></button>
          <div x-show="loading" style="text-align:center;padding:8px;color:var(--color-text-muted);font-size:0.6rem"><span class="spin"></span> AI analyzing and performing test...</div>
        </div>
      </template>
    </div>

    <!-- ===== STEP 3: Results ===== -->
    <div x-show="step === 3 && result" class="sb">
      <div class="sc">
        <span class="material-symbols-outlined" style="font-size:16px;color:#22c55e">check_circle</span>
        <b x-text="result?.test_name || testType"></b>
        <span x-show="result?.sub_type" style="font-size:0.55rem;padding:1px 6px;background:color-mix(in srgb,var(--color-primary)15%,transparent);border-radius:8px;color:var(--color-primary);font-weight:600" x-text="result.sub_type"></span>
        <button class="sl" style="margin-left:auto" @click="goBack()">Back</button>
        <button class="sl" @click="resetData()">New</button>
        <button style="padding:3px 8px;background:var(--color-primary);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.56rem;font-weight:600" @click="downloadJSON()">JSON</button>
        <button style="padding:3px 8px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.56rem;font-weight:600" @click="saveToKB()">Save</button>
      </div>

      <!-- Metric summary -->
      <template x-if="result?.metrics">
        <div class="sm">
          <template x-for="(v,k) in result.metrics" :key="k">
            <div class="sm1">
              <small class="sml" x-text="k"></small>
              <span class="smv" x-text="typeof v==='number'?v.toFixed(4):v"></span>
            </div>
          </template>
        </div>
      </template>

      <!-- Group comparison -->
      <template x-if="result?.groups?.length">
        <div class="sc1">
          <h4>Group Comparison</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
            <template x-for="g in result.groups" :key="g.name">
              <div style="flex:1;min-width:80px;padding:8px;background:var(--color-background);border:1px solid var(--color-border);border-radius:6px;text-align:center">
                <div style="font-size:0.6rem;font-weight:600;color:var(--color-text)" x-text="g.name"></div>
                <div style="font-size:0.72rem;font-weight:700;color:var(--color-primary)" x-text="g.mean?.toFixed(2)"></div>
                <div style="font-size:0.48rem;color:var(--color-text-muted)" x-text="'n='+g.n"></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Correlation matrix -->
      <template x-if="result?.correlation?.matrix">
        <div class="sc1">
          <h4>Correlation Matrix</h4>
          <div style="overflow-x:auto;font-size:0.52rem">
            <table style="width:100%;border-collapse:collapse">
              <tr><th></th><template x-for="c in result.correlation.columns" :key="c"><th style="padding:2px 5px;text-align:left;color:var(--color-text-muted)" x-text="c"></th></template></tr>
              <template x-for="(row,ri) in result.correlation.matrix" :key="ri">
                <tr><td style="font-weight:600;color:var(--color-primary);padding:2px 5px" x-text="result.correlation.columns[ri]"></td>
                  <template x-for="v in row"><td style="padding:2px 5px" :style="{color:Math.abs(v)>0.7?'var(--color-primary)':'var(--color-text)',fontWeight:Math.abs(v)>0.7?'700':'400'}" x-text="v?.toFixed(2)"></td></template>
                </tr>
              </template>
            </table>
          </div>
        </div>
      </template>

      <!-- Step-by-step explanation -->
      <template x-if="result?.explanations?.length">
        <div class="sc1" style="background:color-mix(in srgb,var(--color-primary)4%,var(--color-panel));border-color:color-mix(in srgb,var(--color-primary)18%,var(--color-border))">
          <h4 style="color:var(--color-primary)">How AI Analyzed Your Data</h4>
          <template x-for="exp in result.explanations" :key="exp.step">
            <div style="margin-bottom:7px;border-left:2px solid color-mix(in srgb,var(--color-primary)35%,var(--color-border));padding-left:9px">
              <div style="font-size:0.56rem;font-weight:700;color:var(--color-primary);margin-bottom:1px" x-text="'Step '+exp.step+': '+exp.title"></div>
              <div style="font-size:0.52rem;color:var(--color-text-muted);line-height:1.4" x-text="exp.detail"></div>
              <template x-if="exp.findings?.length">
                <div style="margin-top:2px">
                  <template x-for="f in exp.findings"><div style="font-size:0.5rem;color:var(--color-text);padding:1px 5px;margin:1px 0;background:var(--color-background);border-radius:3px" x-text="'• '+f"></div></template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <style>
      .sp{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background)}
      .sh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--color-border);flex-shrink:0}
      .sh h2{font-size:0.85rem;margin:0;font-weight:700;color:var(--color-text)}
      .ss{display:flex;align-items:center;gap:3px;margin-left:auto}
      .sstep{display:flex;align-items:center;gap:3px;font-size:0.6rem;color:var(--color-border);opacity:0.35}
      .sstep b{font-size:0.62rem}
      .sstep.on{color:var(--color-primary);opacity:1}
      .sstep small{font-weight:400;font-size:0.5rem}
      .sbar{width:14px;height:2px;background:var(--color-border)}
      .sbar.on{background:var(--color-primary)}
      .se{padding:5px 12px;margin:6px 14px 0;background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.2);border-radius:5px;color:var(--color-error-text);font-size:0.58rem}
      .sb{flex:1;overflow-y:auto;padding:14px}
      .su{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;border:2px dashed var(--color-border);border-radius:12px;cursor:pointer;transition:.15s;background:var(--color-panel)}
      .su:hover{border-color:var(--color-primary)}
      .sb{display:inline-flex;padding:2px 8px;background:var(--color-background);border:1px solid var(--color-border);border-radius:5px;font-size:0.6rem;color:var(--color-text-muted);font-weight:600}
      .sc{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:7px;margin-bottom:10px;flex-wrap:wrap;font-size:0.68rem}
      .sc h4{font-size:0.62rem;font-weight:700;color:var(--color-text);margin:0 0 5px}
      .sc1{padding:9px 11px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:7px;margin-bottom:6px}
      .sl{padding:2px 7px;background:transparent;border:1px solid var(--color-border);border-radius:4px;color:var(--color-text-muted);cursor:pointer;font-size:0.54rem}
      .sl:hover{border-color:var(--color-primary);color:var(--color-primary)}
      .sr{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:7px;margin-bottom:10px}
      .stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:5px;margin-bottom:10px}
      .stc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 5px;background:var(--color-panel);border:2px solid var(--color-border);border-radius:8px;cursor:pointer;transition:.12s;text-align:center}
      .stc:hover{border-color:var(--color-primary)}
      .stc.on{border-color:var(--color-primary);background:color-mix(in srgb,var(--color-primary)8%,var(--color-panel))}
      .stc .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
      .stc span{font-size:0.62rem;font-weight:700;color:var(--color-text)}
      .stc small{font-size:0.5rem;color:var(--color-text-muted)}
      .sr1{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;background:var(--color-primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.72rem;font-weight:600;transition:.15s}
      .sr1:hover:not(:disabled){opacity:.9}
      .sr1:disabled{opacity:.4;cursor:default}
      .sm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
      .sm1{display:flex;flex-direction:column;align-items:center;padding:6px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:6px;min-width:55px}
      .sml{font-size:0.46rem;color:var(--color-text-muted);text-transform:uppercase}
      .smv{font-size:0.72rem;font-weight:700;color:var(--color-primary)}
      .spin{width:12px;height:12px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-right:4px;vertical-align:middle}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </div>
</body>
</html>
