<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("reactionLab", {
      activeTab: "forward",
      loading: false,
      error: "",
      message: "",
      reactions: [],

      // forward
      reaction: "Amide Coupling",
      reactantsText: "CC(=O)O\nCCN",
      customSmarts: "",
      forwardResult: null,

      // enumerate
      blocksText: "CC(=O)O, OC(=O)c1ccccc1\nCCN, NCC",
      enumResult: null,

      // atom map
      mapReactantsText: "CC(=O)O\nCCN",
      mapProduct: "CC(=O)NCC",
      mapResult: null,

      // impurities
      impSmiles: "CC(=O)Oc1ccccc1C(=O)O",
      impResult: null,

      // conditions
      condReactantsText: "CC(=O)O\nCCN",
      condResult: null,

      flash(msg) { this.message = msg; setTimeout(() => this.message = "", 2500); },
      lines(t) { return t.split(/[\n;]+/).map(s => s.trim()).filter(Boolean); },

      async loadReactions() {
        if (this.reactions.length) return;
        try {
          const r = await callJsonApi("reaction_lab", { action: "reactions" });
          this.reactions = r.reactions || [];
        } catch {}
      },

      async runForward() {
        const reactants = this.lines(this.reactantsText);
        if (!reactants.length) { this.error = "Enter reactant SMILES (one per line)"; return; }
        this.loading = true; this.error = "";
        try {
          const payload = { action: "forward", reaction: this.reaction, reactants };
          if (this.customSmarts.trim()) payload.reaction_smarts = this.customSmarts.trim();
          const r = await callJsonApi("reaction_lab", payload);
          if (r.error) { this.error = r.error; return; }
          this.forwardResult = r;
          this.flash(r.num_products ? `${r.num_products} product(s) formed` : "No products — check pattern match");
        } finally { this.loading = false; }
      },

      async enumerate() {
        const sets = this.blocksText.split("\n").filter(Boolean)
          .map(line => line.split(",").map(s => s.trim()).filter(Boolean));
        if (sets.length < 1) { this.error = "Enter building blocks (comma-separated per slot, one line per slot)"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("reaction_lab", { action: "enumerate", reaction: this.reaction, building_block_sets: sets });
          if (r.error) { this.error = r.error; return; }
          this.enumResult = r;
          this.flash(`${r.num_products} unique products from ${r.num_combinations} combinations`);
        } finally { this.loading = false; }
      },

      async mapAtoms() {
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("reaction_lab", { action: "atom_map", reactants: this.lines(this.mapReactantsText), product: this.mapProduct.trim() });
          if (r.error) { this.error = r.error; return; }
          this.mapResult = r;
        } finally { this.loading = false; }
      },

      async impurities() {
        if (!this.impSmiles.trim()) { this.error = "Enter SMILES"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("reaction_lab", { action: "impurities", smiles: this.impSmiles.trim() });
          if (r.error) { this.error = r.error; return; }
          this.impResult = r;
          this.flash(`${r.num_findings} degradation risks · ${r.risk_level} risk`);
        } finally { this.loading = false; }
      },

      async conditions() {
        const reactants = this.lines(this.condReactantsText);
        if (!reactants.length) { this.error = "Enter reactant SMILES"; return; }
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("reaction_lab", { action: "conditions", reactants });
          if (r.error) { this.error = r.error; return; }
          this.condResult = r;
        } finally { this.loading = false; }
      },

      sendTo(pipeline) {
        const stores = {
          retro: () => { const r = Alpine.store("retroSyn"); if (r) { r.targetSmiles = pipeline; r.activeTab = "plan"; } },
          docking: () => { const mt = Alpine.store("molecularToolkit"); if (mt) { mt.dockingLigand = pipeline; } },
        };
        if (stores.retro) { stores.retro(); this.flash("Sent to Retrosynthesis"); }
      },
    });
  </script>
</head>
<body>
  <div x-data class="reaction-lab" x-init="$store.reactionLab.loadReactions()">
    <template x-if="$store.reactionLab">
      <div class="rl-root">
        <div class="rl-tabs">
          <button :class="{active: $store.reactionLab.activeTab==='forward'}" @click="$store.reactionLab.activeTab='forward'">Forward Reaction</button>
          <button :class="{active: $store.reactionLab.activeTab==='enum'}" @click="$store.reactionLab.activeTab='enum'">Library Enumerate</button>
          <button :class="{active: $store.reactionLab.activeTab==='map'}" @click="$store.reactionLab.activeTab='map'">Atom Mapping</button>
          <button :class="{active: $store.reactionLab.activeTab==='imp'}" @click="$store.reactionLab.activeTab='imp'">Impurity / Degradation</button>
          <button :class="{active: $store.reactionLab.activeTab==='cond'}" @click="$store.reactionLab.activeTab='cond'">Conditions</button>
          <span class="rl-msg" x-show="$store.reactionLab.message" x-text="$store.reactionLab.message"></span>
          <span class="rl-err" x-show="$store.reactionLab.error" x-text="$store.reactionLab.error"></span>
        </div>

        <!-- Forward -->
        <div class="rl-panel" x-show="$store.reactionLab.activeTab==='forward'">
          <div class="rl-row">
            <label>Reaction:</label>
            <select x-model="$store.reactionLab.reaction">
              <template x-for="r in $store.reactionLab.reactions" :key="r.name">
                <option :value="r.name" x-text="r.name"></option>
              </template>
            </select>
          </div>
          <textarea x-model="$store.reactionLab.reactantsText" rows="3" placeholder="Reactant SMILES — one per line"></textarea>
          <input x-model="$store.reactionLab.customSmarts" placeholder="Optional: custom reaction SMARTS (reactants>>product)">
          <button class="rl-btn" @click="$store.reactionLab.runForward()" :disabled="$store.reactionLab.loading">Run Reaction</button>
          <template x-if="$store.reactionLab.forwardResult">
            <div class="rl-block">
              <div class="rl-stats" x-show="$store.reactionLab.forwardResult.reagents">
                <span x-show="$store.reactionLab.forwardResult.reagents" x-text="'Reagents: ' + ($store.reactionLab.forwardResult.reagents || []).join(', ')"></span>
                <span x-show="$store.reactionLab.forwardResult.conditions" x-text="'Conditions: ' + $store.reactionLab.forwardResult.conditions"></span>
              </div>
              <table class="rl-table">
                <thead><tr><th>Product SMILES</th><th></th></tr></thead>
                <tbody>
                  <template x-for="p in $store.reactionLab.forwardResult.products" :key="p.smiles">
                    <tr>
                      <td><code x-text="p.smiles"></code></td>
                      <td><button class="rl-mini" @click="$store.reactionLab.sendTo(p.smiles)">→ Retro</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="rl-note" x-text="$store.reactionLab.forwardResult.note"></div>
            </div>
          </template>
        </div>

        <!-- Enumerate -->
        <div class="rl-panel" x-show="$store.reactionLab.activeTab==='enum'">
          <div class="rl-row">
            <label>Reaction:</label>
            <select x-model="$store.reactionLab.reaction">
              <template x-for="r in $store.reactionLab.reactions" :key="'e'+r.name">
                <option :value="r.name" x-text="r.name"></option>
              </template>
            </select>
          </div>
          <textarea x-model="$store.reactionLab.blocksText" rows="3" placeholder="Building blocks: comma-separated SMILES per slot, one line per reactant slot"></textarea>
          <button class="rl-btn" @click="$store.reactionLab.enumerate()" :disabled="$store.reactionLab.loading">Enumerate Library</button>
          <template x-if="$store.reactionLab.enumResult">
            <div class="rl-block">
              <div class="rl-stats">
                <span><b x-text="$store.reactionLab.enumResult.num_products"></b> unique products</span>
                <span x-text="$store.reactionLab.enumResult.num_combinations + ' combinations'"></span>
                <span x-show="$store.reactionLab.enumResult.reagents" x-text="'Reagents: ' + ($store.reactionLab.enumResult.reagents || []).join(', ')"></span>
              </div>
              <table class="rl-table">
                <thead><tr><th>Product</th><th>From</th></tr></thead>
                <tbody>
                  <template x-for="p in $store.reactionLab.enumResult.products.slice(0, 50)" :key="p.smiles">
                    <tr><td><code x-text="p.smiles"></code></td><td class="rl-muted" x-text="(p.from || []).join(' + ')"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>

        <!-- Atom map -->
        <div class="rl-panel" x-show="$store.reactionLab.activeTab==='map'">
          <textarea x-model="$store.reactionLab.mapReactantsText" rows="2" placeholder="Reactant SMILES — one per line"></textarea>
          <input x-model="$store.reactionLab.mapProduct" placeholder="Product SMILES">
          <button class="rl-btn" @click="$store.reactionLab.mapAtoms()" :disabled="$store.reactionLab.loading">Map Atoms</button>
          <template x-if="$store.reactionLab.mapResult">
            <div class="rl-block">
              <div class="rl-stats">
                <span>Conserved: <b x-text="$store.reactionLab.mapResult.total_conserved_atoms"></b> atoms</span>
                <span>Unaccounted: <b x-text="$store.reactionLab.mapResult.atoms_unaccounted"></b></span>
              </div>
              <template x-for="m in $store.reactionLab.mapResult.mappings" :key="m.reactant_index">
                <div class="rl-maprow">
                  <b x-text="m.reactant"></b>
                  <span x-text="m.conserved_atoms + ' / ' + m.reactant_atoms + ' atoms conserved (' + (m.conservation*100).toFixed(0) + '%)'"></span>
                </div>
              </template>
              <div class="rl-note" x-text="$store.reactionLab.mapResult.note"></div>
            </div>
          </template>
        </div>

        <!-- Impurities -->
        <div class="rl-panel" x-show="$store.reactionLab.activeTab==='imp'">
          <input x-model="$store.reactionLab.impSmiles" placeholder="Drug SMILES (e.g. aspirin)">
          <button class="rl-btn" @click="$store.reactionLab.impurities()" :disabled="$store.reactionLab.loading">Predict Impurities</button>
          <template x-if="$store.reactionLab.impResult">
            <div class="rl-block">
              <div class="rl-stats">
                <span>Risk: <b :class="'risk-' + $store.reactionLab.impResult.risk_level" x-text="$store.reactionLab.impResult.risk_level.toUpperCase()"></b></span>
                <span>score <b x-text="$store.reactionLab.impResult.degradation_risk_score"></b></span>
                <span><b x-text="$store.reactionLab.impResult.num_findings"></b> findings</span>
              </div>
              <table class="rl-table">
                <thead><tr><th>Impurity / Degradation</th><th>Condition</th><th>Sites</th><th>Predicted degradants</th></tr></thead>
                <tbody>
                  <template x-for="f in $store.reactionLab.impResult.findings" :key="f.impurity">
                    <tr>
                      <td x-text="f.impurity"></td>
                      <td class="rl-muted" x-text="f.condition"></td>
                      <td x-text="f.sites"></td>
                      <td><template x-for="d in f.predicted_degradants"><div><code x-text="d"></code></div></template></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="rl-note" x-text="$store.reactionLab.impResult.ich_context"></div>
            </div>
          </template>
        </div>

        <!-- Conditions -->
        <div class="rl-panel" x-show="$store.reactionLab.activeTab==='cond'">
          <textarea x-model="$store.reactionLab.condReactantsText" rows="2" placeholder="Reactant SMILES — one per line"></textarea>
          <button class="rl-btn" @click="$store.reactionLab.conditions()" :disabled="$store.reactionLab.loading">Recommend Conditions</button>
          <template x-if="$store.reactionLab.condResult">
            <div class="rl-block">
              <template x-for="m in $store.reactionLab.condResult.condition_matches" :key="m.reaction">
                <div class="rl-cond">
                  <b x-text="m.reaction"></b> <span class="rl-muted" x-text="'(' + m.detected + ')'"></span>
                  <div x-text="m.recommendation"></div>
                </div>
              </template>
              <template x-if="$store.reactionLab.condResult.productive_reactions.length">
                <div>
                  <label class="rl-lbl">Also productive (templates):</label>
                  <table class="rl-table">
                    <thead><tr><th>Reaction</th><th>Example product</th><th>Conditions</th></tr></thead>
                    <tbody>
                      <template x-for="p in $store.reactionLab.condResult.productive_reactions" :key="p.reaction">
                        <tr><td x-text="p.reaction"></td><td><code x-text="p.example_product"></code></td><td class="rl-muted" x-text="p.conditions"></td></tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
              <div class="rl-note" x-text="$store.reactionLab.condResult.note"></div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <style>
      .reaction-lab { height: 100%; overflow-y: auto; padding: 12px; }
      .rl-root { display: flex; flex-direction: column; gap: 10px; }
      .rl-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .rl-tabs button { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-panel); color: var(--color-text); cursor: pointer; font-size: 0.78rem; }
      .rl-tabs button.active { border-color: var(--color-primary); color: var(--color-primary); font-weight: 600; }
      .rl-msg { color: #2e7d32; font-size: 0.72rem; }
      .rl-err { color: #c62828; font-size: 0.72rem; }
      .rl-panel { display: flex; flex-direction: column; gap: 8px; }
      .rl-panel textarea, .rl-panel input { padding: 8px; border: 1px solid var(--color-border); border-radius: 8px; font-family: monospace; font-size: 0.72rem; background: var(--color-bg, #fff); color: var(--color-text); }
      .rl-panel textarea { resize: vertical; }
      .rl-btn { align-self: flex-start; padding: 7px 16px; border-radius: 8px; border: none; background: var(--color-primary); color: #fff; cursor: pointer; font-size: 0.78rem; }
      .rl-btn:disabled { opacity: 0.5; }
      .rl-row { display: flex; gap: 8px; align-items: center; font-size: 0.75rem; }
      .rl-row select { padding: 5px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg, #fff); color: var(--color-text); }
      .rl-table { border-collapse: collapse; font-size: 0.7rem; width: 100%; }
      .rl-table th { text-align: left; color: var(--color-text-muted); padding: 4px 8px; border-bottom: 1px solid var(--color-border); }
      .rl-table td { padding: 4px 8px; border-bottom: 1px dotted var(--color-border); vertical-align: top; }
      .rl-table code { font-size: 0.68rem; }
      .rl-note { color: var(--color-text-muted); font-size: 0.68rem; font-style: italic; }
      .rl-muted { color: var(--color-text-muted); font-size: 0.66rem; }
      .rl-block { border: 1px solid var(--color-border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .rl-stats { display: flex; gap: 14px; font-size: 0.74rem; flex-wrap: wrap; }
      .rl-maprow { display: flex; gap: 10px; font-size: 0.72rem; align-items: baseline; }
      .rl-cond { padding: 6px 0; border-bottom: 1px dotted var(--color-border); font-size: 0.74rem; }
      .rl-lbl { font-size: 0.65rem; text-transform: uppercase; color: var(--color-text-muted); }
      .rl-mini { font-size: 0.62rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: none; color: var(--color-primary); cursor: pointer; }
      .risk-high { color: #c62828; }
      .risk-moderate { color: #e65100; }
      .risk-low { color: #2e7d32; }
    </style>
  </div>
</body>
</html>
