<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";

    export const store = createStore("drugAnalysisModal", {
      smiles: "", result: null, loading: false, error: "",

      async check() {
        if (!this.smiles) return;
        this.loading = true; this.error = "";
        try {
          const r = await callJsonApi("drug_analysis", { action: "check", smiles: this.smiles.trim() });
          if (!r.success) { this.error = r.error; } else { this.result = r; }
        } catch (e) { this.error = e.message; }
        this.loading = false;
      },
    });
  </script>
</head>
<body>
  <div x-data class="dock-panel">
    <div class="panel-header"><div class="header-left"><span class="material-symbols-outlined header-icon">medication</span><div><h2>Advanced Drug Analysis</h2><p class="header-subtitle">PAINS · Brenk · NIH substructure filters</p></div></div></div>
    <div class="panel-body">
      <div x-show="$store.drugAnalysisModal.error" class="dock-error" x-text="$store.drugAnalysisModal.error"></div>
      <div class="mt-input-row">
        <input type="text" x-model="$store.drugAnalysisModal.smiles" placeholder="SMILES string" class="mt-input" @keyup.enter="$store.drugAnalysisModal.check()" />
        <button class="btn-run" @click="$store.drugAnalysisModal.check()" style="flex:none;width:auto;margin-top:0" :disabled="$store.drugAnalysisModal.loading || !$store.drugAnalysisModal.smiles">Check</button>
      </div>
      <div x-show="$store.drugAnalysisModal.loading" class="dock-loading"><div class="loading-spinner"></div><span>Analyzing...</span></div>
      <template x-if="$store.drugAnalysisModal.result">
        <div style="margin-top:12px">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            <div :class="'filter-card ' + ($store.drugAnalysisModal.result.pains_pass ? 'pass' : 'fail')"><div class="filter-title">PAINS</div><div class="filter-status" x-text="$store.drugAnalysisModal.result.pains_pass ? 'PASS' : 'FAIL'"></div><div class="filter-detail" x-show="!$store.drugAnalysisModal.result.pains_pass" x-text="$store.drugAnalysisModal.result.pains_flagged.join(', ')"></div></div>
            <div :class="'filter-card ' + ($store.drugAnalysisModal.result.brenk_pass ? 'pass' : 'fail')"><div class="filter-title">Brenk</div><div class="filter-status" x-text="$store.drugAnalysisModal.result.brenk_pass ? 'PASS' : 'FAIL'"></div><div class="filter-detail" x-show="!$store.drugAnalysisModal.result.brenk_pass" x-text="$store.drugAnalysisModal.result.brenk_flagged.join(', ')"></div></div>
            <div :class="'filter-card ' + ($store.drugAnalysisModal.result.nih_pass ? 'pass' : 'fail')"><div class="filter-title">NIH</div><div class="filter-status" x-text="$store.drugAnalysisModal.result.nih_pass ? 'PASS' : 'FAIL'"></div><div class="filter-detail" x-show="!$store.drugAnalysisModal.result.nih_pass" x-text="$store.drugAnalysisModal.result.nih_flagged.join(', ')"></div></div>
          </div>
          <p style="margin-top:8px;font-size:0.7rem;font-weight:600;text-align:center" :style="'color:' + ($store.drugAnalysisModal.result.overall_pass ? '#22c55e' : '#ff6b6b')" x-text="$store.drugAnalysisModal.result.overall_pass ? 'All filters passed' : 'Compound flagged by substructure filters'"></p>
        </div>
      </template>
    </div>
    <style>
      .dock-panel { display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background) }
      .panel-header { padding:14px 20px;border-bottom:1px solid var(--color-border);background:var(--color-panel) }
      .header-left { display:flex;align-items:center;gap:12px }
      .header-icon { font-size:28px;color:var(--color-primary) }
      .panel-header h2 { color:var(--color-text);font-size:1.05rem;margin:0;font-weight:700 }
      .header-subtitle { color:var(--color-text-muted);font-size:0.7rem;margin:0 }
      .panel-body { flex:1;overflow-y:auto;padding:16px 20px }
      .dock-error { padding:8px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:6px;color:#ff6b6b;font-size:0.68rem;margin-bottom:10px }
      .dock-loading { display:flex;align-items:center;gap:6px;padding:8px 0;font-size:0.7rem;color:var(--color-text-muted) }
      .loading-spinner { width:15px;height:15px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite }
      @keyframes spin { to { transform:rotate(360deg) } }
      .mt-input-row { display:flex;gap:6px;margin-bottom:8px;align-items:center }
      .mt-input { flex:1;padding:8px 10px;border:1px solid var(--color-border);border-radius:7px;background:var(--color-panel);color:var(--color-text);font-size:0.7rem;font-family:monospace }
      .mt-input:focus { outline:none;border-color:var(--color-primary) }
      .btn-run { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:10px;background:var(--color-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-size:0.8rem;font-weight:600 }
      .btn-run:disabled { opacity:0.5;cursor:not-allowed }
      .filter-card { padding:10px;border-radius:8px;text-align:center;border:2px solid transparent }
      .filter-card.pass { background:rgba(34,197,94,0.08);border-color:#22c55e40 }
      .filter-card.fail { background:rgba(255,107,107,0.08);border-color:#ff6b6b40 }
      .filter-title { font-size:0.65rem;font-weight:700;color:var(--color-text) }
      .filter-status { font-size:0.85rem;font-weight:700;margin-top:2px }
      .filter-card.pass .filter-status { color:#22c55e }
      .filter-card.fail .filter-status { color:#ff6b6b }
      .filter-detail { font-size:0.55rem;color:var(--color-text-muted);margin-top:2px }
    </style>
  </div>
</body>
</html>
