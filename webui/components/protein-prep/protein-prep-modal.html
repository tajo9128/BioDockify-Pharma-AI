<html>
<head><script type="module" src="/components/protein-prep/protein-prep-store.js"></script></head>
<body>
  <div x-data="proteinPrep" class="pp" x-init="init()">
    <div class="ph">
      <span class="material-symbols-outlined" style="font-size:22px;color:var(--color-primary)">cleaning_services</span>
      <div><h2>Protein Preparation</h2><p class="phs">PDBFixer · Repair & Protonate PDB Structures</p></div>
      <div x-show="loading" class="spinner"></div>
    </div>

    <div x-show="errorMessage" class="pe" x-text="errorMessage" @click="errorMessage=''"></div>

    <div class="pb">
      <!-- Upload -->
      <div x-show="!fileName" class="pu" @click="openFilePicker()">
        <span class="material-symbols-outlined" style="font-size:40px;opacity:0.5">folder_open</span>
        <span>Click to upload a PDB file</span>
        <small>Accepts .pdb · Repairs missing atoms, residues, and hydrogens</small>
      </div>

      <!-- Loaded -->
      <template x-if="fileName">
        <div>
          <div class="pi"><span class="material-symbols-outlined" style="font-size:14px;color:#22c55e">check_circle</span><b x-text="fileName"></b><button class="pl" @click="reset()">Clear</button></div>

          <div class="pc">
            <h4>Preparation Options</h4>
            <div class="pr"><label>pH <input type="number" x-model="ph" class="ps" style="width:55px" step="0.1" min="1" max="14"></label></div>
            <button class="prn" @click="prepare()" :disabled="loading" x-text="loading?'Preparing...':'Prepare Protein'"></button>
          </div>

          <!-- Results -->
          <template x-if="result">
            <div class="pc" style="border-left:3px solid var(--color-primary)">
              <h4>Preparation Complete</h4>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <div class="pmi"><small>Output</small><b x-text="result.output_path || '—'"></b></div>
                <div class="pmi"><small>pH</small><b x-text="result.ph || '—'"></b></div>
                <div class="pmi"><small>Status</small><b :style="{color:result.status==='ok'?'#22c55e':'#ef4444'}" x-text="result.status"></b></div>
              </div>
              <div style="display:flex;gap:6px;margin-top:6px">
                <button class="prn" style="flex:1" @click="download()">Download Prepared PDB</button>
                <button class="pl" style="flex:1" @click="saveToKB()">Save to KB</button>
              </div>
              <div x-show="result.error" style="margin-top:6px;font-size:0.55rem;color:var(--color-error-text);background:rgba(255,107,107,.05);padding:6px;border-radius:4px" x-text="result.error"></div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <style>
      .pp{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background)}
      .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--color-border);flex-shrink:0}
      .ph h2{font-size:0.85rem;margin:0;font-weight:700;color:var(--color-text)}.phs{font-size:0.5rem;color:var(--color-text-muted)}
      .pb{flex:1;overflow-y:auto;padding:12px 14px}
      .pu{display:flex;flex-direction:column;align-items:center;padding:40px;border:2px dashed var(--color-border);border-radius:10px;cursor:pointer;color:var(--color-text-muted);font-size:0.62rem;gap:4px}
      .pu:hover{border-color:var(--color-primary)}
      .pi{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:6px;margin-bottom:8px;font-size:0.62rem}
      .pc{padding:10px 12px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;margin-bottom:8px}
      .pc h4{font-size:0.62rem;font-weight:700;color:var(--color-text);margin:0 0 6px}
      .pr{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;font-size:0.54rem;color:var(--color-text-muted);align-items:center}
      .ps{padding:4px 6px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-background);color:var(--color-text);font-size:0.54rem}
      .prn{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 12px;background:var(--color-primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.6rem;font-weight:600;transition:.15s;width:100%}
      .prn:disabled{opacity:.4;cursor:default}
      .pmi{display:flex;flex-direction:column;align-items:center;padding:5px 8px;background:var(--color-background);border-radius:5px;min-width:70px;flex:1}
      .pmi small{font-size:0.42rem;color:var(--color-text-muted);text-transform:uppercase}.pmi b{font-size:0.62rem;color:var(--color-text)}
      .pe{padding:5px 12px;margin:6px 14px 0;background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.2);border-radius:5px;color:var(--color-error-text);font-size:0.58rem;cursor:pointer}
      .pl{padding:5px 10px;background:transparent;border:1px solid var(--color-border);border-radius:5px;color:var(--color-text-muted);cursor:pointer;font-size:0.56rem}
      .pl:hover{border-color:var(--color-primary);color:var(--color-primary)}
      .spinner{width:14px;height:14px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:spin .8s linear infinite;margin-left:auto}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </div>
</body>
</html>
