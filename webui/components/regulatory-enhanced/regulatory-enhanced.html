<html>
<head>
  <script type="module">
    import { createStore } from "/js/AlpineStore.js";
    import { callJsonApi } from "/js/api.js";
    export const store = createStore("regulatoryEnhancedModal", {
      activeTab: "ectd", loading: false, error: "", result: null,
      // eCTD
      ectdRegion: "ICH",
      // Stability
      stabProduct: "solid", stabCondition: "standard",
      // BE
      beTestCmax: "", beRefCmax: "", beTestAuc: "", beRefAuc: "",
      // IND/NDA
      indType: "IND",
      // ICH
      ichCategory: "",
      async loadEctd() {
        this.loading = true; this.error = "";
        try { this.result = await callJsonApi("regulatory_enhanced", { action: "ectd_structure", region: this.ectdRegion }); } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async loadIchi() {
        this.loading = true; this.error = "";
        try { this.result = await callJsonApi("regulatory_enhanced", { action: "ich_guidelines", category: this.ichCategory || "" }); } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async loadStability() {
        this.loading = true; this.error = "";
        try { this.result = await callJsonApi("regulatory_enhanced", { action: "stability_planner", product_type: this.stabProduct, storage_condition: this.stabCondition }); } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async runBE() {
        if (!this.beTestCmax || !this.beRefCmax) return;
        this.loading = true; this.error = "";
        try {
          this.result = await callJsonApi("regulatory_enhanced", { action: "be_report",
            test_cmax: this.beTestCmax.split(",").map(Number), ref_cmax: this.beRefCmax.split(",").map(Number),
            test_auc: this.beTestAuc ? this.beTestAuc.split(",").map(Number) : [], ref_auc: this.beRefAuc ? this.beRefAuc.split(",").map(Number) : [] });
        } catch(e) { this.error = e.message; }
        this.loading = false;
      },
      async loadChecklist() {
        this.loading = true; this.error = "";
        try { this.result = await callJsonApi("regulatory_enhanced", { action: "ind_nda_checklist", type: this.indType }); } catch(e) { this.error = e.message; }
        this.loading = false;
      }
    });
  </script>
</head>
<body>
  <div x-data class="dp-panel">
    <div class="dp-header">
      <span class="material-symbols-outlined dp-icon">gavel</span>
      <div><h2>Regulatory Affairs</h2><p class="dp-sub">eCTD structure, ICH guidelines, stability planning, BE reports, IND/NDA checklists</p></div>
    </div>
    <div class="dp-tabs">
      <button class="dp-tab" :class="{active:$store.regulatoryEnhancedModal.activeTab==='ectd'}" @click="$store.regulatoryEnhancedModal.activeTab='ectd'">eCTD/CTD</button>
      <button class="dp-tab" :class="{active:$store.regulatoryEnhancedModal.activeTab==='ich'}" @click="$store.regulatoryEnhancedModal.activeTab='ich'">ICH Guidelines</button>
      <button class="dp-tab" :class="{active:$store.regulatoryEnhancedModal.activeTab==='stability'}" @click="$store.regulatoryEnhancedModal.activeTab='stability'">Stability</button>
      <button class="dp-tab" :class="{active:$store.regulatoryEnhancedModal.activeTab==='be'}" @click="$store.regulatoryEnhancedModal.activeTab='be'">BE Report</button>
      <button class="dp-tab" :class="{active:$store.regulatoryEnhancedModal.activeTab==='checklist'}" @click="$store.regulatoryEnhancedModal.activeTab='checklist'">IND/NDA</button>
    </div>
    <div class="dp-body">
      <div x-show="$store.regulatoryEnhancedModal.error" class="dp-error" x-text="$store.regulatoryEnhancedModal.error"></div>
      <div x-show="$store.regulatoryEnhancedModal.loading" class="dp-loading"><div class="dp-spinner"></div> Loading...</div>
      <!-- eCTD -->
      <div x-show="$store.regulatoryEnhancedModal.activeTab==='ectd'">
        <div class="dp-card">
          <h3>Common Technical Document (CTD) Structure</h3>
          <div style="display:flex;gap:4px;margin-bottom:8px">
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ectdRegion==='ICH'}" @click="$store.regulatoryEnhancedModal.ectdRegion='ICH';$store.regulatoryEnhancedModal.loadEctd()">ICH</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ectdRegion==='FDA'}" @click="$store.regulatoryEnhancedModal.ectdRegion='FDA';$store.regulatoryEnhancedModal.loadEctd()">FDA</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ectdRegion==='EMA'}" @click="$store.regulatoryEnhancedModal.ectdRegion='EMA';$store.regulatoryEnhancedModal.loadEctd()">EMA</button>
          </div>
          <template x-if="$store.regulatoryEnhancedModal.result?.structure">
            <div class="dp-result">
              <template x-for="(mod, key) in $store.regulatoryEnhancedModal.result.structure" :key="key">
                <div style="margin-bottom:8px">
                  <b style="font-size:0.65rem;color:var(--color-primary)" x-text="key.replace('_',' ').toUpperCase() + ': ' + mod.title"></b>
                  <template x-for="item in mod.contents" :key="item">
                    <div style="font-size:0.55rem;color:var(--color-text-muted);padding-left:12px" x-text="item"></div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
      <!-- ICH Guidelines -->
      <div x-show="$store.regulatoryEnhancedModal.activeTab==='ich'">
        <div class="dp-card">
          <h3>ICH Guideline Navigator</h3>
          <div style="display:flex;gap:4px;margin-bottom:8px">
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ichCategory==='quality'}" @click="$store.regulatoryEnhancedModal.ichCategory='quality';$store.regulatoryEnhancedModal.loadIchi()">Quality</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ichCategory==='safety'}" @click="$store.regulatoryEnhancedModal.ichCategory='safety';$store.regulatoryEnhancedModal.loadIchi()">Safety</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.ichCategory==='clinical'}" @click="$store.regulatoryEnhancedModal.ichCategory='clinical';$store.regulatoryEnhancedModal.loadIchi()">Clinical</button>
          </div>
          <template x-if="$store.regulatoryEnhancedModal.result?.guidelines">
            <div class="dp-result">
              <template x-for="g in $store.regulatoryEnhancedModal.result.guidelines" :key="g.code">
                <div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--color-border)">
                  <b style="font-size:0.62rem" x-text="g.code"></b>
                  <span style="font-size:0.6rem" x-text="g.title"></span>
                  <div style="font-size:0.52rem;color:var(--color-text-muted);margin-top:2px" x-text="g.summary"></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
      <!-- Stability -->
      <div x-show="$store.regulatoryEnhancedModal.activeTab==='stability'">
        <div class="dp-card">
          <h3>ICH Stability Study Planner</h3>
          <div class="dp-grid">
            <div><label class="dp-label">Product type:</label>
              <select x-model="$store.regulatoryEnhancedModal.stabProduct" class="dp-input"><option value="solid">Solid (tablet/capsule)</option><option value="liquid">Liquid</option><option value="semisolid">Semisolid</option><option value="biological">Biological</option></select></div>
            <div><label class="dp-label">Condition:</label>
              <select x-model="$store.regulatoryEnhancedModal.stabCondition" class="dp-input"><option value="standard">Standard (25°C/40°C)</option><option value="accelerated">Accelerated (40°C/50°C)</option><option value="photostability">Photostability (ICH Q1B)</option><option value="biological">Biological (refrigerated/frozen)</option></select></div>
          </div>
          <button class="dp-btn" @click="$store.regulatoryEnhancedModal.loadStability()" :disabled="$store.regulatoryEnhancedModal.loading">Generate Plan</button>
          <template x-if="$store.regulatoryEnhancedModal.result?.conditions">
            <div class="dp-result">
              <template x-for="c in $store.regulatoryEnhancedModal.result.conditions" :key="c.condition">
                <div style="margin-bottom:6px;padding:6px;border:1px solid var(--color-border);border-radius:4px">
                  <b style="font-size:0.6rem" x-text="c.condition"></b>
                  <div style="font-size:0.52rem;color:var(--color-text-muted)">
                    <span x-text="c.purpose"></span>
                    <span x-show="c.months"> | Time points: <span x-text="c.months?.join(', ')"></span></span>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
      <!-- BE Report -->
      <div x-show="$store.regulatoryEnhancedModal.activeTab==='be'">
        <div class="dp-card">
          <h3>Bioequivalence Report (FDA/EMA)</h3>
          <label class="dp-label">Test Cmax values (comma-separated):</label>
          <input type="text" x-model="$store.regulatoryEnhancedModal.beTestCmax" class="dp-input" placeholder="12.5,14.2,11.8,13.1,12.9" />
          <label class="dp-label">Reference Cmax values:</label>
          <input type="text" x-model="$store.regulatoryEnhancedModal.beRefCmax" class="dp-input" placeholder="13.0,13.8,12.5,13.2,12.7" />
          <label class="dp-label">Test AUC values (optional):</label>
          <input type="text" x-model="$store.regulatoryEnhancedModal.beTestAuc" class="dp-input" placeholder="95.2,102.1,88.7" />
          <label class="dp-label">Reference AUC values (optional):</label>
          <input type="text" x-model="$store.regulatoryEnhancedModal.beRefAuc" class="dp-input" placeholder="98.5,100.3,92.1" />
          <button class="dp-btn" @click="$store.regulatoryEnhancedModal.runBE()" :disabled="$store.regulatoryEnhancedModal.loading">Generate BE Report</button>
          <template x-if="$store.regulatoryEnhancedModal.result?.Cmax">
            <div class="dp-result">
              <b style="font-size:0.7rem">Cmax</b>
              <div class="dp-stat"><span class="dp-stat-label">GMR</span><span class="dp-stat-val" x-text="$store.regulatoryEnhancedModal.result.Cmax.gmr_percent + '%'"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">90% CI</span><span class="dp-stat-val" x-text="$store.regulatoryEnhancedModal.result.Cmax.ci_90_lower + '% — ' + $store.regulatoryEnhancedModal.result.Cmax.ci_90_upper + '%'"></span></div>
              <div class="dp-stat"><span class="dp-stat-label">Verdict</span><span class="dp-stat-val" :class="{good:$store.regulatoryEnhancedModal.result.Cmax.within_80_125}" x-text="$store.regulatoryEnhancedModal.result.Cmax.verdict"></span></div>
              <template x-if="$store.regulatoryEnhancedModal.result.AUC">
                <div style="margin-top:8px">
                  <b style="font-size:0.7rem">AUC</b>
                  <div class="dp-stat"><span class="dp-stat-label">GMR</span><span class="dp-stat-val" x-text="$store.regulatoryEnhancedModal.result.AUC.gmr_percent + '%'"></span></div>
                  <div class="dp-stat"><span class="dp-stat-label">90% CI</span><span class="dp-stat-val" x-text="$store.regulatoryEnhancedModal.result.AUC.ci_90_lower + '% — ' + $store.regulatoryEnhancedModal.result.AUC.ci_90_upper + '%'"></span></div>
                  <div class="dp-stat"><span class="dp-stat-label">Verdict</span><span class="dp-stat-val" :class="{good:$store.regulatoryEnhancedModal.result.AUC.within_80_125}" x-text="$store.regulatoryEnhancedModal.result.AUC.verdict"></span></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
      <!-- IND/NDA Checklist -->
      <div x-show="$store.regulatoryEnhancedModal.activeTab==='checklist'">
        <div class="dp-card">
          <h3>Submission Checklist Generator</h3>
          <div style="display:flex;gap:4px;margin-bottom:8px">
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.indType==='IND'}" @click="$store.regulatoryEnhancedModal.indType='IND';$store.regulatoryEnhancedModal.loadChecklist()">IND</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.indType==='NDA'}" @click="$store.regulatoryEnhancedModal.indType='NDA';$store.regulatoryEnhancedModal.loadChecklist()">NDA</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.indType==='ANDA'}" @click="$store.regulatoryEnhancedModal.indType='ANDA';$store.regulatoryEnhancedModal.loadChecklist()">ANDA</button>
            <button class="dp-chip" :class="{active:$store.regulatoryEnhancedModal.indType==='505b2'}" @click="$store.regulatoryEnhancedModal.indType='505b2';$store.regulatoryEnhancedModal.loadChecklist()">505(b)(2)</button>
          </div>
          <template x-if="$store.regulatoryEnhancedModal.result?.checklist">
            <div class="dp-result">
              <template x-for="(items, section) in $store.regulatoryEnhancedModal.result.checklist" :key="section">
                <div style="margin-bottom:10px">
                  <b style="font-size:0.65rem;color:var(--color-primary)" x-text="section.replace(/_/g,' ').toUpperCase()"></b>
                  <template x-for="item in items" :key="item">
                    <div style="font-size:0.58rem;color:var(--color-text);padding:2px 0 2px 12px" x-text="'☐ ' + item"></div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
    <style>
      .dp-panel{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--color-background)}
      .dp-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0}
      .dp-icon{font-size:24px;color:var(--color-primary)}
      .dp-header h2{font-size:0.95rem;margin:0;font-weight:700;color:var(--color-text)}
      .dp-sub{font-size:0.6rem;color:var(--color-text-muted);margin:0}
      .dp-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--color-border);background:var(--color-panel);flex-shrink:0;flex-wrap:wrap}
      .dp-tab{padding:5px 10px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);font-size:0.6rem;cursor:pointer;border-radius:12px}
      .dp-tab.active{background:var(--color-primary);color:white;border-color:var(--color-primary)}
      .dp-body{flex:1;overflow-y:auto;padding:12px 16px}
      .dp-card{background:var(--color-panel);border:1px solid var(--color-border);border-radius:8px;padding:14px;margin-bottom:10px}
      .dp-card h3{font-size:0.8rem;margin:0 0 8px 0;color:var(--color-text)}
      .dp-label{font-size:0.62rem;font-weight:600;color:var(--color-text);margin-bottom:3px;display:block}
      .dp-input{width:100%;padding:7px 10px;border:1px solid var(--color-border);border-radius:5px;background:var(--color-background);color:var(--color-text);font-size:0.65rem;font-family:monospace;box-sizing:border-box;margin-bottom:8px}
      .dp-input:focus{outline:none;border-color:var(--color-primary)}
      .dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .dp-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:var(--color-primary);border:none;border-radius:6px;color:white;font-size:0.7rem;font-weight:600;cursor:pointer;margin-top:6px}
      .dp-btn:disabled{opacity:0.5;cursor:not-allowed}
      .dp-chip{padding:5px 10px;border:1px solid var(--color-border);background:var(--color-panel);color:var(--color-text);font-size:0.6rem;cursor:pointer;border-radius:12px}
      .dp-chip.active{background:var(--color-primary);color:white;border-color:var(--color-primary)}
      .dp-error{padding:7px 10px;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);border-radius:5px;color:#ff6b6b;font-size:0.6rem;margin-bottom:8px}
      .dp-loading{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;font-size:0.65rem;color:var(--color-text-muted)}
      .dp-spinner{width:14px;height:14px;border:2px solid var(--color-border);border-top:2px solid var(--color-primary);border-radius:50%;animation:dpspin 0.8s linear infinite}
      @keyframes dpspin{to{transform:rotate(360deg)}}
      .dp-result{margin-top:10px;padding:10px;background:var(--color-background);border:1px solid var(--color-border);border-radius:6px}
      .dp-stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--color-border)}
      .dp-stat:last-child{border-bottom:none}
      .dp-stat-label{font-size:0.6rem;color:var(--color-text-muted);font-weight:600}
      .dp-stat-val{font-size:0.65rem;color:var(--color-text);font-weight:600}
      .dp-stat-val.good{color:#22c55e}
    </style>
  </div>
</body>
</html>
