[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodockify-pharma-ai"
version = "6.4.0"
description = "AI Research Assistant for Pharmaceutical Sciences — molecular docking, QSAR, statistics, knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
docking = [
    "meeko>=0.5.0",
    "scipy",
]
stats = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
