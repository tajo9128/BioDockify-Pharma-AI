name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: "Force specific version (e.g. v1.0.8). Leaves empty for auto-increment."
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: tajo9128/biodockify-pharma-ai
  GHCR_IMAGE: ghcr.io/tajo9128/biodockify-pharma-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get or create version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            VERSION="${{ github.event.inputs.force_version }}"
          else
            RAW_VERSION=$(cat version_info.txt | tr -d '[:space:]')
            if [ -z "$RAW_VERSION" ]; then
              echo "ERROR: version_info.txt is empty"; exit 1
            fi
            if [[ "$RAW_VERSION" != v* ]]; then
              VERSION="v$RAW_VERSION"
            else
              VERSION="$RAW_VERSION"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating version: $VERSION (from version_info.txt)"

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -d ${{ steps.version.outputs.version }} 2>/dev/null || true
          git push origin :refs/tags/${{ steps.version.outputs.version }} 2>/dev/null || true
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.version }}

      - name: Free up disk space on runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean -y
          sudo apt-get autoremove -y
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1: Build and push full image to GHCR (all layers preserved for debugging)
      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/tajo9128/biodockify-pharma-ai:${{ steps.version.outputs.version }}
            ghcr.io/tajo9128/biodockify-pharma-ai:latest
            ghcr.io/tajo9128/biodockify-pharma-ai:dev
          labels: |
            org.opencontainers.image.title=BioDockify AI
            org.opencontainers.image.description=Pharma research distribution of BioDockify AI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Step 2: Flatten image for Docker Hub (487 layers → 1 layer)
      # Docker Desktop hangs on "loading tags" when manifests have hundreds of layers.
      # crane flatten squashes all layers while preserving image config (CMD, ENV, etc).
      - name: Install crane
        run: |
          CRANE_VERSION=$(curl -s "https://api.github.com/repos/google/go-containerregistry/releases/latest" | jq -r '.tag_name')
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xzf - crane
          chmod +x crane && sudo mv crane /usr/local/bin/
          crane version

      - name: Flatten and push to Docker Hub
        run: |
          echo "Flattening ghcr.io image (487 layers → 1 layer) for Docker Hub..."
          crane flatten ghcr.io/tajo9128/biodockify-pharma-ai:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Pushing dev tag..."
          crane tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest dev
          echo "Docker Hub push complete (single-layer image)"
          echo "Verifying layer count..."
          crane manifest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest | jq '.layers | length'

      - name: Verify packages in built image
        run: |
          echo "Running package verification..."
          docker pull ghcr.io/tajo9128/biodockify-pharma-ai:latest
          docker run --rm ghcr.io/tajo9128/biodockify-pharma-ai:latest /exe/verify_packages.sh || echo "WARNING: Some packages missing — check logs above"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## BioDockify AI ${{ steps.version.outputs.version }}

            **Pharmaceutical research distribution of [BioDockify Pharma AI](https://github.com/tajo9128/BioDockify-Pharma-AI)**

            ### Docker (recommended)
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker run -d -p 80:80 -v biodockify_data:/a0/usr --name biodockify --restart unless-stopped ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ```

            ### Windows one-click
            Download `install.bat` from this repo and double-click it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
