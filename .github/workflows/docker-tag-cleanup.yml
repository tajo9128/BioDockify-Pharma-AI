name: Prune old Docker Hub tags

# Keeps the Docker Hub tag list small so Docker Desktop's search/Pull UI
# stays responsive. A repo with hundreds of tags makes the GUI hang on
# "loading tags" forever, even though CLI pulls keep working.
on:
  workflow_dispatch:
    inputs:
      keep_versions:
        description: "How many most-recent version tags (vX.Y.Z) to keep"
        required: false
        default: "15"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-tag-cleanup.yml"
  schedule:
    - cron: "0 3 1 * *"  # monthly, keep the list trimmed

env:
  REGISTRY_NAMESPACE: tajo9128
  IMAGE_NAME: biodockify-pharma-ai

jobs:
  prune-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub API
        run: |
          TOKEN=$(curl -sf -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ secrets.DOCKER_USERNAME }}\", \"password\": \"${{ secrets.DOCKER_PASSWORD }}\"}" \
            | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Docker Hub login failed — check DOCKER_USERNAME/DOCKER_PASSWORD secrets"; exit 1
          fi
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Logged in to Docker Hub API"

      - name: Collect all tags
        run: |
          REPO="$REGISTRY_NAMESPACE/$IMAGE_NAME"
          PAGE="https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100"
          : > tags.tsv
          while [ -n "$PAGE" ] && [ "$PAGE" != "null" ]; do
            RESP=$(curl -sf -H "Authorization: Bearer $TOKEN" "$PAGE")
            echo "$RESP" | jq -r '.results[] | [.name, .tag_last_pushed] | @tsv' >> tags.tsv
            PAGE=$(echo "$RESP" | jq -r '.next // empty')
          done
          TOTAL=$(wc -l < tags.tsv)
          echo "Found $TOTAL tags"
          echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"

      - name: Delete old tags
        run: |
          REPO="$REGISTRY_NAMESPACE/$IMAGE_NAME"
          KEEP=${{ github.event.inputs.keep_versions || '15' }}
          # Always-pinned tags, then the newest KEEP version tags by push date
          grep -E '^v[0-9]+\.' tags.tsv | sort -t$'\t' -k2,2r > versions.tsv
          head -n "$KEEP" versions.tsv | cut -f1 > keep.txt
          printf 'latest\ndev\n' >> keep.txt
          echo "Keeping:"; cat keep.txt | sort | sed 's/^/  /'

          DELETED=0
          while IFS=$'\t' read -r TAG DATE; do
            if grep -qxF "$TAG" keep.txt; then continue; fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$TAG/")
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              DELETED=$((DELETED+1))
            else
              echo "WARN: could not delete $TAG (HTTP $CODE)"
            fi
            sleep 0.15
          done < tags.tsv
          echo "Deleted $DELETED of $TOTAL tags"

      - name: Final tag count
        run: |
          REMAINING=$(curl -sf "https://hub.docker.com/v2/repositories/$REGISTRY_NAMESPACE/$IMAGE_NAME/tags/count" | jq -r '.count')
          echo "Tags remaining on Docker Hub: $REMAINING"
