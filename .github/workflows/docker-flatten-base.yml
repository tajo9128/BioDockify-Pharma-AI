name: Flatten Docker Hub image

# Replaces the 487-layer :latest/:dev with a single-layer image so Docker
# Desktop can load tags and show the Pull button instantly.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag to flatten (default: latest)"
        required: false
        default: "latest"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-flatten-base.yml"
      - "Dockerfile.flatten"

env:
  IMAGE: tajo9128/biodockify-pharma-ai

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean -y && sudo apt-get autoremove -y
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Flatten and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.flatten
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            SRCTAG=${{ env.IMAGE }}:${{ github.event.inputs.source_tag || 'latest' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:dev

      - name: Verify layer count
        run: |
          LAYERS=$(docker buildx imagetools inspect "$IMAGE:latest" --raw | jq '.layers | length')
          echo "Image layers after flatten: $LAYERS"
          [ "$LAYERS" -le 2 ] || { echo "ERROR: expected ≤2 layers, got $LAYERS"; exit 1; }
