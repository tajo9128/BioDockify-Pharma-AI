name: Flatten base image (one-time)

# The self-referential build chain (each release FROM the previous) accumulated
# 487 layers. Docker Desktop's containerd snapshotter cannot mount it:
# "failed to mount ...: mount options is too long". This squashes the current
# image into ONE layer and pushes it as tag `base`. Releases then build
# FROM :base and stay thin (~10 layers) forever.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing tag to flatten"
        required: false
        default: "v7.30.4"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-flatten-base.yml"

env:
  IMAGE: tajo9128/biodockify-pharma-ai

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean -y && sudo apt-get autoremove -y
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull source image
        run: |
          SRC="${{ github.event.inputs.source_tag || 'v7.30.4' }}"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          docker pull "$IMAGE:$SRC"

      - name: Flatten to a single layer (export | import)
        run: |
          docker create --name flat "$IMAGE:$SRC"
          docker export flat | docker import - "$IMAGE:single"
          docker rm flat
          docker rmi "$IMAGE:$SRC"   # free the 487-layer copy before pushing
          docker tag "$IMAGE:single" "$IMAGE:base"
          docker rmi "$IMAGE:single"

      - name: Push base tag
        run: docker push "$IMAGE:base"

      - name: Verify layer count
        run: |
          docker pull "$IMAGE:base"
          LAYERS=$(docker image inspect "$IMAGE:base" --format '{{len .RootFS.Layers}}')
          echo "Base image layers: $LAYERS"
          [ "$LAYERS" -le 2 ] || { echo "ERROR: expected 1 layer, got $LAYERS"; exit 1; }
