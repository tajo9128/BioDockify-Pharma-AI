name: Flatten base image (one-time)

# Squashes the 487-layer chained image into a ONE-layer `base` tag via BuildKit
# (plain docker pull fails on the runner with "max depth exceeded").
# Releases then build FROM :base and stay thin (~10 layers) forever.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing tag to flatten"
        required: false
        default: "v7.30.4"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-flatten-base.yml"
      - "Dockerfile.flatten"

env:
  IMAGE: tajo9128/biodockify-pharma-ai

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean -y && sudo apt-get autoremove -y
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Flatten and push single-layer base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.flatten
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            SRCTAG=${{ github.event.inputs.source_tag || 'v7.30.4' }}
          tags: ${{ env.IMAGE }}:base

      - name: Verify layer count via BuildKit manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:base" --format '{{ json .Manifest.Layers }}' | python3 -c "
import json,sys
layers = json.load(sys.stdin)
print(f'Base image layers: {len(layers)}')
assert len(layers) <= 2, f'expected 1 layer, got {len(layers)}'"
