version: '3.8'

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BioDockify Pharma AI — Docker Configuration                           ║
# ║                                                                          ║
# ║  ⚠️  YOU MUST USE ALL 3 VOLUMES BELOW. Without them, research data is  ║
# ║     lost when the container is deleted. This includes knowledge base,    ║
# ║     agent memory, chats, settings, AND backups.                         ║
# ║                                                                          ║
# ║  ✅ WITH volumes: data persists forever across container restarts/updates║
# ║  ❌ WITHOUT volumes: ALL data is gone on container delete               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  biodockify:
    image: tajo9128/biodockify-pharma-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: biodockify
    ports:
      # Direct access: open http://localhost in your browser
      - "80:50001"
    volumes:
      # === ALL 3 REQUIRED VOLUMES (data persists across container deletion) ===
      - biodockify_usr:/a0/usr          # workspace, chats, projects, plugins, backups
      - biodockify_data:/a0/data        # knowledge base, deep research sessions
      - biodockify_a0proj:/a0/.a0proj   # agent memory (FAISS), instructions, project config

      # === RECOMMENDED: Mount host folder so backups appear on your PC ===
      - ~/biodockify-backups:/a0/usr/backups

    environment:
      - PORT=50001
      - TZ=Asia/Kolkata

      # === OPTIONAL: LLM PROVIDERS ===
      # Set API keys for your preferred LLM providers (these override manual entry in Settings UI)
      # - OPENAI_API_KEY=sk-your-key-here
      # - ANTHROPIC_API_KEY=sk-ant-your-key-here
      # - DEEPSEEK_API_KEY=sk-your-key-here
      # - OPENROUTER_API_KEY=sk-or-your-key-here
      # - GEMINI_API_KEY=your-key-here
      # - GROQ_API_KEY=gsk_your-key-here

      # === OPTIONAL: LOCAL LLM (Ollama) ===
      # If running Ollama on your host machine, uncomment and configure:
      # - OLLAMA_URL=http://host.docker.internal:11434

      # === OPTIONAL: SEARXNG INSTANCE ===
      # BioDockify includes a built-in SearXNG instance for web search.
      # To use your own external SearXNG instance:
      # - SEARXNG_URL=http://your-searxng-instance:8888

      # === OPTIONAL: MEMORY CONFIGURATION ===
      # - MEMORY_SUBDIR=my_research_project  # Isolate memory by project name

      # === OPTIONAL: DEPLOYMENT ===
      # - AUTH_TOKEN=your-auth-token         # Enable authentication
      # - LOG_LEVEL=DEBUG                    # DEBUG, INFO, WARNING, ERROR

    extra_hosts:
      # Allows the container to access host services via "host.docker.internal"
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    # Optional: resource limits (prevents container from using all system memory)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
    #       cpus: '4'

    # === OPTIONAL DEPENDENCY: BioDockify AI Engine (local LLM sidecar) ===
    # Not required for normal operation. Set required: false so biodockify
    # still starts even if the sidecar is disabled / uninstalled.
    depends_on:
      llama-server:
        condition: service_started
        required: false

  # ===========================================================================
  # BioDockify AI Engine — local LLM sidecar (OPT-IN via --profile local-llm)
  # ============================================================================
  # Runs Bonsai-8B (or any future model from modules/local_llm/models.json)
  # privately on your machine. Used for air-gapped pharma research labs and
  # private inference with no PHI/compound egress.
  #
  # Activation:
  #   1) bash scripts/install_bonsai.sh    (Linux/macOS)
  #      scripts\install_bonsai.bat        (Windows)
  #   2) docker compose --profile local-llm up -d
  #
  # Deactivation / removal:
  #   docker compose --profile local-llm stop llama-server
  #   docker volume rm biodockify_models
  #
  # Default `docker compose up` (no profile) does NOT start this service.
  # The model lives in a named volume so image updates never re-download it.
  # ===========================================================================
  llama-server:
    # Official llama.cpp server image (CPU, multi-arch: linux/amd64 + linux/arm64).
    # For NVIDIA GPU acceleration, swap to: ghcr.io/ggerganov/llama.cpp:server-cuda
    # and add `deploy.resources.reservations.devices` (see troubleshooting doc).
    # NOTE: there is no `server-light` tag — `server` IS the slim server-only image.
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: biodockify-llama-server
    profiles: ["local-llm"]
    ports:
      # Host 8081 -> sidecar 8080. Choose 8081 to avoid clashes with common dev ports.
      - "8081:8080"
    volumes:
      - biodockify_models:/models
    # The server image's entrypoint is /app/llama-server, which takes CLI args
    # (NOT env vars). Args here match the upstream docs:
    #   https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
    command:
      - "-m"
      - "/models/bonsai-8b-Q1_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "32768"
      - "-a"
      - "bonsai-8b"   # published as model id in /v1/models (must match preset)
    healthcheck:
      # /health endpoint is provided by llama-server. Pure-bash TCP+HTTP probe —
      # avoids depending on wget/curl being present in the slim server image.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

volumes:
  biodockify_usr:
    # User workspace, chats, projects, plugins, backups
    name: biodockify_usr
  biodockify_data:
    # Knowledge base, deep research sessions
    name: biodockify_data
  biodockify_a0proj:
    # Agent memory (FAISS vector DB), instructions, project config
    name: biodockify_a0proj
  biodockify_models:
    # BioDockify AI Engine — local LLM weights (GGUF). Populated by
    # scripts/install_bonsai.sh / .bat. Lives outside the image so updates
    # never re-download multi-GB models.
    name: biodockify_models
