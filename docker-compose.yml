# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BioDockify Pharma AI — Docker Configuration                           ║
# ║                                                                          ║
# ║  Students: just run `docker compose up -d` and open http://localhost    ║
# ║  Everything is automatic:                                                ║
# ║    ✓ BioDockify starts with all 8 department modules                     ║
# ║    ✓ Cloud or local Ollama/LM Studio LLM (user's choice)                ║
# ║    ✓ No scripts, no profiles, no technical knowledge needed              ║
# ║                                                                          ║
# ║  ⚠️  THE -v FLAG IS REQUIRED. Without it, ALL data is lost on delete.   ║
# ║                                                                          ║
# ║  Data lives in named volume `biodockify_pharma_usr`.                     ║
# ║  Backups go to ~/biodockify-backups on your PC.                          ║
# ║  Use the in-app Backup panel to save/restore.                            ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  biodockify:
    image: tajo9128/biodockify-pharma-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: biodockify
    ports:
      - "80:80"
    volumes:
      # === ALL PERSISTENT DATA ===
      - biodockify_pharma_usr:/a0/usr

      # === BACKUPS ON YOUR PC ===
      - ~/biodockify-backups:/a0/usr/backups

      # === DOCKER SOCKET (for Backup & Restore volume listing) ===
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - PORT=50001
      - TZ=Asia/Kolkata

      # === OPTIONAL: LLM PROVIDERS (cloud — fully optional) ===
      # - OPENAI_API_KEY=sk-your-key-here
      # - ANTHROPIC_API_KEY=sk-ant-your-key-here
      # - DEEPSEEK_API_KEY=sk-your-key-here
      # - OPENROUTER_API_KEY=sk-or-your-key-here
      # - GEMINI_API_KEY=your-key-here
      # - GROQ_API_KEY=gsk_your-key-here

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  biodockify_pharma_usr:
    name: biodockify_pharma_usr
