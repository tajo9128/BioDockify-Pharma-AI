version: '3.8'

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BioDockify Pharma AI — Docker Configuration                           ║
# ║                                                                          ║
# ║  ⚠️  YOU MUST USE ALL 3 VOLUMES BELOW. Without them, research data is  ║
# ║     lost when the container is deleted. This includes knowledge base,    ║
# ║     agent memory, chats, settings, AND backups.                         ║
# ║                                                                          ║
# ║  ✅ WITH volumes: data persists forever across container restarts/updates║
# ║  ❌ WITHOUT volumes: ALL data is gone on container delete               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  biodockify:
    image: tajo9128/biodockify-pharma-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: biodockify
    ports:
      # Direct access: open http://localhost in your browser
      - "80:50001"
    volumes:
      # === ALL 3 REQUIRED VOLUMES (data persists across container deletion) ===
      - biodockify_usr:/a0/usr          # workspace, chats, projects, plugins, backups
      - biodockify_data:/a0/data        # knowledge base, deep research sessions
      - biodockify_a0proj:/a0/.a0proj   # agent memory (FAISS), instructions, project config

      # === RECOMMENDED: Mount host folder so backups appear on your PC ===
      - ~/biodockify-backups:/a0/usr/backups

    environment:
      - PORT=50001
      - TZ=Asia/Kolkata

      # === OPTIONAL: LLM PROVIDERS ===
      # Set API keys for your preferred LLM providers (these override manual entry in Settings UI)
      # - OPENAI_API_KEY=sk-your-key-here
      # - ANTHROPIC_API_KEY=sk-ant-your-key-here
      # - DEEPSEEK_API_KEY=sk-your-key-here
      # - OPENROUTER_API_KEY=sk-or-your-key-here
      # - GEMINI_API_KEY=your-key-here
      # - GROQ_API_KEY=gsk_your-key-here

      # === OPTIONAL: LOCAL LLM (Ollama) ===
      # If running Ollama on your host machine, uncomment and configure:
      # - OLLAMA_URL=http://host.docker.internal:11434

      # === OPTIONAL: SEARXNG INSTANCE ===
      # BioDockify includes a built-in SearXNG instance for web search.
      # To use your own external SearXNG instance:
      # - SEARXNG_URL=http://your-searxng-instance:8888

      # === OPTIONAL: MEMORY CONFIGURATION ===
      # - MEMORY_SUBDIR=my_research_project  # Isolate memory by project name

      # === OPTIONAL: DEPLOYMENT ===
      # - AUTH_TOKEN=your-auth-token         # Enable authentication
      # - LOG_LEVEL=DEBUG                    # DEBUG, INFO, WARNING, ERROR

    extra_hosts:
      # Allows the container to access host services via "host.docker.internal"
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    # Optional: resource limits (prevents container from using all system memory)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
    #       cpus: '4'

volumes:
  biodockify_usr:
    # User workspace, chats, projects, plugins, backups
    name: biodockify_usr
  biodockify_data:
    # Knowledge base, deep research sessions
    name: biodockify_data
  biodockify_a0proj:
    # Agent memory (FAISS vector DB), instructions, project config
    name: biodockify_a0proj
