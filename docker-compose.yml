version: '3.8'

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BioDockify Pharma AI — Docker Configuration                           ║
# ║                                                                          ║
# ║  Students: just run `docker compose up -d` and open http://localhost    ║
# ║  Everything is automatic:                                                ║
# ║    ✓ BioDockify starts with all 8 department modules                     ║
# ║    ✓ Cloud or local Ollama/LM Studio LLM (user's choice)                ║
# ║    ✓ No scripts, no profiles, no technical knowledge needed              ║
# ║                                                                          ║
# ║  ⚠️  YOU MUST USE THE VOLUME BELOW. Without it, ALL research data is    ║
# ║     lost when the container is deleted. This includes knowledge base,    ║
# ║     agent memory, chats, settings, AND backups.                          ║
# ║                                                                          ║
# ║  ✅ WITH volumes: data persists forever across container restarts/updates║
# ║  ❌ WITHOUT volumes: ALL data is gone on container delete               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  biodockify:
    image: tajo9128/biodockify-pharma-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: biodockify
    ports:
      # Direct access: open http://localhost in your browser
      # Container listens on port 80 internally (uvicorn binds 0.0.0.0:80)
      - "80:80"
    volumes:
      # === REQUIRED VOLUME (data persists across container deletion) ===
      - biodockify_pharma_usr:/a0/usr   # ALL data: workspace, chats, projects, plugins, knowledge base, agent memory

      # === RECOMMENDED: Mount host folder so backups appear on your PC ===
      - ~/biodockify-backups:/a0/usr/backups

      # === DOCKER SOCKET (required for Backup & Restore volume listing) ===
      # Gives the container permission to list, inspect, and restore Docker volumes.
      # Without this mount the "Restore from Docker Volume" feature cannot see your volumes.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - PORT=50001
      - TZ=Asia/Kolkata

      # === OPTIONAL: LLM PROVIDERS (cloud — fully optional, not required) ===
      # BioDockify works fully offline with the bundled Bonsai-8B local engine.
      # Set API keys ONLY if you want to ALSO use cloud models (Claude, GPT, etc.)
      # - OPENAI_API_KEY=sk-your-key-here
      # - ANTHROPIC_API_KEY=sk-ant-your-key-here
      # - DEEPSEEK_API_KEY=sk-your-key-here
      # - OPENROUTER_API_KEY=sk-or-your-key-here
      # - GEMINI_API_KEY=your-key-here
      # - GROQ_API_KEY=gsk_your-key-here

      # === OPTIONAL: SEARXNG INSTANCE ===
      # BioDockify includes a built-in SearXNG instance for web search.
      # To use your own external SearXNG instance:
      # - SEARXNG_URL=http://your-searxng-instance:8888

      # === OPTIONAL: MEMORY CONFIGURATION ===
      # - MEMORY_SUBDIR=my_research_project  # Isolate memory by project name

      # === OPTIONAL: DEPLOYMENT ===
      # - AUTH_TOKEN=your-auth-token         # Enable authentication
      # - LOG_LEVEL=DEBUG                    # DEBUG, INFO, WARNING, ERROR

    extra_hosts:
      # Allows the container to access host services via "host.docker.internal"
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  biodockify_pharma_usr:
    # ALL persistent data: workspace, chats, projects, plugins, knowledge base, agent memory
    external: true
