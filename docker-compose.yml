# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BioDockify Pharma AI — Docker Configuration                           ║
# ║                                                                          ║
# ║  Students: just run `docker compose up -d` and open http://localhost    ║
# ║  Everything is automatic:                                                ║
# ║    ✓ BioDockify starts with all 8 department modules                     ║
# ║    ✓ Cloud or local Ollama/LM Studio LLM (user's choice)                ║
# ║    ✓ No scripts, no profiles, no technical knowledge needed              ║
# ║                                                                          ║
# ║  ⚠️  THE -v FLAGS ARE REQUIRED. Without them, ALL data is lost.         ║
# ║                                                                          ║
# ║  HOW IT WORKS:                                                           ║
# ║    • ALL your research data lives in a folder on YOUR PC (host path)     ║
# ║    • Backups go to a second folder on YOUR PC                            ║
# ║    • Delete the container? Your data is safe on your PC.                 ║
# ║    • Recreate the container → point to the same folders → done.          ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  biodockify:
    image: tajo9128/biodockify-pharma-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: biodockify
    ports:
      # SECURITY: 127.0.0.1 = localhost only. Change to "80:80" ONLY if you
      # need LAN access AND have set AUTH_LOGIN + AUTH_PASSWORD below.
      - "127.0.0.1:80:80"
    volumes:
      # ═══════════════════════════════════════════════════════════════════
      #  CHANGE THESE 2 PATHS TO YOUR OWN PC FOLDERS
      #
      #  ⚠️  Windows users: use FORWARD SLASHES (F:/folder) NOT backslashes
      #     Copy path from Explorer → replace all \ with /
      #     Example: F:\biodockify_pharma_usr → F:/biodockify_pharma_usr
      # ═══════════════════════════════════════════════════════════════════

      # 1) ALL DATA — workspace, chats, knowledge base, agent memory, plugins
      #    Host path:  YOUR folder on your PC (create it first)
      #    Container:  /a0/usr (do not change)
      #
      #    Windows:  - F:/biodockify_pharma_usr:/a0/usr
      #    Mac/Linux: - ~/biodockify_pharma_usr:/a0/usr
      - F:/biodockify_pharma_usr:/a0/usr

      # 2) BACKUPS — auto-backups + manual saves go here
      #    Host path:  YOUR backup folder on your PC (create it first)
      #    Container:  /app/data (do not change)
      #
      #    Windows:  - F:/biodockify-backups:/app/data
      #    Mac/Linux: - ~/biodockify-backups:/app/data
      - F:/biodockify-backups:/app/data

      # SECURITY: Docker socket removed — was a host-takeover vector
      # (root in container + docker.sock = full host control).
      # If you need Docker volume backup, mount it selectively.

    environment:
      - PORT=50001
      - TZ=Asia/Kolkata

      # === OPTIONAL: LLM PROVIDERS (cloud — fully optional) ===
      # - OPENAI_API_KEY=sk-your-key-here
      # - ANTHROPIC_API_KEY=sk-ant-your-key-here
      # - DEEPSEEK_API_KEY=sk-your-key-here
      # - OPENROUTER_API_KEY=sk-or-your-key-here
      # - GEMINI_API_KEY=your-key-here
      # - GROQ_API_KEY=gsk_your-key-here

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # GPU passthrough — required for MD Lite (molecular dynamics)
    # Requires NVIDIA Container Toolkit on host.
    # If no NVIDIA GPU, comment out deploy block — everything else works without it.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped
